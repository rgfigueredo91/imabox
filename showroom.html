/* ══════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════ */
const state = {
    phase:          "landing",
    activeFloor:    null,
    activeSlot:     "a",
    openUnit:       null,
    openFloor:      null,
    currentTourUrl: null,
    lang:           (location.hash === "#esp") ? "esp" : "eng",
};

const $ = id => document.getElementById(id);
const scene   = $("sr-scene");
const btnBack = $("sr-btn-back");
const imgA    = $("sr-floor-img-a");
const imgB    = $("sr-floor-img-b");

/* ══════════════════════════════════════════════════════════════
   TRANSLATIONS
══════════════════════════════════════════════════════════════ */
const TEXTS = {
    eng: { enter: "Enter",    back: "Back"   },
    esp: { enter: "Ingresar", back: "Volver" },
};
function t(k) { return TEXTS[state.lang][k] || k; }

function applyTexts() {
    const p = DATA.project;
    $("sr-project-name").textContent = state.lang === "esp" ? p.nameEsp : p.name;
    $("sr-project-sub").textContent  = state.lang === "esp" ? p.subEsp  : p.sub;
    $("txt-enter").textContent = t("enter");
    $("txt-back").textContent  = t("back");
}
function switchLang(lang) { state.lang = lang; applyTexts(); buildSidebar(); }
window.switchLang = switchLang;

/* ══════════════════════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════════════════════ */
function buildSidebar() {
    const sidebar = $("sr-sidebar");
    sidebar.innerHTML = "";
    DATA.floors.forEach((floor, i) => {
        const btn = document.createElement("button");
        btn.className = "sr-floor-btn";
        btn.setAttribute("data-fid", floor.id);
        const label = state.lang === "esp" ? floor.labelEsp : floor.label;
        btn.innerHTML = `
            <span class="sr-floor-num">${String(i + 1).padStart(2,"0")}</span>
            <span class="sr-floor-name">${label}</span>
            <span class="sr-floor-arrow"><i class="fa fa-angle-right"></i></span>
        `;
        btn.addEventListener("click", () => selectFloor(floor.id, true));
        sidebar.appendChild(btn);
    });
}

/* ══════════════════════════════════════════════════════════════
   LOADER
══════════════════════════════════════════════════════════════ */
function runLoader() {
    const loader = $("sr-loader");
    const bar    = $("sr-loader-bar");
    const p      = DATA.project;

    $("sr-loader-name").textContent = p.name;
    $("sr-loader-sub").textContent  = p.sub;

    const critical = ["img/kiu/kiu-start.jpg", "img/kiu/kiu-end.jpg"];
    let loaded = 0;
    const total = critical.length + 1;

    function tick() {
        loaded++;
        bar.style.width = (loaded / total * 100) + "%";
        if (loaded >= total) setTimeout(hideLoader, 350);
    }

    critical.forEach(src => {
        const img = new Image();
        img.onload = img.onerror = tick;
        img.src = src;
    });

    const video = $("sr-video");
    if (video.readyState >= 3) { tick(); }
    else {
        video.addEventListener("canplay", tick, { once: true });
        video.addEventListener("error",   tick, { once: true });
    }
}

function hideLoader() {
    const loader = $("sr-loader");
    loader.classList.add("sr-loader--out");
    loader.addEventListener("transitionend", () => loader.remove(), { once: true });
}

/* ══════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════ */
function init() {
    runLoader();
    applyTexts();
    buildSidebar();
    bindUnitHotspots();
    buildGallery(DATA.defaults.interiorImages);

    $("sr-planta-img").addEventListener("click", () => {
        const src = $("sr-planta-img").src;
        if (src) openLightbox([src], 0);
    });

    const video = $("sr-video");

    $("sr-btn-enter").addEventListener("click", () => {
        state.phase = "playing";
        $("sr-btn-enter").classList.add("hidden");
        video.currentTime = 0;
        video.play();
        video.addEventListener("timeupdate", () => {
            scene.classList.add("is-playing");
        }, { once: true });
    });

    video.addEventListener("ended", () => {
        state.phase = "explore";
        scene.classList.remove("is-playing");
        scene.classList.add("is-explore");
        btnBack.classList.remove("hidden");
        selectFloor("edificio", false);
    });

    /* URL params — direct link: ?unit=03 or ?floor=skybar */
    const params     = new URLSearchParams(location.search);
    const unitParam  = params.get("unit");
    const floorParam = params.get("floor");
    if (unitParam || floorParam) {
        state.phase = "explore";
        scene.classList.add("is-explore");
        $("sr-btn-enter").classList.add("hidden");
        btnBack.classList.remove("hidden");
        if (unitParam && DATA.units[unitParam]) {
            const unitsFloor = DATA.floors.find(f => f.hasUnits);
            if (unitsFloor) selectFloor(unitsFloor.id, false);
            openUnitPanel(unitParam);
        } else if (floorParam) {
            selectFloor(floorParam, true);
        }
    }
}

/* ══════════════════════════════════════════════════════════════
   UNIT HOTSPOTS
══════════════════════════════════════════════════════════════ */
function bindUnitHotspots() {
    document.querySelectorAll(".sr-unit-zone").forEach(rect => {
        const unit    = rect.getAttribute("data-unit");
        const overlay = $("sr-plant-" + unit);
        if (!overlay) return;

        rect.addEventListener("mouseenter", () => {
            if (state.phase !== "explore" || state.openUnit) return;
            const floor = DATA.floors.find(f => f.id === state.activeFloor);
            if (!floor || !floor.hasUnits) return;
            overlay.classList.add("visible");
        });
        rect.addEventListener("mouseleave", () => {
            if (state.openUnit === unit) return;
            overlay.classList.remove("visible");
        });
        rect.addEventListener("touchstart", () => {
            if (state.phase !== "explore" || state.openUnit) return;
            const floor = DATA.floors.find(f => f.id === state.activeFloor);
            if (!floor || !floor.hasUnits) return;
            overlay.classList.add("visible");
        }, { passive: true });
        rect.addEventListener("click", () => {
            if (state.phase !== "explore") return;
            const floor = DATA.floors.find(f => f.id === state.activeFloor);
            if (!floor || !floor.hasUnits) return;
            openUnitPanel(unit);
        });
    });
}

/* ══════════════════════════════════════════════════════════════
   STATUS
══════════════════════════════════════════════════════════════ */
const STATUS_LABELS = {
    disponible: { eng: "Available",  esp: "Disponible" },
    reservada:  { eng: "Reserved",   esp: "Reservada"  },
    vendida:    { eng: "Sold",        esp: "Vendida"    },
};

/* ══════════════════════════════════════════════════════════════
   GALLERY BUILDERS
══════════════════════════════════════════════════════════════ */
function buildGallery(images) {
    const gallery = $("sr-up-gallery");
    gallery.innerHTML = "";
    images.forEach((src, i) => {
        const item = document.createElement("div");
        item.className = "sr-up-gallery-item";
        const img = document.createElement("img");
        img.src = src; img.alt = "Interior " + (i + 1); img.loading = "lazy";
        img.addEventListener("click", () => openLightbox(images, i));
        item.appendChild(img);
        gallery.appendChild(item);
    });
}

function buildVideoGallery(videos) {
    const gallery = $("sr-up-gallery-videos");
    gallery.innerHTML = "";
    if (!videos || !videos.length) return;
    videos.forEach((src, i) => {
        const item = document.createElement("div");
        item.className = "sr-up-gallery-item sr-up-gallery-item--video";
        const vid = document.createElement("video");
        vid.src = src; vid.preload = "metadata"; vid.muted = true;
        const overlay = document.createElement("div");
        overlay.className = "sr-video-play-overlay";
        overlay.innerHTML = '<i class="fa fa-play-circle"></i>';
        item.appendChild(vid);
        item.appendChild(overlay);
        item.addEventListener("click", () => openLightboxVideo(videos, i));
        gallery.appendChild(item);
    });
}

/* ══════════════════════════════════════════════════════════════
   TABS
══════════════════════════════════════════════════════════════ */
function resetTabs(activeTabName) {
    document.querySelectorAll(".sr-up-tab").forEach(t =>
        t.classList.toggle("active", t.getAttribute("data-tab") === activeTabName)
    );
    document.querySelectorAll(".sr-up-content").forEach(c =>
        c.classList.toggle("active", c.id === "sr-tab-" + activeTabName)
    );
}

document.querySelectorAll(".sr-up-tab").forEach(tab => {
    tab.addEventListener("click", () => {
        const target = tab.getAttribute("data-tab");
        document.querySelectorAll(".sr-up-tab").forEach(t => t.classList.toggle("active", t === tab));
        document.querySelectorAll(".sr-up-content").forEach(c =>
            c.classList.toggle("active", c.id === "sr-tab-" + target)
        );
    });
});

/* ══════════════════════════════════════════════════════════════
   UNIT PANEL
══════════════════════════════════════════════════════════════ */
function openUnitPanel(unit) {
    state.openUnit  = unit;
    state.openFloor = null;

    const unitData = DATA.units[unit] || {};
    gaEvent('unidad_vista', { unidad: unit, tipologia: unitData.label || unit });
    const plantaSrc  = unitData.plantaImage   || "img/kiu/planta.jpg";
    const images     = unitData.interiorImages || DATA.defaults.interiorImages;
    const videos     = unitData.videos?.length  ? unitData.videos : (DATA.defaults.videos || []);
    state.currentTourUrl = unitData.tourUrl || DATA.defaults.tourUrl;
    state.currentVrUrl   = unitData.vrUrl   || DATA.defaults.vrUrl || null;

    /* panel mode */
    const panel = $("sr-unit-panel");
    panel.classList.remove("sr-unit-panel--floor");

    /* header */
    $("sr-up-label").textContent = "Tipología";
    $("sr-up-name").textContent  = unitData.label || DATA.project.name;

    /* status badge */
    const statusEl = $("sr-up-status");
    const s = unitData.status || "disponible";
    statusEl.textContent = STATUS_LABELS[s]?.[state.lang] || s;
    statusEl.className   = "sr-up-status sr-up-status--" + s;
    statusEl.style.display = "";

    /* specs */
    $("spec-area").textContent    = unitData.area    ?? "—";
    $("spec-terraza").textContent = unitData.terraza ?? "—";
    $("spec-dorms").textContent   = unitData.dorms   ?? "—";
    $("spec-banos").textContent   = unitData.banos   ?? "—";
    $("sr-up-specs").style.display = "";

    /* planta */
    const plantaEl = $("sr-planta-img");
    plantaEl.src = plantaSrc; plantaEl.dataset.src = plantaSrc;

    /* tabs */
    $("sr-tab-videos-btn").style.display = videos.length ? "" : "none";
    resetTabs("planta");

    /* galleries */
    buildGallery(images);
    buildVideoGallery(videos);

    /* actions */
    $("sr-up-actions").style.display = "";
    $("sr-btn-tour").style.display   = state.currentTourUrl ? "" : "none";
    $("sr-btn-vr").style.display     = state.currentVrUrl ? "" : "none";

    const pdfBtn = $("sr-up-btn-pdf");
    pdfBtn.style.display = "";
    if (unitData.pdfUrl) {
        pdfBtn.href = unitData.pdfUrl;
        pdfBtn.setAttribute("download", "");
        pdfBtn.classList.remove("sr-up-btn--pending");
    } else {
        pdfBtn.removeAttribute("href");
        pdfBtn.removeAttribute("download");
        pdfBtn.classList.add("sr-up-btn--pending");
    }

    document.querySelectorAll(".sr-plant-overlay").forEach(el => el.classList.remove("visible"));
    const overlay = $("sr-plant-" + unit);
    if (overlay) overlay.classList.add("visible");

    scene.classList.add("is-open");
    panel.removeAttribute("aria-hidden");
}

/* ══════════════════════════════════════════════════════════════
   FLOOR PANEL  —  gallery for non-unit floors (Skybar, etc.)
══════════════════════════════════════════════════════════════ */
function openFloorPanel(floor) {
    state.openFloor = floor.id;
    state.openUnit  = null;

    const panel = $("sr-unit-panel");
    panel.classList.add("sr-unit-panel--floor");

    /* header */
    $("sr-up-label").textContent = state.lang === "esp" ? floor.labelEsp : floor.label;
    $("sr-up-name").textContent  = "";
    $("sr-up-status").style.display = "none";

    /* hide specs */
    $("sr-up-specs").style.display = "none";

    /* tabs: hide planta, show/hide videos */
    $("sr-tab-videos-btn").style.display = (floor.videos && floor.videos.length) ? "" : "none";
    resetTabs("galeria");

    /* galleries */
    buildGallery(floor.images || []);
    buildVideoGallery(floor.videos || []);

    /* hide unit-only actions */
    $("sr-up-actions").style.display = "none";

    scene.classList.add("is-open");
    panel.removeAttribute("aria-hidden");
}

function closeUnitPanel() {
    state.openUnit  = null;
    state.openFloor = null;
    scene.classList.remove("is-open");
    const panel = $("sr-unit-panel");
    panel.setAttribute("aria-hidden", "true");
    panel.classList.remove("sr-unit-panel--floor");
    document.querySelectorAll(".sr-plant-overlay").forEach(el => el.classList.remove("visible"));
}

$("sr-up-close").addEventListener("click", closeUnitPanel);

$("sr-up-btn-share").addEventListener("click", () => {
    if (!state.openUnit) return;
    const url = location.origin + location.pathname + "?unit=" + state.openUnit;
    navigator.clipboard.writeText(url).then(() => {
        const span = $("sr-up-btn-share").querySelector("span");
        span.textContent = "¡Copiado!";
        setTimeout(() => { span.textContent = "Compartir"; }, 2000);
    }).catch(() => {
        prompt("Copiá este link:", url);
    });
});

/* ══════════════════════════════════════════════════════════════
   TOUR MODAL
══════════════════════════════════════════════════════════════ */
const tourModal  = $("sr-tour-modal");
const tourDialog = $("sr-tour-dialog");
const tourIframe = $("sr-tour-iframe");
const tourMaxBtn = $("sr-tour-maximize");

function openTour() {
    tourIframe.src = state.currentTourUrl || DATA.defaults.tourUrl;
    tourModal.classList.add("active");
    const u = DATA.units[state.openUnit] || {};
    gaEvent('tour_360_abierto', { unidad: state.openUnit, tipologia: u.label || state.openUnit });
}
function closeTour() {
    tourModal.classList.remove("active");
    tourDialog.classList.remove("maximized");
    tourMaxBtn.querySelector("i").className = "fa fa-expand";
    setTimeout(() => { tourIframe.src = ""; }, 400);
}
$("sr-btn-tour").addEventListener("click", openTour);
$("sr-btn-vr").addEventListener("click", () => {
    if (state.currentVrUrl) {
        const u = DATA.units[state.openUnit] || {};
        gaEvent('tour_vr_abierto', { unidad: state.openUnit, tipologia: u.label || state.openUnit });
        window.open(state.currentVrUrl, "_blank");
    }
});
$("sr-tour-close").addEventListener("click", closeTour);
tourModal.addEventListener("click", e => { if (e.target === tourModal) closeTour(); });
tourMaxBtn.addEventListener("click", () => {
    tourDialog.classList.toggle("maximized");
    tourMaxBtn.querySelector("i").className = tourDialog.classList.contains("maximized")
        ? "fa fa-compress" : "fa fa-expand";
});

/* ══════════════════════════════════════════════════════════════
   LIGHTBOX  —  images + video
══════════════════════════════════════════════════════════════ */
let lbItems = [];
let lbIndex = 0;
let lbMode  = "image";
const lb    = $("sr-lightbox");
const lbImg = $("sr-lb-img");
const lbVid = $("sr-lb-video");

function openLightbox(images, i) {
    lbMode  = "image";
    lbItems = Array.isArray(images) ? images : [images];
    lbIndex = i || 0;
    lbImg.src = lbItems[lbIndex];
    lbImg.style.display = "";
    lbVid.style.display = "none";
    lbVid.pause && lbVid.pause();
    lb.classList.add("active");
    const single = lbItems.length <= 1;
    $("sr-lb-prev").style.display = single ? "none" : "";
    $("sr-lb-next").style.display = single ? "none" : "";
}

function openLightboxVideo(videos, i) {
    lbMode  = "video";
    lbItems = Array.isArray(videos) ? videos : [videos];
    lbIndex = i || 0;
    lbVid.src = lbItems[lbIndex];
    lbVid.style.display = "block";
    lbImg.style.display = "none";
    lb.classList.add("active");
    const single = lbItems.length <= 1;
    $("sr-lb-prev").style.display = single ? "none" : "";
    $("sr-lb-next").style.display = single ? "none" : "";
    lbVid.play();
}

function closeLightbox() {
    lb.classList.remove("active");
    if (lbMode === "video") { lbVid.pause(); lbVid.src = ""; }
}

function lbStep(dir) {
    lbIndex = (lbIndex + dir + lbItems.length) % lbItems.length;
    if (lbMode === "video") {
        lbVid.pause(); lbVid.src = lbItems[lbIndex]; lbVid.play();
    } else {
        lbImg.src = lbItems[lbIndex];
    }
}
$("sr-lb-close").addEventListener("click", closeLightbox);
$("sr-lb-prev").addEventListener("click", () => lbStep(-1));
$("sr-lb-next").addEventListener("click", () => lbStep(1));
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });

/* ══════════════════════════════════════════════════════════════
   SELECT FLOOR
══════════════════════════════════════════════════════════════ */
function selectFloor(fid, openPanel) {
    if (state.phase !== "explore") return;
    const floor = DATA.floors.find(f => f.id === fid);
    if (!floor) return;

    /* close any open panel */
    if (state.openUnit || state.openFloor) closeUnitPanel();

    document.querySelectorAll(".sr-floor-btn").forEach(b =>
        b.classList.toggle("active", b.getAttribute("data-fid") === fid)
    );
    state.activeFloor = fid;

    if (floor.viewImage) { crossfadeTo(floor.viewImage); }
    else { clearFloorImage(); }

    /* open floor gallery panel if requested and floor has content */
    const hasContent = (floor.images && floor.images.length) || (floor.videos && floor.videos.length);
    if (openPanel && !floor.hasUnits && hasContent) {
        openFloorPanel(floor);
    }
}

function crossfadeTo(src) {
    const incoming = state.activeSlot === "a" ? imgB : imgA;
    const outgoing = state.activeSlot === "a" ? imgA : imgB;
    incoming.src = src;
    incoming.classList.add("visible");
    setTimeout(() => {
        outgoing.classList.add("no-fade");
        outgoing.classList.remove("visible");
        requestAnimationFrame(() => outgoing.classList.remove("no-fade"));
    }, 720);
    state.activeSlot = state.activeSlot === "a" ? "b" : "a";
}

function clearFloorImage() {
    imgA.classList.remove("visible");
    imgB.classList.remove("visible");
}

/* ══════════════════════════════════════════════════════════════
   BACK / RESET
══════════════════════════════════════════════════════════════ */
btnBack.addEventListener("click", resetToLanding);

function resetToLanding() {
    closeUnitPanel();
    state.phase = "landing";
    state.activeFloor = null;
    state.activeSlot  = "a";
    const video = $("sr-video");
    video.pause(); video.currentTime = 0;
    clearFloorImage();
    scene.classList.remove("is-playing", "is-explore", "is-open");
    $("sr-btn-enter").classList.remove("hidden");
    btnBack.classList.add("hidden");
    document.querySelectorAll(".sr-floor-btn").forEach(b => b.classList.remove("active"));
}

/* ══════════════════════════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════════════════════ */
document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        if (tourModal.classList.contains("active")) { closeTour(); return; }
        if (lb.classList.contains("active"))        { closeLightbox(); return; }
        if (state.openUnit || state.openFloor)      { closeUnitPanel(); return; }
        if (state.phase === "explore")               resetToLanding();
    }
});

init();
</script>
