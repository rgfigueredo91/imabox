        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── grid ── */
        .films-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: auto;
            gap: 6px;
            padding: 0 8px 8px;
        }

        /* ── card ── */
        .vid {
            position: relative;
            overflow: hidden;
            background: #111;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.97);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .vid.visible { opacity: 1; transform: scale(1); }

        /* aspect ratios per video type */
        .vid.landscape { grid-column: span 4; aspect-ratio: 16 / 9; align-self: start; }
        .vid.portrait  { grid-column: span 2; aspect-ratio: 9 / 16; align-self: start; }

        /* poster image — hidden once video plays */
        .vid-poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.4s ease, transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
            filter: brightness(0.88);
            z-index: 2;
        }
        .vid:hover .vid-poster { transform: scale(1.04); filter: brightness(0.72); }
        .vid.is-playing .vid-poster { opacity: 0; pointer-events: none; }

        /* video element */
        .vid video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 1;
        }

        /* play / pause overlay */
        .vid-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vid-play-icon {
            width: 56px;
            height: 56px;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .vid:hover .vid-play-icon { opacity: 1; transform: scale(1); }
        .vid.is-playing:hover .vid-play-icon { opacity: 0.7; }



        /* ── footer ── */
        footer {

        .footer-social a:hover { opacity: 0.65; }

        /* ── responsive ── */
        @media (max-width: 1024px) {

<script>
function timedRefresh() { setTimeout(function(){ location.reload(true); }, 600); }

/* click to play/pause inline */
document.querySelectorAll('.vid').forEach(function(card) {
    card.addEventListener('click', function() {
        var video = card.querySelector('video');
        if (video.paused) {
            /* pause all others */
            document.querySelectorAll('.vid video').forEach(function(v) {
                v.pause();
                v.closest('.vid').classList.remove('is-playing');
            });
            video.play().then(function() {
                card.classList.add('is-playing');
            }).catch(function(){});
        } else {
            video.pause();
            card.classList.remove('is-playing');
        }
    });

    /* when video ends (if not looping) remove playing state */
    var video = card.querySelector('video');
    video.addEventListener('ended', function() {
        card.classList.remove('is-playing');
    });
});

/* scroll-in animation */
document.addEventListener('DOMContentLoaded', function () {
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.05 });

    document.querySelectorAll('.vid').forEach(function(el) {
        observer.observe(el);
    });
});
</script>
