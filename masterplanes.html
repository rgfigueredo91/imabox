    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Masterplanes 3D | Imabox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="favicon.png"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .mp-scene {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* ── IMAGE / VIDEO LAYERS ───────────────────────────────────
           z1  static frames (A/B swap for crossfade between views)
           z2  active video
           z3  black overlay
        ──────────────────────────────────────────────────────────── */
        .mp-frame, .mp-video {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Two static frame slots for crossfading */
        .mp-frame {
            z-index: 1;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .mp-frame.visible { opacity: 1; }

        .mp-video {
            z-index: 2;
            opacity: 0;
            transition: none;
        }
        .mp-scene.is-playing  .mp-video { opacity: 1; }
        .mp-scene.is-fading   .mp-video { opacity: 0; transition: opacity 0.6s ease; }

        /* Bridge — sits above video, covers black gap during src switch */
        .mp-bridge {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-bridge.active { opacity: 1; }

        /* Black overlay — fades out after Ingresar */
        .mp-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: #000;
            transition: opacity 1.2s ease;
            pointer-events: none;
        }
        .mp-scene.is-cover   .mp-overlay,
        .mp-scene.is-playing .mp-overlay,
        .mp-scene.is-done1   .mp-overlay,
        .mp-scene.is-playing2 .mp-overlay,
        .mp-scene.is-done2   .mp-overlay,
        .mp-scene.is-done3   .mp-overlay { opacity: 0; }

        /* ── LANDING ─────────────────────────────────────────────── */
        .mp-landing {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            transition: opacity 0.8s ease;
        }
        .mp-scene.is-cover    .mp-landing,
        .mp-scene.is-playing  .mp-landing,
        .mp-scene.is-done1    .mp-landing,
        .mp-scene.is-playing2 .mp-landing,
        .mp-scene.is-done2    .mp-landing,
        .mp-scene.is-done3    .mp-landing { opacity: 0; pointer-events: none; }

        .mp-title-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp 1.2s ease 0.3s both;
        }
        .mp-title {
            font-size: clamp(2.4rem, 8vw, 6rem);
            font-weight: 200;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            line-height: 1;
        }
        .mp-subtitle {
            font-size: clamp(0.65rem, 1.6vw, 0.95rem);
            font-weight: 300;
            letter-spacing: 0.55em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-top: 12px;
            align-self: flex-end;
        }

        .mp-btn-enter {
            background: rgba(0,0,0,0.4);
            border: 1.5px solid rgba(255,255,255,0.65);
            color: #fff;
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding: 16px 52px;
            cursor: pointer;
            animation: fadeUp 1.2s ease 0.6s both;
            transition: background 0.3s, border-color 0.3s;
        }
        .mp-btn-enter:hover { background: rgba(0,0,0,0.65); border-color: #fff; }

        /* ── INICIAR (center) ────────────────────────────────────── */
        .mp-btn-iniciar {
            position: absolute;
            inset: 0; margin: auto;
            width: fit-content; height: fit-content;
            z-index: 10;
            background: rgba(0,0,0,0.45);
            border: 1.5px solid rgba(255,255,255,0.7);
            color: #fff;
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding: 16px 52px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease 0.5s, background 0.3s, border-color 0.3s;
        }
        .mp-scene.is-cover .mp-btn-iniciar { opacity: 1; pointer-events: all; }
        .mp-scene.is-playing .mp-btn-iniciar,
        .mp-scene.is-done1   .mp-btn-iniciar,
        .mp-scene.is-playing2 .mp-btn-iniciar,
        .mp-scene.is-done2   .mp-btn-iniciar,
        .mp-scene.is-done3   .mp-btn-iniciar { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .mp-btn-iniciar:hover { background: rgba(0,0,0,0.65); border-color: #fff; }

        /* ── NAV ARROWS (right / left sides, vertically centered) ── */
        .mp-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.35);
            border: 1.5px solid rgba(255,255,255,0.5);
            color: #fff;
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease, background 0.25s, border-color 0.25s;
            font-family: inherit;
        }
        .mp-arrow:hover { background: rgba(0,0,0,0.65); border-color: #fff; }

        .mp-arrow-right { right: 32px; }
        .mp-arrow-left  { left: 32px; }

        /* Show right arrow after video 1 ends */
        .mp-scene.is-done1 .mp-arrow-right { opacity: 1; pointer-events: all; }

        /* Show left arrow after video 1 ends (→ vista norte) and after video 2 (→ back) */
        .mp-scene.is-done1 .mp-arrow-left  { opacity: 1; pointer-events: all; }
        .mp-scene.is-done2 .mp-arrow-left  { opacity: 1; pointer-events: all; }

        /* Show right arrow in done3 to go back */
        .mp-scene.is-done3 .mp-arrow-right { opacity: 1; pointer-events: all; }

        /* ── HOVER CANVAS OVERLAY ────────────────────────────────── */
        #mp-hover-canvas {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        #mp-hover-canvas.on { opacity: 1; }

        /* ── ZONA HOVER — solo activa en is-done1 ────────────────── */
        .mp-zone-layer {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            z-index: 7;
            pointer-events: none;
        }
        .mp-scene.is-done1 .mp-zone-layer { pointer-events: all; }

        .mp-zone {
            position: absolute;
            cursor: default;
            /* para debug: background: rgba(255,0,0,0.18); */
        }

        /* ── ANIMATIONS ─────────────────────────────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── LOADER ──────────────────────────────────────────────── */
        .mp-loader {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity 0.9s ease;
        }
        .mp-loader.done { opacity: 0; pointer-events: none; }

        .mp-loader-title {
            font-family: 'aktiv-grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
            margin-bottom: 4px;
        }
        .mp-loader-label {
            font-size: 0.6rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
        }

        .mp-loader-track {
            width: 180px;
            height: 1px;
            background: rgba(255,255,255,0.12);
            position: relative;
        }
        .mp-loader-bar {
            position: absolute;
            inset: 0;
            width: 0%;
            background: rgba(255,255,255,0.75);
            transition: width 0.25s ease;
        }

        /* ── HOTSPOTS (old zone-div based — hidden) ──────────────── */
        .mp-zone .mp-hotspot { display: none; }

        /* ── HOTSPOTS DINÁMICOS (centroide por zona) ──────────────── */
        .mp-hotspot-dyn {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 8;
        }
        .mp-scene.is-done1 .mp-hotspot-dyn                 { opacity: 1; }
        .mp-scene.is-terreno  .mp-hotspot-dyn,
        .mp-scene.is-nocturna .mp-hotspot-dyn,
        .mp-scene.zone-hovered .mp-hotspot-dyn             { opacity: 0; }

        .mp-hotspot-dyn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 6px rgba(255,255,255,0.6);
        }
        .mp-hotspot-dyn::after {
            content: '';
            position: absolute;
            inset: -7px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.7);
            animation: hotspot-pulse 2.2s ease-out infinite;
            animation-delay: inherit;
        }
        @keyframes hotspot-pulse {
            0%   { transform: scale(1);   opacity: 0.8; }
            100% { transform: scale(2.6); opacity: 0;   }
        }

        /* ── ZOOM TRANSITION ──────────────────────────────────────── */
        .mp-scene {
            transition: transform 0.3s cubic-bezier(0.4, 0, 1, 1);
        }

        /* ── ZONE CLICKABLE CURSOR ────────────────────────────────── */
        .mp-scene.is-done1 .mp-zone { cursor: pointer; }

        /* ── DETAIL VIEW ──────────────────────────────────────────── */
        .mp-detail {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .mp-detail.on { opacity: 1; pointer-events: all; }

        .mp-detail-img {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .mp-detail-close {
            position: absolute;
            top: 28px;
            left: 36px;
            background: rgba(0,0,0,0.4);
            border: 1.5px solid rgba(255,255,255,0.5);
            color: #fff;
            font-family: inherit;
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
            padding: 10px 22px 10px 18px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            z-index: 2;
        }
        .mp-detail-close:hover { background: rgba(0,0,0,0.7); border-color: #fff; }
        .mp-detail-close svg { flex-shrink: 0; }

        /* ── DETAIL LOCATION LABEL ────────────────────────────────── */
        .mp-detail-location {
            position: absolute;
            bottom: 32px;
            right: 36px;
            text-align: right;
            z-index: 4;
            pointer-events: none;
        }
        .mp-detail-location-name {
            font-size: clamp(1.6rem, 4vw, 3.2rem);
            font-weight: 200;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            line-height: 1.15;
            max-width: 52vw;
        }

        /* ── GOMEZ PLATERO header ─────────────────────────────────── */
        .mp-brand {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            pointer-events: none;
        }
        .mp-brand-name {
            font-size: clamp(0.6rem, 1.4vw, 0.85rem);
            font-weight: 200;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
        }
        .mp-brand-line {
            width: 32px;
            height: 1px;
            background: rgba(255,255,255,0.3);
        }

        /* ── PROYECTO / TERRENO tabs ──────────────────────────────── */
        .mp-tabs {
            position: absolute;
            top: 28px;
            right: 36px;
            z-index: 20;
            display: flex;
            gap: 2px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .mp-scene.is-done1 .mp-tabs { opacity: 1; pointer-events: all; }

        .mp-tab {
            font-family: inherit;
            font-size: 0.62rem;
            font-weight: 300;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            padding: 6px 14px 5px;
            cursor: pointer;
            transition: color 0.25s, border-color 0.25s;
        }
        .mp-tab:hover { color: rgba(255,255,255,0.75); }
        .mp-tab.active {
            color: #fff;
            border-bottom-color: rgba(255,255,255,0.6);
        }

        /* Terreno image layer — above hover overlays (z5), below zone layer (z7) */
        .mp-terreno {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-terreno.on { opacity: 1; }

        /* Hide right arrow when on terreno or nocturna tab */
        .mp-scene.is-terreno  .mp-arrow-right { opacity: 0 !important; pointer-events: none !important; }
        .mp-scene.is-nocturna .mp-arrow-right { opacity: 0 !important; pointer-events: none !important; }
        .mp-scene.is-nocturna .mp-hotspot     { opacity: 0; }

        /* Nocturna image layer — same stack as terreno (z6) */
        .mp-nocturna {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-nocturna.on { opacity: 1; }

        /* ── LOCATION LABEL ───────────────────────────────────────── */
        .mp-location {
            position: absolute;
            bottom: 32px;
            right: 36px;
            text-align: right;
            z-index: 21;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .mp-scene.is-done1 .mp-location,
        .mp-scene.is-done2 .mp-location,
        .mp-scene.is-done3 .mp-location { opacity: 1; }

        .mp-location-name {
            font-size: clamp(1.6rem, 4vw, 3.2rem);
            font-weight: 200;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            line-height: 1.15;
            transition: opacity 0.3s ease;
            max-width: 52vw;
        }
        .mp-location-name.fade { opacity: 0; }

        /* ── PLAY BUTTON centrado sobre la imagen ─────────────────── */
        .mp-play-btn {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 80px; height: 80px;
            z-index: 2;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.75);
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            transition: background 0.25s, border-color 0.25s, transform 0.2s;
            animation: mp-pulse 2.4s ease-in-out infinite;
        }
        .mp-play-btn:hover {
            background: rgba(0,0,0,0.65);
            border-color: #fff;
            transform: scale(1.08);
            animation: none;
        }
        .mp-play-btn svg { margin-left: 5px; }

        @keyframes mp-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25); }
            50%      { box-shadow: 0 0 0 18px rgba(255,255,255,0); }
        }

        /* ── IMAGE SLIDER ─────────────────────────────────────────── */
        .mp-slider {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            z-index: 5;
            padding: 16px 36px 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s;
            pointer-events: none;
        }
        .mp-slider::-webkit-scrollbar { display: none; }
        .mp-slider.on { opacity: 1; transform: translateY(0); pointer-events: all; }

        .mp-slider-thumb {
            flex-shrink: 0;
            width: 110px;
            height: 72px;
            object-fit: cover;
            object-position: center;
            border: 1.5px solid rgba(255,255,255,0.25);
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-slider-thumb:hover {
            border-color: rgba(255,255,255,0.85);
            transform: scale(1.06);
        }

        /* Video thumb wrapper */
        .mp-slider-item {
            position: relative;
            flex-shrink: 0;
            width: 110px;
            height: 72px;
        }
        .mp-slider-item .mp-slider-thumb {
            width: 100%; height: 100%;
        }
        .mp-slider-item .mp-slider-play {
            position: absolute;
            inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .mp-slider-item .mp-slider-play svg {
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7));
        }

        /* ── SLIDER LIGHTBOX ───────────────────────────────────────── */
        .mp-lightbox {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: rgba(0,0,0,0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .mp-lightbox.on { opacity: 1; pointer-events: all; }

        .mp-lightbox-img {
            max-width: 90%;
            max-height: 88%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        .mp-lightbox-close {
            position: absolute;
            top: 20px; right: 28px;
            background: rgba(0,0,0,0.45);
            border: 1.5px solid rgba(255,255,255,0.55);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .mp-lightbox-close:hover { background: rgba(0,0,0,0.75); border-color: #fff; }

        .mp-lightbox-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            border: 1.5px solid rgba(255,255,255,0.45);
            color: #fff;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-family: inherit;
        }
        .mp-lightbox-arrow:hover { background: rgba(0,0,0,0.7); border-color: #fff; }
        .mp-lightbox-arrow.prev { left: 28px; }
        .mp-lightbox-arrow.next { right: 28px; }

        /* ── BOTÓN PARCELAS EN VENTA ─────────────────────────────── */
        .mp-parcelas-btn {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: rgba(0,0,0,0.45);
            border: 1.5px solid rgba(255,255,255,0.6);
            color: #fff;
            font-family: inherit;
            font-size: 0.68rem;
            font-weight: 300;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            padding: 14px 40px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease 0.3s, background 0.25s, border-color 0.25s;
        }
        .mp-parcelas-btn.visible { opacity: 1; pointer-events: all; }
        .mp-parcelas-btn:hover   { background: rgba(0,0,0,0.7); border-color: #fff; }

        /* ── VISTA PADRONES ───────────────────────────────────────── */
        .mp-padrones {
            position: absolute;
            inset: 0;
            z-index: 4;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .mp-padrones.on { opacity: 1; pointer-events: all; }
        .mp-padrones-img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;

<script>
const scene      = document.getElementById("mp-scene");
const video      = document.getElementById("mp-video");
const frameA     = document.getElementById("mp-frame-a");
const bridge     = document.getElementById("mp-bridge");
const btnEnter   = document.getElementById("mp-btn-enter");
const btnIniciar = document.getElementById("mp-btn-iniciar");
const arrowRight = document.getElementById("mp-arrow-right");
const arrowLeft  = document.getElementById("mp-arrow-left");
const terrenoImg  = document.getElementById("mp-terreno");
const nocturnaImg = document.getElementById("mp-nocturna");
const tabProyecto = document.getElementById("mp-tab-proyecto");
const tabTerreno  = document.getElementById("mp-tab-terreno");
const tabNocturna = document.getElementById("mp-tab-nocturna");
const locationEl = document.getElementById("mp-location-name");

const DEFAULT_LABEL = "Reserva de Mar — Country Marítimo";
let locationTimer  = null;
let currentLabel   = DEFAULT_LABEL;

function setLocationLabel(label) {
    if (label === currentLabel) return;
    clearTimeout(locationTimer);
    locationTimer = setTimeout(() => {
        locationEl.classList.add("fade");
        setTimeout(() => {
            locationEl.textContent = label;
            currentLabel = label;
            locationEl.classList.remove("fade");
        }, 300);
    }, 60); // small delay cancels flicker between adjacent zones
}

/* ── Proyecto / Terreno / Nocturna tabs ──────────────────────────── */
tabProyecto.addEventListener("click", () => {
    tabProyecto.classList.add("active");
    tabTerreno.classList.remove("active");
    tabNocturna.classList.remove("active");
    terrenoImg.classList.remove("on");
    nocturnaImg.classList.remove("on");
    scene.classList.remove("is-terreno", "is-nocturna");
});

tabTerreno.addEventListener("click", () => {
    tabTerreno.classList.add("active");
    tabProyecto.classList.remove("active");
    tabNocturna.classList.remove("active");
    terrenoImg.classList.add("on");
    nocturnaImg.classList.remove("on");
    scene.classList.add("is-terreno");
    scene.classList.remove("is-nocturna");
});

tabNocturna.addEventListener("click", () => {
    tabNocturna.classList.add("active");
    tabProyecto.classList.remove("active");
    tabTerreno.classList.remove("active");
    nocturnaImg.classList.add("on");
    terrenoImg.classList.remove("on");
    scene.classList.add("is-nocturna");
    scene.classList.remove("is-terreno");
});

/* Reset tabs when leaving is-done1 state */
function resetTabs() {
    tabProyecto.classList.add("active");
    tabTerreno.classList.remove("active");
    tabNocturna.classList.remove("active");
    terrenoImg.classList.remove("on");
    nocturnaImg.classList.remove("on");
    scene.classList.remove("is-terreno", "is-nocturna");
}

/* Show bridge instantly (no transition) to match current view */
function showBridge(src) {
    bridge.style.transition = "none";
    bridge.src = src;
    bridge.classList.add("active");
    bridge.offsetHeight; // force reflow
    bridge.style.transition = "";
}

/* Hide bridge with fade once video first frame is ready */
function hideBridgeOnReady() {
    video.addEventListener("timeupdate", () => {
        bridge.classList.remove("active");
    }, { once: true });
}

function showStill(src) {
    // Show high-quality still over the video, then hide video
    showBridge(src);
    scene.classList.remove("is-playing");
}

function playNext(src, bridgeSrc, onEnded) {
    showBridge(bridgeSrc);
    scene.classList.add("is-playing");
    video.src = src;
    video.load();
    video.play();
    hideBridgeOnReady();
    video.addEventListener("ended", onEnded, { once: true });
}

/* ── Ingresar ───────────────────────────────────────────────── */
btnEnter.addEventListener("click", () => {
    scene.classList.add("is-cover");
});

/* ── Iniciar (video 1) ──────────────────────────────────────── */
btnIniciar.addEventListener("click", () => {
    scene.classList.remove("is-cover");
    playNext("videos/masterplanes/zoom.mp4", "img/masterplanes/start.webp", () => {
        showStill("img/masterplanes/end1.webp");
        scene.classList.add("is-done1");
    });
});

/* ── Arrow right ─────────────────────────────────────────────── */
arrowRight.addEventListener("click", () => {
    if (scene.classList.contains("is-done3")) {
        // is-done3 → back to is-done1 (vista norte reversed)
        scene.classList.remove("is-done3");
        playNext("videos/masterplanes/vista-norte-rev.mp4", "img/masterplanes/end3.webp", () => {
            showStill("img/masterplanes/end1.webp");
            scene.classList.add("is-done1");
        });
    } else {
        // is-done1 → is-done2 (izquierda forward)
        resetTabs();
        scene.classList.remove("is-done1", "is-done2");
        playNext("videos/masterplanes/izquierda.mp4", "img/masterplanes/end1.webp", () => {
            showStill("img/masterplanes/end2.webp");
            scene.classList.add("is-done2");
        });
    }
});

/* ── Arrow left ──────────────────────────────────────────────── */
arrowLeft.addEventListener("click", () => {
    if (scene.classList.contains("is-done1")) {
        // is-done1 → is-done3 (vista norte forward)
        resetTabs();
        scene.classList.remove("is-done1");
        playNext("videos/masterplanes/vista-norte.mp4", "img/masterplanes/end1.webp", () => {
            showStill("img/masterplanes/end3.webp");
            scene.classList.add("is-done3");
        });
    } else {
        // is-done2 → back to is-done1 (izquierda reversed)
        scene.classList.remove("is-done1", "is-done2");
        playNext("videos/masterplanes/izquierda-rev.mp4", "img/masterplanes/end2.webp", () => {
            showStill("img/masterplanes/end1.webp");
            scene.classList.add("is-done1");
        });
    }
});

/* ── Preload ─────────────────────────────────────────────────── */
(function () {
    const loader = document.getElementById("mp-loader");
    const bar    = document.getElementById("mp-loader-bar");
    const label  = document.getElementById("mp-loader-label");

    // url + exact byte size for weighted byte-accurate progress
    const assets = [
        // Main images
        { url: "img/masterplanes/start.webp",      b: 656998 },
        { url: "img/masterplanes/end1.webp",        b: 504598 },
        { url: "img/masterplanes/end2.webp",        b: 544320 },
        { url: "img/masterplanes/noche.webp",       b: 348186 },
        { url: "img/masterplanes/terreno.webp",     b: 500890 },
        // Color map (para detección de zonas por pixel)
        { url: "img/masterplanes/colormap.png",     b:  25879 },
        { url: "img/masterplanes/detail/padrones.jpg", b: 2016885 },

        { url: "img/masterplanes/detail/w8/v1.mp4",                           b: 2657908 },
    ];

    const totalBytes = assets.reduce((s, a) => s + a.b, 0);
    let loadedBytes = 0;

    function addBytes(n) {
        loadedBytes = Math.min(loadedBytes + n, totalBytes);
        const pct = Math.round(loadedBytes / totalBytes * 100);
        bar.style.width = pct + "%";
        label.textContent = pct + "%";
    }

    async function fetchAsset({ url, b }) {
        try {
            const res = await fetch(url);
            if (!res.ok || !res.body) { addBytes(b); return; }
            const reader = res.body.getReader();
            for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                addBytes(value.length);
            }
        } catch {
            addBytes(b);
        }
    }

    Promise.all(assets.map(fetchAsset)).then(() => {
        bar.style.width = "100%";
        label.textContent = "100%";
        setTimeout(() => {
            loader.classList.add("done");
            setTimeout(() => loader.remove(), 950);

/* ── COLOR MAP — canvas pixel detection ──────────────────────── */
const colorCanvas = document.createElement('canvas');
const colorCtx    = colorCanvas.getContext('2d', { willReadFrequently: true });
let   colorMapReady = false;

// pastel: [r, g, b, alpha 0-255]
// click: { introVideo, stillImg, clickVideo, detailLabel, sliderSrcs }
const COLOR_ZONES = [
    { key:'bulevar',     r:255, g:  0, b:  0, label:'Bulevar Principal', pastel:[255,175,175,120], previewImg:'img/masterplanes/detail/Gemini_Generated_Image_cl1lvbcl1lvbcl1l.webp', click: null },
    { key:'lago',        r: 18, g:  0, b:255, label:'Lago',              pastel:[165,185,255,120], previewImg:'img/masterplanes/end1.webp',                                             click: null },
    { key:'residencial', r: 42, g:255, b:  0, label:'Residencial',       pastel:[175,255,180,120], previewImg:'img/masterplanes/detail/Gemini_Generated_Image_dih2xedih2xedih2.webp',  click: null },
    { key:'clubhouse',   r:255, g:222, b:  0, label:'Clubhouse',         pastel:[255,252,145,120], previewImg:'img/masterplanes/detail/Gemini_Generated_Image_dxn5ubdxn5ubdxn5.webp',  click: {
        introVideo:  'img/masterplanes/detail/zoom_out_smooth_w8_rev.mp4',
        stillImg:    'img/masterplanes/detail/w8_still.webp',
        clickVideo:  null,
        detailLabel: 'Clubhouse',
        sliderSrcs:  [],
    }},
    { key:'yates',       r:255, g:168, b:  0, label:'Yates',             pastel:[255,185,105,120], previewImg:'img/masterplanes/detail/w8_still.webp',                                 click: null },
    { key:'acceso',      r:  0, g:255, b:168, label:'Acceso Portal',     pastel:[155,255,220,120], previewImg:'img/masterplanes/detail/Gemini_Generated_Image_b4wkzlb4wkzlb4wk.webp', click: null },
];

const DIST_SQ = 50 * 50 * 3;

function matchZoneColor(r, g, b) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    if (max < 80 || max - min < 60) return null;
    // Rank all zones by distance
    let ranked = COLOR_ZONES
        .map(z => ({ z, d: (r-z.r)**2 + (g-z.g)**2 + (b-z.b)**2 }))
        .sort((a, b) => a.d - b.d);
    // Reject if no zone is close enough
    if (ranked[0].d >= DIST_SQ) return null;
    // Reject ambiguous pixels (2nd best within 2x of best — JPEG boundary artifact)
    if (ranked.length > 1 && ranked[1].d < ranked[0].d * 2) return null;
    return ranked[0].z;
}

/* ── HOVER CANVAS — pastel zone masks ────────────────────────── */
const hoverCanvas = document.getElementById('mp-hover-canvas');
const hoverCtx    = hoverCanvas.getContext('2d');
const zoneMasks      = {}; // key → offscreen canvas
const zoneCentroids  = {}; // key → {x, y} in colormap coords
const zoneHotspots   = {}; // key → DOM element

// Cover transform: match object-fit:cover behavior of background images
function coverParams() {
    const sw = hoverCanvas.width, sh = hoverCanvas.height;
    const iw = colorCanvas.width,  ih = colorCanvas.height;
    const scale = Math.max(sw / iw, sh / ih);
    return { scale, dx: (sw - iw * scale) / 2, dy: (sh - ih * scale) / 2 };
}

function placeHotspot(key) {
    const c = zoneCentroids[key], el = zoneHotspots[key];
    if (!c || !el || !colorCanvas.width) return;
    const { scale, dx, dy } = coverParams();
    el.style.left = (c.x * scale + dx) + 'px';
    el.style.top  = (c.y * scale + dy) + 'px';
}

function placeAllHotspots() {
    for (const z of COLOR_ZONES) placeHotspot(z.key);
}

function resizeHoverCanvas() {
    hoverCanvas.width  = scene.offsetWidth;
    hoverCanvas.height = scene.offsetHeight;
    if (activeColorZone) drawZoneMask(activeColorZone);
    placeAllHotspots();
}
window.addEventListener('resize', resizeHoverCanvas);

const colorMapImg = new Image();
colorMapImg.onload = () => {
    const w = colorMapImg.naturalWidth, h = colorMapImg.naturalHeight;
    colorCanvas.width  = w; colorCanvas.height = h;
    colorCtx.drawImage(colorMapImg, 0, 0);
    colorMapReady = true;
    resizeHoverCanvas();

    // Pre-render one offscreen canvas per zone + compute centroid (same pass)
    // Each pixel goes only to the CLOSEST zone — no cross-contamination
    const srcData = colorCtx.getImageData(0, 0, w, h);
    let i = 0;
    function renderNext() {
        if (i >= COLOR_ZONES.length) return;
        const z = COLOR_ZONES[i++];
        const [pr, pg, pb, pa] = z.pastel;
        const mask = new ImageData(w, h);
        let sumX = 0, sumY = 0, count = 0;
        for (let j = 0; j < srcData.data.length; j += 4) {
            const r = srcData.data[j], g = srcData.data[j+1], b = srcData.data[j+2];
            const dThis = (r-z.r)**2 + (g-z.g)**2 + (b-z.b)**2;
            if (dThis >= DIST_SQ) continue;
            let isClosest = true;
            for (const other of COLOR_ZONES) {
                if (other === z) continue;
                if ((r-other.r)**2 + (g-other.g)**2 + (b-other.b)**2 < dThis) {
                    isClosest = false; break;
                }
            }
            if (!isClosest) continue;
            mask.data[j]   = pr;
            mask.data[j+1] = pg;
            mask.data[j+2] = pb;
            mask.data[j+3] = pa;
            sumX += (j >> 2) % w;
            sumY += (j >> 2) / w | 0;
            count++;
        }
        const off = document.createElement('canvas');
        off.width = w; off.height = h;
        off.getContext('2d').putImageData(mask, 0, 0);
        zoneMasks[z.key] = off;

        // Crear hotspot en el centroide de la zona
        if (count > 0) {
            zoneCentroids[z.key] = { x: sumX / count, y: sumY / count };
            const hs = document.createElement('div');
            hs.className = 'mp-hotspot-dyn';
            hs.style.animationDelay = (i * 0.3) + 's';
            scene.appendChild(hs);
            zoneHotspots[z.key] = hs;
            placeHotspot(z.key);
        }
        setTimeout(renderNext, 0);
    }
    renderNext();
};
colorMapImg.src = 'img/masterplanes/colormap.png';

function drawZoneMask(zone) {
    hoverCtx.clearRect(0, 0, hoverCanvas.width, hoverCanvas.height);
    if (zone && zoneMasks[zone.key]) {
        const { scale, dx, dy } = coverParams();
        hoverCtx.drawImage(zoneMasks[zone.key], dx, dy, colorCanvas.width * scale, colorCanvas.height * scale);
        hoverCanvas.classList.add('on');
    } else {
        hoverCanvas.classList.remove('on');
    }
}

/* ── FLOATING ZONE PREVIEW (cursor circle) ───────────────────── */
const zonePreview = document.createElement('div');
zonePreview.id = 'mp-zone-preview';
zonePreview.innerHTML = '<div id="mp-zone-preview-label"><span></span></div>';
document.body.appendChild(zonePreview);
const zonePreviewLabel = zonePreview.querySelector('span');

let pmx = 0, pmy = 0, pcx = 0, pcy = 0;
const PPW = 220, PPH = 220, PPAD = 20;

(function previewTick() {
    const tx = (pmx + PPW + 36 + PPAD > window.innerWidth) ? pmx - PPW - 36 : pmx + 36;
    const ty = (pmy - PPH - 24 < PPAD) ? pmy + 24 : pmy - PPH - 24;
    pcx += (tx - pcx) * 0.1;
    pcy += (ty - pcy) * 0.1;
    zonePreview.style.left = pcx + 'px';
    zonePreview.style.top  = pcy + 'px';
    requestAnimationFrame(previewTick);
})();

/* ── CANVAS HOVER DETECTION ──────────────────────────────────── */
let activeColorZone = null;

function activateZone(zone) {
    if (activeColorZone === zone) return;
    activeColorZone = zone;
    drawZoneMask(zone);
    scene.classList.toggle('zone-hovered', zone !== null);
    if (zone) {
        zonePreview.style.backgroundImage = `url('${zone.previewImg}')`;
        zonePreviewLabel.textContent = zone.label;
        zonePreview.classList.add('visible');
        scene.style.cursor = 'pointer';
    } else {
        zonePreview.classList.remove('visible');
        scene.style.cursor = '';
    }
}

function getZoneAtEvent(e) {
    if (!colorMapReady) return null;
    const rect  = scene.getBoundingClientRect();
    const iw = colorCanvas.width, ih = colorCanvas.height;
    const scale = Math.max(rect.width / iw, rect.height / ih);
    const ox    = (rect.width  - iw * scale) / 2;
    const oy    = (rect.height - ih * scale) / 2;
    const cx    = ((e.clientX - rect.left) - ox) / scale;
    const cy    = ((e.clientY - rect.top)  - oy) / scale;
    if (cx < 0 || cy < 0 || cx >= iw || cy >= ih) return null;
    const px = colorCtx.getImageData(Math.round(cx), Math.round(cy), 1, 1).data;
    return matchZoneColor(px[0], px[1], px[2]);
}

scene.addEventListener('mousemove', e => {
    pmx = e.clientX;
    pmy = e.clientY;
    if (!scene.classList.contains('is-done1') ||
         scene.classList.contains('is-terreno') ||
         scene.classList.contains('is-nocturna')) {
        if (activeColorZone) activateZone(null);
        return;
    }
    activateZone(getZoneAtEvent(e));
});

scene.addEventListener('mouseleave', () => activateZone(null));

scene.addEventListener('click', e => {
    if (!scene.classList.contains('is-done1') ||
         scene.classList.contains('is-terreno') ||
         scene.classList.contains('is-nocturna')) return;
    const zone = getZoneAtEvent(e);
    if (!zone?.click) return;
    const { introVideo, stillImg, clickVideo, detailLabel, sliderSrcs } = zone.click;
    detailLocName.textContent = detailLabel;
    if (sliderSrcs?.length) buildSlider(sliderSrcs);
    if (introVideo) {
        pendingStill     = stillImg   || '';
        pendingPlayVideo = clickVideo || '';
        detailImg.src    = '';
        detailImg.style.opacity = '0';
        playBtn.style.display   = 'none';
        detailEl.classList.add('on');
        detailVideo.src = introVideo;
        detailVideo.load();
        detailVideo.classList.add('on');
        detailVideo.play();
        if (sliderSrcs?.length) sliderEl.classList.add('on');
    } else if (stillImg) {
        pendingStill     = '';
        pendingPlayVideo = clickVideo || '';
        scene.style.transformOrigin = `${e.clientX}px ${e.clientY}px`;
        scene.style.transition = 'transform 0.28s cubic-bezier(0.4,0,1,1)';
        scene.style.transform  = 'scale(5)';
        setTimeout(() => {
            scene.style.transition      = 'none';
            scene.style.transform       = '';
            scene.style.transformOrigin = '';
            showStillWithPlay(stillImg, clickVideo || '');
            detailEl.classList.add('on');
            if (sliderSrcs?.length) sliderEl.classList.add('on');
        }, 280);
    }
});

/* ── Zone hover + click ──────────────────────────────────────── */

const detailEl        = document.getElementById("mp-detail");
const detailImg       = document.getElementById("mp-detail-img");
const detailClose     = document.getElementById("mp-detail-close");
const detailVideo     = document.getElementById("mp-detail-video");
const detailLocName   = document.getElementById("mp-detail-location-name");
const playBtn         = document.getElementById("mp-play-btn");
const sliderEl        = document.getElementById("mp-slider");
const lightboxEl      = document.getElementById("mp-lightbox");
const lightboxImg     = document.getElementById("mp-lightbox-img");
const lightboxVideo   = document.getElementById("mp-lightbox-video");
const lbPrev          = document.getElementById("mp-lb-prev");
const lbNext          = document.getElementById("mp-lb-next");
const lbClose         = document.getElementById("mp-lb-close");

// Each item: { thumb, video } — video is null for plain images
let sliderItems = [];
let lightboxIndex = 0;

function buildSlider(rawList) {
    sliderItems = rawList.map(entry => {
        const parts = entry.split("|video:");
        return { thumb: parts[0], video: parts[1] || null };
    });
    sliderEl.innerHTML = "";
    sliderItems.forEach((item, i) => {
        const wrap = document.createElement("div");
        wrap.className = "mp-slider-item";
        const img = document.createElement("img");
        img.className = "mp-slider-thumb";
        img.src = item.thumb;
        img.draggable = false;
        wrap.appendChild(img);
        if (item.video) {
            const playIcon = document.createElement("div");
            playIcon.className = "mp-slider-play";
            playIcon.innerHTML = `<svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/><polygon points="11,8 22,14 11,20" fill="white"/></svg>`;
            wrap.appendChild(playIcon);
        }
        wrap.addEventListener("click", () => openLightbox(i));
        sliderEl.appendChild(wrap);
    });
}

function setLightboxItem(index) {
    const item = sliderItems[index];
    if (item.video) {
        lightboxImg.style.display   = "none";
        lightboxVideo.style.display = "";
        lightboxVideo.src = item.video;
        lightboxVideo.load();
        lightboxVideo.play();
        lbPrev.style.display = "none";
        lbNext.style.display = "none";
    } else {
        lightboxVideo.pause();
        lightboxVideo.src = "";
        lightboxVideo.style.display = "none";
        lightboxImg.style.display   = "";
        lightboxImg.src = item.thumb;
        lbPrev.style.display = sliderItems.length > 1 ? "" : "none";
        lbNext.style.display = sliderItems.length > 1 ? "" : "none";
    }
}

function openLightbox(index) {
    lightboxIndex = index;
    setLightboxItem(lightboxIndex);
    lightboxEl.classList.add("on");
}

function lightboxStep(dir) {
    lightboxIndex = (lightboxIndex + dir + sliderItems.length) % sliderItems.length;
    setLightboxItem(lightboxIndex);
}

function closeLightbox() {
    lightboxVideo.pause();
    lightboxVideo.src = "";
    lightboxEl.classList.remove("on");
}

lbClose.addEventListener("click", closeLightbox);
lbPrev.addEventListener("click",  () => lightboxStep(-1));
lbNext.addEventListener("click",  () => lightboxStep(1));
lightboxEl.addEventListener("click", e => { if (e.target === lightboxEl) closeLightbox(); });
document.addEventListener("keydown", e => {
    if (!lightboxEl.classList.contains("on")) return;
    if (e.key === "ArrowLeft")  lightboxStep(-1);
    if (e.key === "ArrowRight") lightboxStep(1);
    if (e.key === "Escape")     closeLightbox();
});

// pendingStill / pendingPlayVideo hold the next still/video for after intro ends
let pendingStill     = "";
let pendingPlayVideo = "";

function resetVideo() {
    detailVideo.pause();
    detailVideo.removeAttribute("src");
    detailVideo.load();
    detailVideo.classList.remove("on");
}

function showStillWithPlay(imgSrc, playVideoSrc) {
    pendingPlayVideo = playVideoSrc || "";
    detailImg.src    = imgSrc;
    detailImg.style.opacity = "1";
    playBtn.style.display   = playVideoSrc ? "" : "none";
    // Mostrar botón parcelas solo en w8_still (Clubhouse)
    if (imgSrc.includes("w8_still")) {
        parcelasBtn.classList.add("visible");
    } else {
        parcelasBtn.classList.remove("visible");
    }
}

function closeDetail() {
    resetVideo();
    closeLightbox();
    hidePadrones();
    parcelasBtn.classList.remove("visible");
    sliderEl.classList.remove("on");
    sliderEl.innerHTML = "";
    sliderItems = [];
    detailEl.classList.remove("on");
    detailImg.style.opacity = "";
    playBtn.style.display   = "";
    setTimeout(() => { detailImg.src = ""; }, 350);
}

// Video ended handler — decides what comes next
detailVideo.addEventListener("ended", () => {
    resetVideo();
    if (pendingStill) {
        showStillWithPlay(pendingStill, pendingPlayVideo);
        pendingStill = "";
    }
});

// Play button → launch the second animation video over the still
playBtn.addEventListener("click", () => {
    if (!pendingPlayVideo) return;
    playBtn.style.display   = "none";
    detailImg.style.opacity = "0";
    detailVideo.src = pendingPlayVideo;
    detailVideo.load();
    detailVideo.classList.add("on");
    detailVideo.play();
    // pendingStill = current still so ended handler restores it with play button
    pendingStill = detailImg.src;
    // pendingPlayVideo kept so play button reappears after video ends
});

const parcelasBtn  = document.getElementById("mp-parcelas-btn");
const padronesEl   = document.getElementById("mp-padrones");
const padronesBack = document.getElementById("mp-padrones-back");

function showPadrones() {
    padronesEl.classList.add("on");
}
function hidePadrones() {
    resetCamara();
    padronesEl.classList.remove("on");
}

const camaraVideo = document.getElementById('mp-camara-video');
const camaraBtn   = document.getElementById('mp-camara-btn');
const camaraLabel = camaraBtn.querySelector('span');
let camaraState   = 'inferior';

function resetCamara() {
    camaraVideo.pause();
    camaraVideo.removeAttribute('src');
    camaraVideo.load();
    camaraVideo.classList.remove('on');
    camaraState = 'inferior';
    camaraLabel.textContent = 'Cámara inferior';
    camaraBtn.disabled = false;
}

camaraBtn.addEventListener('click', () => {
    camaraBtn.disabled = true;

    if (camaraState === 'inferior') {
        camaraVideo.src = 'videos/masterplanes/camara-inferior.mp4';
        camaraVideo.load();
        camaraVideo.classList.add('on');
        camaraVideo.play();
        camaraVideo.addEventListener('ended', () => {
            // Quedar en último frame (video pausado, visible)
            camaraState = 'superior';
            camaraLabel.textContent = 'Cámara superior';
            camaraBtn.disabled = false;
        }, { once: true });

    } else {
        // Reproducir reverso desde el último frame (ya cargado)
        camaraVideo.src = 'videos/masterplanes/camara-superior.mp4';
        camaraVideo.load();
        camaraVideo.play();
        camaraVideo.addEventListener('ended', () => {
            // Volver a mostrar padrones.jpg
            camaraVideo.classList.remove('on');
            setTimeout(() => { camaraVideo.removeAttribute('src'); camaraVideo.load(); }, 420);
            camaraState = 'inferior';
            camaraLabel.textContent = 'Cámara inferior';
            camaraBtn.disabled = false;
        }, { once: true });
    }
});

const verParcelarioBtn  = document.getElementById('mp-ver-parcelario');
const parcelarioBackBtn = document.getElementById('mp-parcelario-back');

function resetParcelario() {
    verParcelarioBtn.classList.remove('hidden');
    parcelarioBackBtn.classList.remove('visible');
}

verParcelarioBtn.addEventListener('click', () => {
    verParcelarioBtn.classList.add('hidden');
    parcelarioBackBtn.classList.add('visible');
});

parcelarioBackBtn.addEventListener('click', () => {
    hidePadrones();
});

parcelasBtn.addEventListener("click", showPadrones);
padronesBack.addEventListener("click", hidePadrones);

detailClose.addEventListener("click", () => { hidePadrones(); closeDetail(); });
detailEl.addEventListener("click", e => { if (e.target === detailEl) closeDetail(); });
document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !lightboxEl.classList.contains("on")) {
        if (padronesEl.classList.contains("on")) hidePadrones();
        else closeDetail();
    }
});

// Click por zona migrado al handler de scene (canvas-based, ver arriba)
