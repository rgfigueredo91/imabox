<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Masterplanes 3D | Imabox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="favicon.png"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .mp-scene {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* ── IMAGE / VIDEO LAYERS ───────────────────────────────────
           z1  static frames (A/B swap for crossfade between views)
           z2  active video
           z3  black overlay
        ──────────────────────────────────────────────────────────── */
        .mp-frame, .mp-video {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Two static frame slots for crossfading */
        .mp-frame {
            z-index: 1;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .mp-frame.visible { opacity: 1; }

        .mp-video {
            z-index: 2;
            opacity: 0;
            transition: none;
        }
        .mp-scene.is-playing  .mp-video { opacity: 1; }
        .mp-scene.is-fading   .mp-video { opacity: 0; transition: opacity 0.6s ease; }

        /* Bridge — sits above video, covers black gap during src switch */
        .mp-bridge {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-bridge.active { opacity: 1; }

        /* Black overlay — fades out after Ingresar */
        .mp-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: #000;
            transition: opacity 1.2s ease;
            pointer-events: none;
        }
        .mp-scene.is-cover   .mp-overlay,
        .mp-scene.is-playing .mp-overlay,
        .mp-scene.is-done1   .mp-overlay,
        .mp-scene.is-playing2 .mp-overlay,
        .mp-scene.is-done2   .mp-overlay { opacity: 0; }

        /* ── LANDING ─────────────────────────────────────────────── */
        .mp-landing {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            transition: opacity 0.8s ease;
        }
        .mp-scene.is-cover    .mp-landing,
        .mp-scene.is-playing  .mp-landing,
        .mp-scene.is-done1    .mp-landing,
        .mp-scene.is-playing2 .mp-landing,
        .mp-scene.is-done2    .mp-landing { opacity: 0; pointer-events: none; }

        .mp-title-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp 1.2s ease 0.3s both;
        }
        .mp-title {
            font-size: clamp(2.4rem, 8vw, 6rem);
            font-weight: 200;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            line-height: 1;
        }
        .mp-subtitle {
            font-size: clamp(0.65rem, 1.6vw, 0.95rem);
            font-weight: 300;
            letter-spacing: 0.55em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-top: 12px;
            align-self: flex-end;
        }

        .mp-btn-enter {
            background: rgba(0,0,0,0.4);
            border: 1.5px solid rgba(255,255,255,0.65);
            color: #fff;
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding: 16px 52px;
            cursor: pointer;
            animation: fadeUp 1.2s ease 0.6s both;
            transition: background 0.3s, border-color 0.3s;
        }
        .mp-btn-enter:hover { background: rgba(0,0,0,0.65); border-color: #fff; }

        /* ── INICIAR (center) ────────────────────────────────────── */
        .mp-btn-iniciar {
            position: absolute;
            inset: 0; margin: auto;
            width: fit-content; height: fit-content;
            z-index: 10;
            background: rgba(0,0,0,0.45);
            border: 1.5px solid rgba(255,255,255,0.7);
            color: #fff;
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding: 16px 52px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease 0.5s, background 0.3s, border-color 0.3s;
        }
        .mp-scene.is-cover .mp-btn-iniciar { opacity: 1; pointer-events: all; }
        .mp-scene.is-playing .mp-btn-iniciar,
        .mp-scene.is-done1   .mp-btn-iniciar,
        .mp-scene.is-playing2 .mp-btn-iniciar,
        .mp-scene.is-done2   .mp-btn-iniciar { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .mp-btn-iniciar:hover { background: rgba(0,0,0,0.65); border-color: #fff; }

        /* ── NAV ARROWS (right / left sides, vertically centered) ── */
        .mp-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.35);
            border: 1.5px solid rgba(255,255,255,0.5);
            color: #fff;
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease, background 0.25s, border-color 0.25s;
            font-family: inherit;
        }
        .mp-arrow:hover { background: rgba(0,0,0,0.65); border-color: #fff; }

        .mp-arrow-right { right: 32px; }
        .mp-arrow-left  { left: 32px; }

        /* Show right arrow after video 1 ends */
        .mp-scene.is-done1 .mp-arrow-right { opacity: 1; pointer-events: all; }

        /* Show left arrow after video 2 ends */
        .mp-scene.is-done2 .mp-arrow-left  { opacity: 1; pointer-events: all; }

        /* ── HOVER OVERLAY IMAGES ────────────────────────────────── */
        .mp-hover-img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-hover-img.on { opacity: 1; }

        /* ── ZONA HOVER — solo activa en is-done1 ────────────────── */
        .mp-zone-layer {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            z-index: 7;
            pointer-events: none;
        }
        .mp-scene.is-done1 .mp-zone-layer { pointer-events: all; }

        .mp-zone {
            position: absolute;
            cursor: default;
            /* para debug: background: rgba(255,0,0,0.18); */
        }

        /* ── ANIMATIONS ─────────────────────────────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── LOADER ──────────────────────────────────────────────── */
        .mp-loader {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity 0.9s ease;
        }
        .mp-loader.done { opacity: 0; pointer-events: none; }

        .mp-loader-label {
            font-size: 0.6rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
        }

        .mp-loader-track {
            width: 180px;
            height: 1px;
            background: rgba(255,255,255,0.12);
            position: relative;
        }
        .mp-loader-bar {
            position: absolute;
            inset: 0;
            width: 0%;
            background: rgba(255,255,255,0.75);
            transition: width 0.25s ease;
        }

        /* ── HOTSPOTS ─────────────────────────────────────────────── */
        .mp-hotspot {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .mp-scene.is-done1 .mp-hotspot { opacity: 1; }
        .mp-scene.is-terreno .mp-hotspot { opacity: 0; }
        .mp-zone:hover .mp-hotspot { opacity: 0; }

        /* inner dot */
        .mp-hotspot::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 6px rgba(255,255,255,0.6);
        }
        /* outer ring — animates outward and fades */
        .mp-hotspot::after {
            content: '';
            position: absolute;
            inset: -7px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.7);
            animation: hotspot-pulse 2.2s ease-out infinite;
            animation-delay: inherit;
        }
        @keyframes hotspot-pulse {
            0%   { transform: scale(1);   opacity: 0.8; }
            100% { transform: scale(2.6); opacity: 0;   }
        }

        /* ── ZOOM TRANSITION ──────────────────────────────────────── */
        .mp-scene {
            transition: transform 0.3s cubic-bezier(0.4, 0, 1, 1);
        }

        /* ── ZONE CLICKABLE CURSOR ────────────────────────────────── */
        .mp-scene.is-done1 .mp-zone { cursor: pointer; }

        /* ── DETAIL VIEW ──────────────────────────────────────────── */
        .mp-detail {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .mp-detail.on { opacity: 1; pointer-events: all; }

        .mp-detail-img {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .mp-detail-close {
            position: absolute;
            top: 24px;
            right: 32px;
            background: rgba(0,0,0,0.45);
            border: 1.5px solid rgba(255,255,255,0.55);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            z-index: 2;
        }
        .mp-detail-close:hover { background: rgba(0,0,0,0.75); border-color: #fff; }

        /* ── DETAIL LOCATION LABEL ────────────────────────────────── */
        .mp-detail-location {
            position: absolute;
            bottom: 32px;
            right: 36px;
            text-align: right;
            z-index: 4;
            pointer-events: none;
        }
        .mp-detail-location-name {
            font-size: clamp(1.6rem, 4vw, 3.2rem);
            font-weight: 200;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            line-height: 1.15;
            max-width: 52vw;
        }

        /* ── GOMEZ PLATERO header ─────────────────────────────────── */
        .mp-brand {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            pointer-events: none;
        }
        .mp-brand-name {
            font-size: clamp(0.6rem, 1.4vw, 0.85rem);
            font-weight: 200;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
        }
        .mp-brand-line {
            width: 32px;
            height: 1px;
            background: rgba(255,255,255,0.3);
        }

        /* ── PROYECTO / TERRENO tabs ──────────────────────────────── */
        .mp-tabs {
            position: absolute;
            top: 28px;
            right: 36px;
            z-index: 20;
            display: flex;
            gap: 2px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .mp-scene.is-done1 .mp-tabs { opacity: 1; pointer-events: all; }

        .mp-tab {
            font-family: inherit;
            font-size: 0.62rem;
            font-weight: 300;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            padding: 6px 14px 5px;
            cursor: pointer;
            transition: color 0.25s, border-color 0.25s;
        }
        .mp-tab:hover { color: rgba(255,255,255,0.75); }
        .mp-tab.active {
            color: #fff;
            border-bottom-color: rgba(255,255,255,0.6);
        }

        /* Terreno image layer — above hover overlays (z5), below zone layer (z7) */
        .mp-terreno {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-terreno.on { opacity: 1; }

        /* Hide right arrow when on terreno or nocturna tab */
        .mp-scene.is-terreno  .mp-arrow-right { opacity: 0 !important; pointer-events: none !important; }
        .mp-scene.is-nocturna .mp-arrow-right { opacity: 0 !important; pointer-events: none !important; }
        .mp-scene.is-nocturna .mp-hotspot     { opacity: 0; }

        /* Nocturna image layer — same stack as terreno (z6) */
        .mp-nocturna {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-nocturna.on { opacity: 1; }

        /* ── LOCATION LABEL ───────────────────────────────────────── */
        .mp-location {
            position: absolute;
            bottom: 32px;
            right: 36px;
            text-align: right;
            z-index: 21;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .mp-scene.is-done1 .mp-location,
        .mp-scene.is-done2 .mp-location { opacity: 1; }

        .mp-location-name {
            font-size: clamp(1.6rem, 4vw, 3.2rem);
            font-weight: 200;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            line-height: 1.15;
            transition: opacity 0.3s ease;
            max-width: 52vw;
        }
        .mp-location-name.fade { opacity: 0; }

        /* ── PLAY BUTTON centrado sobre la imagen ─────────────────── */
        .mp-play-btn {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 80px; height: 80px;
            z-index: 2;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.75);
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            transition: background 0.25s, border-color 0.25s, transform 0.2s;
            animation: mp-pulse 2.4s ease-in-out infinite;
        }
        .mp-play-btn:hover {
            background: rgba(0,0,0,0.65);
            border-color: #fff;
            transform: scale(1.08);
            animation: none;
        }
        .mp-play-btn svg { margin-left: 5px; }

        @keyframes mp-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25); }
            50%      { box-shadow: 0 0 0 18px rgba(255,255,255,0); }
        }

        /* ── IMAGE SLIDER ─────────────────────────────────────────── */
        .mp-slider {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            z-index: 5;
            padding: 16px 36px 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s;
            pointer-events: none;
        }
        .mp-slider::-webkit-scrollbar { display: none; }
        .mp-slider.on { opacity: 1; transform: translateY(0); pointer-events: all; }

        .mp-slider-thumb {
            flex-shrink: 0;
            width: 110px;
            height: 72px;
            object-fit: cover;
            object-position: center;
            border: 1.5px solid rgba(255,255,255,0.25);
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
            user-select: none;
            -webkit-user-drag: none;
        }
        .mp-slider-thumb:hover {
            border-color: rgba(255,255,255,0.85);
            transform: scale(1.06);
        }

        /* Video thumb wrapper */
        .mp-slider-item {
            position: relative;
            flex-shrink: 0;
            width: 110px;
            height: 72px;
        }
        .mp-slider-item .mp-slider-thumb {
            width: 100%; height: 100%;
        }
        .mp-slider-item .mp-slider-play {
            position: absolute;
            inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .mp-slider-item .mp-slider-play svg {
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7));
        }

        /* ── SLIDER LIGHTBOX ───────────────────────────────────────── */
        .mp-lightbox {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: rgba(0,0,0,0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .mp-lightbox.on { opacity: 1; pointer-events: all; }

        .mp-lightbox-img {
            max-width: 90%;
            max-height: 88%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        .mp-lightbox-close {
            position: absolute;
            top: 20px; right: 28px;
            background: rgba(0,0,0,0.45);
            border: 1.5px solid rgba(255,255,255,0.55);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .mp-lightbox-close:hover { background: rgba(0,0,0,0.75); border-color: #fff; }

        .mp-lightbox-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            border: 1.5px solid rgba(255,255,255,0.45);
            color: #fff;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-family: inherit;
        }
        .mp-lightbox-arrow:hover { background: rgba(0,0,0,0.7); border-color: #fff; }
        .mp-lightbox-arrow.prev { left: 28px; }
        .mp-lightbox-arrow.next { right: 28px; }

        /* ── VIDEO PLAYER sobre la imagen ─────────────────────────── */
        .mp-detail-video {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .mp-detail-video.on { opacity: 1; pointer-events: all; }
    </style>
</head>
<body>

<!-- Loader -->
<div class="mp-loader" id="mp-loader">
    <span class="mp-loader-label">cargando</span>
    <div class="mp-loader-track">
        <div class="mp-loader-bar" id="mp-loader-bar"></div>
    </div>
</div>

<div class="mp-scene" id="mp-scene">

    <!-- Static frame layers (A/B crossfade) -->
    <img class="mp-frame visible" id="mp-frame-a" src="img/masterplanes/start.jpg" alt="" draggable="false" />
    <img class="mp-frame" id="mp-frame-b" src=""                            alt="" draggable="false" />

    <!-- WebP hover overlays con alpha — se superponen sobre la imagen base -->
    <img class="mp-hover-img" id="mp-h1" src="img/masterplanes/hovers/w1.webp" draggable="false" />
    <img class="mp-hover-img" id="mp-h3" src="img/masterplanes/hovers/w3.webp" draggable="false" />
    <img class="mp-hover-img" id="mp-h5" src="img/masterplanes/hovers/w5.webp" draggable="false" />
    <img class="mp-hover-img" id="mp-h6" src="img/masterplanes/hovers/w6.webp" draggable="false" />
    <img class="mp-hover-img" id="mp-h7" src="img/masterplanes/hovers/w7.webp" draggable="false" />
    <img class="mp-hover-img" id="mp-h8" src="img/masterplanes/hovers/w8.webp" draggable="false" />
    <img class="mp-hover-img" id="mp-h9" src="img/masterplanes/hovers/w9.webp" draggable="false" />

    <!-- Terreno image layer -->
    <img class="mp-terreno" id="mp-terreno" src="img/masterplanes/terreno.jpg" alt="" draggable="false" />

    <!-- Nocturna image layer -->
    <img class="mp-nocturna" id="mp-nocturna" src="img/masterplanes/noche.jpg" alt="" draggable="false" />

    <!-- Video layer -->
    <video class="mp-video" id="mp-video"
           src="videos/masterplanes/zoom.mp4"
           preload="auto" playsinline muted></video>

    <!-- Zonas invisibles — bounding box exacto leído del alpha de cada WebP -->
    <div class="mp-zone-layer">
        <!-- w1: trapecio arriba-izq — zoom → still → play button → animate + slider -->
        <div class="mp-zone" data-hover="mp-h1"
             data-label="Reserva de Mar — Country Marítimo"
             data-detail-label="Terrazas de Mar"
             data-click-img="img/masterplanes/detail/Gemini_Generated_Image_dih2xedih2xedih2.jpg"
             data-click-video="img/masterplanes/detail/animate_slow_zoom_202604222317.mp4"
             data-slider="img/masterplanes/detail/w1/s1.png,img/masterplanes/detail/w1/s2.png,img/masterplanes/detail/w1/s3.png"
             style="left:19.5%;top:21.5%;width:9%;height:6.5%">

        <div class="mp-zone" data-hover="mp-h3"

             data-click-video="img/masterplanes/detail/animate_slow_zoom_202604232050.mp4"
             data-slider="img/masterplanes/detail/w3/s1.jpg,img/masterplanes/detail/w3/s2.jpg,img/masterplanes/detail/w3/s3.jpg,img/masterplanes/detail/w3/s4.png"
             style="left:33.5%;top:44%;width:6.5%;height:4.5%">
            <div class="mp-hotspot" style="animation-delay:0.3s"></div>
        </div>
        <!-- w5: forma alta centro-izq — zoom → still → play button → animate + slider -->
        <div class="mp-zone" data-hover="mp-h5"
             data-label="Reserva de Mar — Country Marítimo"
             data-detail-label="Sector Parque"
             data-click-img="img/masterplanes/detail/omni-6f803821-a455-4c84-8c9d-99863e33c64f.png"
             data-click-video="img/masterplanes/detail/animate_slow_zoom_202604232102.mp4"
             data-slider="img/masterplanes/detail/w5/s1.png,img/masterplanes/detail/w5/s2.png"
             style="left:30.5%;top:20%;width:6%;height:17.5%">
            <div class="mp-hotspot" style="animation-delay:0.6s"></div>
        </div>
        <!-- w6: ala pequeña centro-arriba — intro video → still → play button → animate + slider -->
        <div class="mp-zone" data-hover="mp-h6"
             data-label="Reserva de Mar — Country Marítimo"
             data-detail-label="Acceso Portal"
             data-intro-video="img/masterplanes/detail/fast_cinematic_zoom_out.mp4"
             data-click-img="img/masterplanes/detail/Gemini_Generated_Image_b4wkzlb4wkzlb4wk.jpg"
             data-click-video="img/masterplanes/detail/animate_slow_zoom_202604222231.mp4"
             data-slider="img/masterplanes/detail/w6/s1.jpg"
             style="left:39.5%;top:14.5%;width:7%;height:5%">
            <div class="mp-hotspot" style="animation-delay:0.9s"></div>
        </div>
        <!-- w7: franja vertical fina — intro video → still → play button → animate -->
        <div class="mp-zone" data-hover="mp-h7"
             data-label="Reserva de Mar — Country Marítimo"
             data-detail-label="Bulevar Principal"
             data-intro-video="img/masterplanes/detail/zoom_in_smooth_202604242001.mp4"
             data-click-img="img/masterplanes/detail/Gemini_Generated_Image_cl1lvbcl1lvbcl1l.jpg"
             data-click-video="img/masterplanes/detail/Animate_slow_zoom_202604231030.mp4"
             style="left:43.5%;top:19.5%;width:2.5%;height:14%">
            <div class="mp-hotspot" style="animation-delay:1.2s"></div>
        </div>
        <!-- w8: curva pequeña — intro video invertido → still → play button → animate + slider -->
        <div class="mp-zone" data-hover="mp-h8"
             data-label="Reserva de Mar — Country Marítimo"
             data-intro-video="img/masterplanes/detail/zoom_out_smooth_w8_rev.mp4"
             data-click-img="img/masterplanes/detail/w8_still.jpg"
             data-click-video="img/masterplanes/detail/animate_slow_zoom_202604251626.mp4"
             data-slider="img/masterplanes/detail/w8/s1.png,img/masterplanes/detail/w8/s1.png|video:img/masterplanes/detail/w8/v1.mp4"
             style="left:44%;top:39%;width:5.5%;height:3.5%">
            <div class="mp-hotspot" style="animation-delay:1.5s"></div>
        </div>
        <!-- w9: forma arriba-izq baja -->
        <div class="mp-zone" data-hover="mp-h9"
             data-label="Reserva de Mar — Country Marítimo"
             data-click-img="img/masterplanes/detail/Gemini_Generated_Image_cl1lvbcl1lvbcl1l.jpg"
             style="left:5%;top:54%;width:5%;height:7%">

        </div>
    </div>

    <!-- Black overlay -->
    <div class="mp-overlay"></div>

    <!-- Bridge: covers black gap while new video src loads -->
    <img class="mp-bridge" id="mp-bridge" src="" alt="" draggable="false" />

    <!-- Detail view (post-zoom fullscreen image) -->
    <div class="mp-detail" id="mp-detail">
        <img class="mp-detail-img" id="mp-detail-img" src="" alt="" draggable="false" />

        <!-- Animated play button -->
        <button class="mp-play-btn" id="mp-play-btn" aria-label="Ver animación">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="8,4 24,14 8,24" fill="white"/>
            </svg>
        </button>

        <!-- Animation video (plays over the still image) -->
        <video class="mp-detail-video" id="mp-detail-video"
               src="img/masterplanes/detail/Animate_slow_zoom_202604231030.mp4"
               playsinline preload="none"></video>

        <!-- Image slider (per-zone) -->
        <div class="mp-slider" id="mp-slider"></div>

        <!-- Lightbox for expanded slider image / video -->
        <div class="mp-lightbox" id="mp-lightbox">
            <img class="mp-lightbox-img" id="mp-lightbox-img" src="" alt="" draggable="false" />
            <video class="mp-lightbox-img" id="mp-lightbox-video" src="" playsinline controls style="display:none;background:#000;"></video>
            <button class="mp-lightbox-arrow prev" id="mp-lb-prev">&#8249;</button>
            <button class="mp-lightbox-arrow next" id="mp-lb-next">&#8250;</button>
            <button class="mp-lightbox-close" id="mp-lb-close">&#10005;</button>
        </div>

        <div class="mp-detail-location">
            <span class="mp-detail-location-name" id="mp-detail-location-name"></span>
        </div>

        <button class="mp-detail-close" id="mp-detail-close">&#10005;</button>
    </div>

    <!-- Gomez Platero brand -->
    <div class="mp-brand">
        <span class="mp-brand-name">Gomez Platero</span>
        <div class="mp-brand-line"></div>
    </div>

    <!-- Proyecto / Terreno / Nocturna tabs -->
    <div class="mp-tabs">
        <button class="mp-tab active" id="mp-tab-proyecto">Proyecto</button>
        <button class="mp-tab"        id="mp-tab-terreno">Terreno</button>
        <button class="mp-tab"        id="mp-tab-nocturna">Nocturna</button>
    </div>

    <!-- Location label -->
    <div class="mp-location">
        <span class="mp-location-name" id="mp-location-name">Reserva de Mar — Country Marítimo</span>
    </div>

    <!-- Landing -->
    <div class="mp-landing">
        <div class="mp-title-wrap">
            <h1 class="mp-title">masterplanes</h1>
            <p class="mp-subtitle">3D</p>
        </div>
        <button class="mp-btn-enter" id="mp-btn-enter">Ingresar</button>
    </div>

    <!-- Iniciar -->
    <button class="mp-btn-iniciar" id="mp-btn-iniciar">Iniciar</button>

    <!-- Navigation arrows -->
    <button class="mp-arrow mp-arrow-right" id="mp-arrow-right" aria-label="Siguiente">&#8250;</button>
    <button class="mp-arrow mp-arrow-left"  id="mp-arrow-left"  aria-label="Volver">&#8249;</button>

</div>

<script>
const scene      = document.getElementById("mp-scene");
const video      = document.getElementById("mp-video");
const frameA     = document.getElementById("mp-frame-a");
const bridge     = document.getElementById("mp-bridge");
const btnEnter   = document.getElementById("mp-btn-enter");
const btnIniciar = document.getElementById("mp-btn-iniciar");
const arrowRight = document.getElementById("mp-arrow-right");
const arrowLeft  = document.getElementById("mp-arrow-left");
const terrenoImg  = document.getElementById("mp-terreno");
const nocturnaImg = document.getElementById("mp-nocturna");
const tabProyecto = document.getElementById("mp-tab-proyecto");
const tabTerreno  = document.getElementById("mp-tab-terreno");
const tabNocturna = document.getElementById("mp-tab-nocturna");
const locationEl = document.getElementById("mp-location-name");

const DEFAULT_LABEL = "Reserva de Mar — Country Marítimo";
let locationTimer  = null;
let currentLabel   = DEFAULT_LABEL;

function setLocationLabel(label) {
    if (label === currentLabel) return;
    clearTimeout(locationTimer);
    locationTimer = setTimeout(() => {
        locationEl.classList.add("fade");
        setTimeout(() => {
            locationEl.textContent = label;
            currentLabel = label;
            locationEl.classList.remove("fade");
        }, 300);
    }, 60); // small delay cancels flicker between adjacent zones
}

/* ── Proyecto / Terreno / Nocturna tabs ──────────────────────────── */
tabProyecto.addEventListener("click", () => {
    tabProyecto.classList.add("active");
    tabTerreno.classList.remove("active");
    tabNocturna.classList.remove("active");
    terrenoImg.classList.remove("on");
    nocturnaImg.classList.remove("on");
    scene.classList.remove("is-terreno", "is-nocturna");
});

tabTerreno.addEventListener("click", () => {
    tabTerreno.classList.add("active");
    tabProyecto.classList.remove("active");
    tabNocturna.classList.remove("active");
    terrenoImg.classList.add("on");
    nocturnaImg.classList.remove("on");
    scene.classList.add("is-terreno");
    scene.classList.remove("is-nocturna");
});

tabNocturna.addEventListener("click", () => {
    tabNocturna.classList.add("active");
    tabProyecto.classList.remove("active");
    tabTerreno.classList.remove("active");
    nocturnaImg.classList.add("on");
    terrenoImg.classList.remove("on");
    scene.classList.add("is-nocturna");
    scene.classList.remove("is-terreno");
});

/* Reset tabs when leaving is-done1 state */
function resetTabs() {
    tabProyecto.classList.add("active");
    tabTerreno.classList.remove("active");
    tabNocturna.classList.remove("active");
    terrenoImg.classList.remove("on");
    nocturnaImg.classList.remove("on");
    scene.classList.remove("is-terreno", "is-nocturna");
}

/* Show bridge instantly (no transition) to match current view */
function showBridge(src) {
    bridge.style.transition = "none";
    bridge.src = src;
    bridge.classList.add("active");
    bridge.offsetHeight; // force reflow
    bridge.style.transition = "";
}

/* Hide bridge with fade once video first frame is ready */
function hideBridgeOnReady() {
    video.addEventListener("timeupdate", () => {
        bridge.classList.remove("active");
    }, { once: true });
}

function showStill(src) {
    // Show high-quality still over the video, then hide video
    showBridge(src);
    scene.classList.remove("is-playing");
}

function playNext(src, bridgeSrc, onEnded) {
    showBridge(bridgeSrc);
    scene.classList.add("is-playing");
    video.src = src;
    video.load();
    video.play();
    hideBridgeOnReady();
    video.addEventListener("ended", onEnded, { once: true });
}

/* ── Ingresar ───────────────────────────────────────────────── */
btnEnter.addEventListener("click", () => {
    scene.classList.add("is-cover");
});

/* ── Iniciar (video 1) ──────────────────────────────────────── */
btnIniciar.addEventListener("click", () => {
    scene.classList.remove("is-cover");
    playNext("videos/masterplanes/zoom.mp4", "img/masterplanes/start.jpg", () => {
        showStill("img/masterplanes/end1.jpg");
        scene.classList.add("is-done1");
    });
});

/* ── Arrow right → izquierda.mp4 forward ───────────────────── */
arrowRight.addEventListener("click", () => {
    resetTabs();
    scene.classList.remove("is-done1", "is-done2");
    playNext("videos/masterplanes/izquierda.mp4", "img/masterplanes/end1.jpg", () => {
        showStill("img/masterplanes/end2.jpg");
        scene.classList.add("is-done2");
    });
});

/* ── Arrow left → izquierda.mp4 reversed ───────────────────── */
arrowLeft.addEventListener("click", () => {
    scene.classList.remove("is-done1", "is-done2");
    playNext("videos/masterplanes/izquierda-rev.mp4", "img/masterplanes/end2.jpg", () => {
        showStill("img/masterplanes/end1.jpg");
        scene.classList.add("is-done1");
    });
});

/* ── Preload ─────────────────────────────────────────────────── */
(function () {
    const loader = document.getElementById("mp-loader");
    const bar    = document.getElementById("mp-loader-bar");

    const imgSrcs = [
        "img/masterplanes/start.jpg",
        "img/masterplanes/end1.jpg",
        "img/masterplanes/end2.jpg",
        "img/masterplanes/hovers/w1.webp",
        "img/masterplanes/hovers/w2.webp",
        "img/masterplanes/hovers/w3.webp",
        "img/masterplanes/hovers/w5.webp",
        "img/masterplanes/hovers/w6.webp",
        "img/masterplanes/hovers/w7.webp",
        "img/masterplanes/hovers/w8.webp",
        "img/masterplanes/hovers/w9.webp",
    ];

    const total = imgSrcs.length + 1; // +1 for first video
    let done = 0;

    function tick() {
        done++;
        bar.style.width = (done / total * 100) + "%";
    }

    const imgPromises = imgSrcs.map(src => new Promise(res => {
        const i = new Image();
        i.onload = i.onerror = () => { tick(); res(); };
        i.src = src;
    }));

    const videoReady = new Promise(res => {
        let settled = false;
        function once() { if (settled) return; settled = true; tick(); res(); }
        video.addEventListener("canplay", once, { once: true });
        video.addEventListener("error",   once, { once: true });
        setTimeout(once, 12000);
    });

    Promise.all([...imgPromises, videoReady]).then(() => {
        bar.style.width = "100%";
        setTimeout(() => {
            loader.classList.add("done");
            setTimeout(() => loader.remove(), 950);
        }, 350);
    });
})();

/* ── Zone hover + click ──────────────────────────────────────── */
let activeHover = null;

const detailEl        = document.getElementById("mp-detail");
const detailImg       = document.getElementById("mp-detail-img");
const detailClose     = document.getElementById("mp-detail-close");
const detailVideo     = document.getElementById("mp-detail-video");
const detailLocName   = document.getElementById("mp-detail-location-name");
const playBtn         = document.getElementById("mp-play-btn");
const sliderEl        = document.getElementById("mp-slider");
const lightboxEl      = document.getElementById("mp-lightbox");
const lightboxImg     = document.getElementById("mp-lightbox-img");
const lightboxVideo   = document.getElementById("mp-lightbox-video");
const lbPrev          = document.getElementById("mp-lb-prev");
const lbNext          = document.getElementById("mp-lb-next");
const lbClose         = document.getElementById("mp-lb-close");

// Each item: { thumb, video } — video is null for plain images
let sliderItems = [];
let lightboxIndex = 0;

function buildSlider(rawList) {
    sliderItems = rawList.map(entry => {
        const parts = entry.split("|video:");
        return { thumb: parts[0], video: parts[1] || null };
    });
    sliderEl.innerHTML = "";
    sliderItems.forEach((item, i) => {
        const wrap = document.createElement("div");
        wrap.className = "mp-slider-item";
        const img = document.createElement("img");
        img.className = "mp-slider-thumb";
        img.src = item.thumb;
        img.draggable = false;
        wrap.appendChild(img);
        if (item.video) {
            const playIcon = document.createElement("div");
            playIcon.className = "mp-slider-play";
            playIcon.innerHTML = `<svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/><polygon points="11,8 22,14 11,20" fill="white"/></svg>`;
            wrap.appendChild(playIcon);
        }
        wrap.addEventListener("click", () => openLightbox(i));
        sliderEl.appendChild(wrap);
    });
}

function setLightboxItem(index) {
    const item = sliderItems[index];
    if (item.video) {
        lightboxImg.style.display   = "none";
        lightboxVideo.style.display = "";
        lightboxVideo.src = item.video;
        lightboxVideo.load();
        lightboxVideo.play();
        lbPrev.style.display = "none";
        lbNext.style.display = "none";
    } else {
        lightboxVideo.pause();
        lightboxVideo.src = "";
        lightboxVideo.style.display = "none";
        lightboxImg.style.display   = "";
        lightboxImg.src = item.thumb;
        lbPrev.style.display = sliderItems.length > 1 ? "" : "none";
        lbNext.style.display = sliderItems.length > 1 ? "" : "none";
    }
}

function openLightbox(index) {
    lightboxIndex = index;
    setLightboxItem(lightboxIndex);
    lightboxEl.classList.add("on");
}

function lightboxStep(dir) {
    lightboxIndex = (lightboxIndex + dir + sliderItems.length) % sliderItems.length;
    setLightboxItem(lightboxIndex);
}

function closeLightbox() {
    lightboxVideo.pause();
    lightboxVideo.src = "";
    lightboxEl.classList.remove("on");
}

lbClose.addEventListener("click", closeLightbox);
lbPrev.addEventListener("click",  () => lightboxStep(-1));
lbNext.addEventListener("click",  () => lightboxStep(1));
lightboxEl.addEventListener("click", e => { if (e.target === lightboxEl) closeLightbox(); });
document.addEventListener("keydown", e => {
    if (!lightboxEl.classList.contains("on")) return;
    if (e.key === "ArrowLeft")  lightboxStep(-1);
    if (e.key === "ArrowRight") lightboxStep(1);
    if (e.key === "Escape")     closeLightbox();
});

// pendingStill / pendingPlayVideo hold the next still/video for after intro ends
let pendingStill     = "";
let pendingPlayVideo = "";

function resetVideo() {
    detailVideo.pause();
    detailVideo.removeAttribute("src");
    detailVideo.load();
    detailVideo.classList.remove("on");
}

function showStillWithPlay(imgSrc, playVideoSrc) {
    pendingPlayVideo = playVideoSrc || "";
    detailImg.src    = imgSrc;
    detailImg.style.opacity = "1";
    playBtn.style.display   = playVideoSrc ? "" : "none";
}

function closeDetail() {
    resetVideo();
    closeLightbox();
    sliderEl.classList.remove("on");
    sliderEl.innerHTML = "";
    sliderItems = [];
    detailEl.classList.remove("on");
    detailImg.style.opacity = "";
    playBtn.style.display   = "";
    setTimeout(() => { detailImg.src = ""; }, 350);
}

// Video ended handler — decides what comes next
detailVideo.addEventListener("ended", () => {
    resetVideo();
    if (pendingStill) {
        showStillWithPlay(pendingStill, pendingPlayVideo);
        pendingStill = "";
    }
});

// Play button → launch the second animation video over the still
playBtn.addEventListener("click", () => {
    if (!pendingPlayVideo) return;
    playBtn.style.display   = "none";
    detailImg.style.opacity = "0";
    detailVideo.src = pendingPlayVideo;
    detailVideo.load();
    detailVideo.classList.add("on");
    detailVideo.play();
    // pendingStill = current still so ended handler restores it with play button
    pendingStill = detailImg.src;
    // pendingPlayVideo kept so play button reappears after video ends
});

detailClose.addEventListener("click", closeDetail);
detailEl.addEventListener("click", e => { if (e.target === detailEl || e.target === detailImg) closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !lightboxEl.classList.contains("on")) closeDetail(); });

document.querySelectorAll(".mp-zone").forEach(zone => {
    const imgEl       = document.getElementById(zone.dataset.hover);
    const introVideo  = zone.dataset.introVideo;
    const clickImg    = zone.dataset.clickImg;
    const clickVideo  = zone.dataset.clickVideo;
    const detailLabel = zone.dataset.detailLabel || "";
    const sliderSrcs  = zone.dataset.slider ? zone.dataset.slider.split(",") : [];
    if (!imgEl) return;

    zone.addEventListener("mouseenter", () => {
        if (activeHover && activeHover !== imgEl) activeHover.classList.remove("on");
        activeHover = imgEl;
        imgEl.classList.add("on");
        setLocationLabel(zone.dataset.label || DEFAULT_LABEL);
    });
    zone.addEventListener("mouseleave", () => {
        imgEl.classList.remove("on");
        activeHover = null;
        setLocationLabel(DEFAULT_LABEL);
    });

    zone.addEventListener("click", e => {
        detailLocName.textContent = detailLabel;

        if (sliderSrcs.length) {
            buildSlider(sliderSrcs);
        }

        if (introVideo) {
            pendingStill     = clickImg   || "";
            pendingPlayVideo = clickVideo || "";
            detailImg.src    = "";
            detailImg.style.opacity = "0";
            playBtn.style.display   = "none";
            detailEl.classList.add("on");
            detailVideo.src = introVideo;
            detailVideo.load();
            detailVideo.classList.add("on");
            detailVideo.play();
            if (sliderSrcs.length) sliderEl.classList.add("on");

        } else if (clickImg) {
            pendingStill     = "";
            pendingPlayVideo = clickVideo || "";
            scene.style.transformOrigin = `${e.clientX}px ${e.clientY}px`;
            scene.style.transition = "transform 0.28s cubic-bezier(0.4,0,1,1)";
            scene.style.transform  = "scale(5)";
            setTimeout(() => {
                scene.style.transition      = "none";
                scene.style.transform       = "";
                scene.style.transformOrigin = "";
                showStillWithPlay(clickImg, clickVideo || "");
                detailEl.classList.add("on");
                if (sliderSrcs.length) sliderEl.classList.add("on");
            }, 280);
        }
    });
});
</script>
