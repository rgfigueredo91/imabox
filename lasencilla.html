<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Sencilla — GómezPlatero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: #0d0d0d;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* ── PROGRESS BAR ─────────────────────────────────── */
        .p-bar {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 2px;
            background: rgba(255,255,255,0.08);
            z-index: 200;
        }
        .p-bar-fill {
            height: 100%;
            background: rgba(255,255,255,0.65);
            transition: width 0.4s ease;
        }

        /* ── TOP NAV ──────────────────────────────────────── */
        .p-nav {
            position: fixed;
            top: 2px; left: 0; right: 0;
            height: 46px;
            background: #0d0d0d;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 199;
            gap: 18px;
        }

        .p-logo {
            flex-shrink: 0;
            line-height: 1;
        }
        .p-logo strong {
            font-size: 0.73rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            display: block;
        }
        .p-logo em {
            font-size: 0.42rem;
            font-weight: 300;
            font-style: normal;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
            display: block;
            margin-top: 2px;
        }

        .p-divider {
            width: 1px; height: 18px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .p-sections {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
            min-width: 0;
        }
        .p-sections::-webkit-scrollbar { display: none; }

        .p-sec {
            background: none;
            border: none;
            color: rgba(255,255,255,0.32);
            font-family: inherit;
            font-size: 0.58rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            border-radius: 2px;
            transition: color 0.2s, background 0.2s;
        }
        .p-sec:hover { color: rgba(255,255,255,0.7); }
        .p-sec.active { color: #fff; background: rgba(255,255,255,0.09); }

        .p-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .p-counter {
            font-size: 0.58rem;
            letter-spacing: 0.14em;
            color: rgba(255,255,255,0.32);
            min-width: 44px;
            text-align: right;
        }

        .p-icon-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.32);
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            transition: color 0.2s, background 0.2s;
        }
        .p-icon-btn:hover { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.07); }
        .p-icon-btn svg { width: 13px; height: 13px; }

        /* ── STAGE ────────────────────────────────────────── */
        .p-stage {
            position: fixed;
            top: 48px; left: 0; right: 0; bottom: 0;
            background: #0d0d0d;
        }

        .p-slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.45s ease;
            pointer-events: none;
        }
        .p-slide.active { opacity: 1; pointer-events: auto; }

        .p-slide img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ── ARROWS ───────────────────────────────────────── */
        .p-arrow {
            position: fixed;
            top: calc(50% + 24px);
            transform: translateY(-50%);
            z-index: 198;
            background: rgba(13,13,13,0.55);
            border: 1px solid rgba(255,255,255,0.13);
            color: rgba(255,255,255,0.55);
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1.35rem;
            font-family: inherit;
            transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.3s;
            opacity: 0.45;
            border-radius: 2px;
        }
        .p-arrow:hover { opacity: 1; background: rgba(0,0,0,0.85); border-color: rgba(255,255,255,0.35); color: #fff; }
        .p-arrow.hidden { opacity: 0 !important; pointer-events: none; }
        .p-prev { left: 16px; }
        .p-next { right: 16px; }

        /* ── CLICK ZONES ──────────────────────────────────── */
        .p-zone {
            position: fixed;
            top: 48px; bottom: 0;
            width: 28%;
            z-index: 10;
            cursor: pointer;
        }
        .p-zone-l { left: 0; }
        .p-zone-r { right: 0; }

        /* ── THUMBNAIL OVERLAY ────────────────────────────── */
        .p-thumbs {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 300;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
            padding: 60px 24px 24px;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .p-thumbs.open { opacity: 1; pointer-events: auto; }

        .p-thumb {
            width: calc(12.5% - 7px);
            aspect-ratio: 16/9;
            overflow: hidden;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: border-color 0.2s, opacity 0.2s;
            opacity: 0.6;
            flex-shrink: 0;
        }
        .p-thumb:hover { opacity: 1; }
        .p-thumb.active { border-color: rgba(255,255,255,0.8); opacity: 1; }
        .p-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .p-thumb-n {
            font-size: 0.5rem;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.35);
            margin-top: 3px;
            text-align: center;
        }

        .p-thumbs-close {
            position: fixed;
            top: 16px; right: 20px;
            z-index: 301;
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            font-family: inherit;
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 6px 14px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, color 0.2s;
        }
        .p-thumbs.open ~ .p-thumbs-close { opacity: 1; pointer-events: auto; }
        .p-thumbs-close:hover { color: #fff; }
    </style>
</head>
<body>

<div class="p-bar"><div class="p-bar-fill" id="p-bar-fill"></div></div>

<nav class="p-nav">
    <div class="p-logo">
        <strong>GómezPlatero</strong>
        <em>Arquitectura &amp; Urbanismo</em>
    </div>
    <div class="p-divider"></div>
    <div class="p-sections" id="p-sections"></div>
    <div class="p-right">
        <div class="p-counter" id="p-counter">01 / 32</div>
        <button class="p-icon-btn" id="p-thumb-btn" title="Vista general (T)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
                <rect x="3" y="12" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="5" rx="1"/>
                <rect x="3" y="19" width="7" height="2" rx="1"/><rect x="14" y="19" width="7" height="2" rx="1"/>
            </svg>
        </button>
        <button class="p-icon-btn" id="p-fs-btn" title="Pantalla completa (F)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
        </button>
    </div>
</nav>

<div class="p-stage" id="p-stage"></div>

<button class="p-arrow p-prev" id="p-prev">&#8249;</button>
<button class="p-arrow p-next" id="p-next">&#8250;</button>

<div class="p-zone p-zone-l" id="p-zone-l"></div>
<div class="p-zone p-zone-r" id="p-zone-r"></div>

<div class="p-thumbs" id="p-thumbs"></div>
<button class="p-thumbs-close" id="p-thumbs-close">Cerrar</button>

<script>
const SECTIONS = [
    "Inicio", "Ubicación", "Sitio", "Propuesta",
    "Amenidades", "Proyecto", "Visualización", "Referencias", "Áreas", "Fin"
];

const SLIDES = [
    { src: "img/lasencilla/slide-00.png", sec: 0 },
    { src: "img/lasencilla/slide-01.png", sec: 1 },
    { src: "img/lasencilla/slide-02.png", sec: 1 },
    { src: "img/lasencilla/slide-03.png", sec: 2 },
    { src: "img/lasencilla/slide-04.png", sec: 2 },
    { src: "img/lasencilla/slide-05.png", sec: 2 },
    { src: "img/lasencilla/slide-06.png", sec: 2 },
    { src: "img/lasencilla/slide-07.png", sec: 2 },
    { src: "img/lasencilla/slide-08.png", sec: 2 },
    { src: "img/lasencilla/slide-09.png", sec: 3 },
    { src: "img/lasencilla/slide-10.png", sec: 3 },
    { src: "img/lasencilla/slide-11.png", sec: 3 },
    { src: "img/lasencilla/slide-12.png", sec: 4 },
    { src: "img/lasencilla/slide-13.png", sec: 4 },
    { src: "img/lasencilla/slide-14.png", sec: 4 },
    { src: "img/lasencilla/slide-15.png", sec: 5 },
    { src: "img/lasencilla/slide-16.png", sec: 6 },
    { src: "img/lasencilla/slide-17.png", sec: 6 },
    { src: "img/lasencilla/slide-18.png", sec: 6 },
    { src: "img/lasencilla/slide-19.png", sec: 6 },
    { src: "img/lasencilla/slide-20.png", sec: 7 },
    { src: "img/lasencilla/slide-21.png", sec: 7 },
    { src: "img/lasencilla/slide-22.png", sec: 7 },
    { src: "img/lasencilla/slide-23.png", sec: 7 },
    { src: "img/lasencilla/slide-24.png", sec: 7 },
    { src: "img/lasencilla/slide-25.png", sec: 7 },
    { src: "img/lasencilla/slide-26.png", sec: 7 },
    { src: "img/lasencilla/slide-27.png", sec: 7 },
    { src: "img/lasencilla/slide-28.png", sec: 7 },
    { src: "img/lasencilla/slide-29.png", sec: 7 },
    { src: "img/lasencilla/slide-30.png", sec: 8 },
    { src: "img/lasencilla/slide-31.png", sec: 9 },
];

/* first slide index per section */
const secFirst = {};
SLIDES.forEach((s, i) => { if (!(s.sec in secFirst)) secFirst[s.sec] = i; });

/* DOM refs */
const stage       = document.getElementById("p-stage");
const secCont     = document.getElementById("p-sections");
const counter     = document.getElementById("p-counter");
const barFill     = document.getElementById("p-bar-fill");
const prevBtn     = document.getElementById("p-prev");
const nextBtn     = document.getElementById("p-next");
const zoneL       = document.getElementById("p-zone-l");
const zoneR       = document.getElementById("p-zone-r");
const fsBtn       = document.getElementById("p-fs-btn");
const thumbsEl    = document.getElementById("p-thumbs");
const thumbBtn    = document.getElementById("p-thumb-btn");
const thumbsClose = document.getElementById("p-thumbs-close");

/* Build slides */
const slideEls = SLIDES.map((s, i) => {
    const div = document.createElement("div");
    div.className = "p-slide";
    const img = document.createElement("img");
    img.src = s.src;
    img.draggable = false;
    div.appendChild(img);
    stage.appendChild(div);
    return div;
});

/* Build section nav */
const secBtns = SECTIONS.map((label, i) => {
    const btn = document.createElement("button");
    btn.className = "p-sec";
    btn.textContent = label;
    btn.addEventListener("click", () => goTo(secFirst[i]));
    secCont.appendChild(btn);
    return btn;
});

/* Build thumbnails */
const thumbEls = SLIDES.map((s, i) => {
    const wrap = document.createElement("div");
    const div = document.createElement("div");
    div.className = "p-thumb";
    const img = document.createElement("img");
    img.src = s.src;
    img.draggable = false;
    div.appendChild(img);
    const num = document.createElement("div");
    num.className = "p-thumb-n";
    num.textContent = String(i + 1).padStart(2, "0");
    div.addEventListener("click", () => { goTo(i); closeThumbsView(); });
    wrap.appendChild(div);
    wrap.appendChild(num);
    thumbsEl.appendChild(wrap);
    return div;
});

let current = 0;
let thumbsOpen = false;

function goTo(n) {
    n = Math.max(0, Math.min(n, SLIDES.length - 1));
    if (n === current) return;
    slideEls[current].classList.remove("active");
    current = n;
    slideEls[current].classList.add("active");
    updateUI();
    preload(current + 1);
    preload(current + 2);
}

function updateUI() {
    const num = current + 1;
    counter.textContent = `${String(num).padStart(2, "0")} / ${SLIDES.length}`;
    barFill.style.width = `${(num / SLIDES.length) * 100}%`;
    const sec = SLIDES[current].sec;
    secBtns.forEach((b, i) => b.classList.toggle("active", i === sec));
    secBtns[sec].scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    prevBtn.classList.toggle("hidden", current === 0);
    nextBtn.classList.toggle("hidden", current === SLIDES.length - 1);
    thumbEls.forEach((t, i) => t.classList.toggle("active", i === current));
}

function preload(n) {
    if (n < SLIDES.length) { const i = new Image(); i.src = SLIDES[n].src; }
}

function openThumbsView() {
    thumbsOpen = true;
    thumbsEl.classList.add("open");
    thumbEls[current].scrollIntoView({ block: "center", behavior: "smooth" });
}
function closeThumbsView() {
    thumbsOpen = false;
    thumbsEl.classList.remove("open");
}

/* Events */
prevBtn.addEventListener("click", () => goTo(current - 1));
nextBtn.addEventListener("click", () => goTo(current + 1));
zoneL.addEventListener("click",   () => goTo(current - 1));
zoneR.addEventListener("click",   () => goTo(current + 1));
thumbBtn.addEventListener("click", () => thumbsOpen ? closeThumbsView() : openThumbsView());
thumbsClose.addEventListener("click", closeThumbsView);

document.addEventListener("keydown", e => {
    if (thumbsOpen) { if (e.key === "Escape" || e.key === "t" || e.key === "T") closeThumbsView(); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); goTo(current + 1); }
    if (e.key === "ArrowLeft"  || e.key === "ArrowUp")  { e.preventDefault(); goTo(current - 1); }
    if (e.key === "t" || e.key === "T") openThumbsView();
    if (e.key === "f" || e.key === "F") fsBtn.click();
    if (e.key === "Home") goTo(0);
    if (e.key === "End")  goTo(SLIDES.length - 1);
    if (e.key === "Escape") { if (document.fullscreenElement) document.exitFullscreen(); }
});

fsBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
});

/* Init */
slideEls[0].classList.add("active");
updateUI();
preload(1);
preload(2);
</script>
</body>
</html>
