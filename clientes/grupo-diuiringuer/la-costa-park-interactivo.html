<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Costa Park &mdash; Interactivo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="img/lcp-simbolo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   La Costa Park - interactivo

   Es un recorrido por imagenes renderizadas: cada pantalla es un
   render, y encima van botones que llevan a otra pantalla con una
   transicion. Nada mas. Toda la estructura del recorrido esta en la
   tabla ESCENAS de abajo: para sumar una vista alcanza con agregar
   una entrada ahi, no hay que tocar ni el CSS ni la logica.

   Como esta hecha la transicion: hay DOS capas de imagen apiladas.
   La que entra se dibuja debajo, se espera a que este cargada de
   verdad (decode) y recien ahi se funde la de arriba. Si se hiciera
   con una sola imagen cambiando el src, se veria el parpadeo del
   render a medio bajar.
   ============================================================ */
:root{
  --verde:#38513C;
  --verde-osc:#22301F;
  --verde-noche:#161f15;
  --arena:#DAD7D1;
  --papel:#FBFAF7;
  --salvia:#A1A395;
  --terracota:#B95A3F;

  --serif:'Averia Serif Libre', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --sal:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}

/* ---------- puntero con la marca ----------
   El simbolo recortado en redondo, con el punto activo en el centro
   (16 16) porque es circular y no una flecha.
   Va con 'auto' de respaldo: si el PNG no carga, o el navegador no
   soporta cursores de imagen, queda el del sistema y no un puntero
   invisible. Sobre texto y campos se deja el cursor normal, que ahi
   el de marca estorba mas de lo que suma. */
body, #botones, .paso, .punto, .chip, #p-entrar, #p-saltar, .viv, .fi-menu button, .fi-btn, .fi-x{
  cursor:url('img/cursor.png') 16 16, auto;
}
input, textarea, select{cursor:auto}
body{
  margin:0; background:var(--verde-noche); color:var(--arena);
  font-family:var(--sans); font-weight:300; font-size:16px; line-height:1.6;
  overflow:hidden; -webkit-text-size-adjust:100%;
}
img{display:block}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
/* OJO: .chip es inline-flex y eso le gana a [hidden], asi que el boton
   de Atras se veia igual estando oculto */
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--terracota); outline-offset:3px}

/* ---------- las dos capas de imagen ---------- */
#vistas{position:fixed; inset:0; z-index:0; background:var(--verde-noche)}
#vistas img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; opacity:0;
  transition:opacity .75s ease, transform 1.2s var(--sal);
}
#vistas img.activa{opacity:1}
/* el empuje suave al entrar: da sensacion de avanzar sin marear */
#vistas img.entra{transform:scale(1.045)}
#velo{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  /* los renders van de un cielo quemado a un hormigon claro: sin peso
     abajo el titulo se pierde contra la pared */
  background:
    linear-gradient(180deg, rgba(18,26,18,.6) 0%, rgba(18,26,18,.1) 24%,
                            rgba(18,26,18,.34) 54%, rgba(18,26,18,.72) 78%,
                            rgba(18,26,18,.88) 100%);
}

/* ---------- barra ---------- */
#barra{
  position:fixed; inset:0 0 auto 0; height:68px; z-index:36;
  display:flex; align-items:center; gap:16px; padding:0 clamp(16px,3vw,34px);
  transition:opacity .6s ease;
}
/* mientras corre el video de entrada la barra estorba */
body.en-portada #barra{opacity:0; pointer-events:none}
#barra .marca img{height:34px; filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
#barra .sep{flex:1}
.chip{
  display:inline-flex; align-items:center; gap:9px;
  font-size:.66rem; letter-spacing:.16em; text-transform:uppercase;
  padding:11px 20px; border:1px solid rgba(218,215,209,.4);
  background:rgba(18,26,18,.32); backdrop-filter:blur(6px);
  transition:border-color .25s ease, background .25s ease, color .25s ease;
}
.chip:hover{border-color:var(--papel); background:rgba(251,250,247,.14); color:var(--papel)}

/* ---------- titulo de la escena ---------- */
#texto{
  position:fixed; left:clamp(16px,3vw,34px); bottom:clamp(120px,17vh,180px);
  z-index:15; max-width:min(560px, 82vw);
  transition:opacity .5s ease, transform .5s var(--sal);
}
#texto.oculto{opacity:0; transform:translateY(14px)}
#eyebrow{
  font-size:.68rem; font-weight:500; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(255,255,255,.86); margin:0 0 14px;
  display:flex; align-items:center; gap:13px;
  text-shadow:0 1px 10px rgba(0,0,0,.7);
}
#eyebrow::before{content:''; width:24px; height:1px; background:var(--terracota); flex:none}
#titulo{
  font-family:var(--serif); font-weight:400;
  font-size:clamp(1.7rem, 4vw, 3.1rem); line-height:1.12;
  text-transform:uppercase; color:#fff; margin:0;
  text-shadow:0 2px 24px rgba(0,0,0,.5);
}
#bajada{
  margin:16px 0 0; font-size:1.02rem; color:rgba(255,255,255,.86);
  max-width:44ch; text-shadow:0 1px 12px rgba(0,0,0,.55);
}

/* ---------- botones del recorrido ---------- */
#botones{
  position:fixed; left:0; right:0; bottom:0; z-index:18;
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
  padding:0 clamp(16px,3vw,34px) clamp(26px,4vh,42px);
  transition:opacity .4s ease, transform .4s var(--sal);
}
#botones.oculto{opacity:0; transform:translateY(12px); pointer-events:none}
.paso{
  display:inline-flex; align-items:center; gap:11px;
  padding:15px 28px;
  font-size:.72rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; background:rgba(18,26,18,.42);
  border:1px solid rgba(218,215,209,.45);
  backdrop-filter:blur(8px);
  transition:background .25s ease, border-color .25s ease, color .25s ease, transform .25s ease;
}
.paso:hover{background:var(--papel); border-color:var(--papel); color:var(--verde); transform:translateY(-2px)}
.paso.principal{background:var(--verde); border-color:var(--verde)}
.paso.principal:hover{background:var(--papel); color:var(--verde)}
.paso i{font-style:normal; opacity:.7; transition:transform .25s ease}
.paso:hover i{transform:translateX(3px)}

/* ---------- migas ---------- */
#migas{
  position:fixed; left:clamp(16px,3vw,34px); top:80px; z-index:16;
  font-size:.64rem; letter-spacing:.18em; text-transform:uppercase;
  color:rgba(218,215,209,.6);
}
#migas b{color:var(--papel); font-weight:500}

/* ---------- carga ---------- */
#carga{
  position:fixed; inset:0; z-index:60; background:var(--verde-noche);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  transition:opacity .7s ease;
}
#carga img{width:min(300px,68vw)}
#carga i{display:block; width:150px; height:1px; background:rgba(218,215,209,.2); position:relative; overflow:hidden}
#carga i::after{
  content:''; position:absolute; inset:0; background:var(--terracota);
  transform:scaleX(0); transform-origin:left; animation:barra 1.5s ease-in-out infinite;
}
@keyframes barra{0%{transform:scaleX(0)}50%{transform:scaleX(1)}100%{transform:scaleX(0);transform-origin:right}}
#carga.ida{opacity:0; pointer-events:none}

/* ============================================================
   Portada: el video de entrada y despues el loop
   Son DOS <video> apilados, no uno que cambia de src. El de entrada
   baja entre las nubes y termina en la aerea; el del loop es esa
   misma aerea con movimiento leve. El loop arranca a reproducirse
   medio segundo ANTES de que termine el otro y se funde encima: asi
   el empalme no tiene ni un parpadeo, y de paso disimula que los dos
   videos no vienen exactamente con el mismo encuadre.
   ============================================================ */
#portada{position:fixed; inset:0; z-index:30; background:var(--verde-noche)}
#portada.ida{opacity:0; pointer-events:none; transition:opacity .8s ease}
.capa-v{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; opacity:0; transition:opacity .55s ease;
}
.capa-v.activa{opacity:1}
/* ---------- hotspots sobre el loop ----------
   Van posicionados en coordenadas del VIDEO (1920x1080), no de la
   pantalla: como el video va con object-fit:cover, un porcentaje de
   pantalla no cae en el mismo lugar del cuadro segun la proporcion de
   la ventana. El contenedor replica ese mismo cover, asi el punto
   queda clavado donde tiene que estar en cualquier pantalla. */
#p-puntos{position:absolute; inset:0; pointer-events:none; overflow:hidden}
#p-lienzo{position:absolute; left:50%; top:50%; width:1920px; height:1080px;
  transform-origin:50% 50%}
.punto{
  position:absolute; transform:translate(-50%,-50%);
  pointer-events:auto; cursor:pointer;
  display:flex; align-items:center; gap:12px;
  opacity:0; transition:opacity .6s ease;
}
.punto.visible{opacity:1}
.punto .anillo{
  position:relative; width:46px; height:46px; flex:none;
  border-radius:50%; border:2px solid rgba(255,255,255,.95);
  background:rgba(56,81,60,.5); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  transition:background .25s ease, transform .25s ease;
}
.punto .anillo::before{
  content:''; position:absolute; inset:-8px; border-radius:50%;
  border:1px solid rgba(255,255,255,.5);
  animation:latir 2.4s ease-out infinite;
}
@keyframes latir{
  0%{transform:scale(.85); opacity:.9}
  70%{transform:scale(1.3); opacity:0}
  100%{opacity:0}
}
.punto .anillo i{
  font-style:normal; color:#fff; font-size:1.05rem; line-height:1;
  transform:translateY(-1px);
}
.punto .txt{
  font-size:.68rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; white-space:nowrap;
  padding:10px 18px; border:1px solid rgba(255,255,255,.4);
  background:rgba(18,26,18,.5); backdrop-filter:blur(6px);
  transition:background .25s ease, color .25s ease, border-color .25s ease;
}
.punto:hover .anillo{background:var(--papel); transform:scale(1.08)}
.punto:hover .anillo i{color:var(--verde)}
.punto:hover .txt{background:var(--papel); color:var(--verde); border-color:var(--papel)}
@media (max-width:820px){
  .punto .txt{font-size:.6rem; letter-spacing:.12em; padding:8px 12px}
  .punto .anillo{width:38px; height:38px}
}

/* ---------- viviendas clicables sobre la cenital ----------
   Cada una es un <path> con el contorno de su techo, sacado de la
   mascara que viene del render. Van en el mismo lienzo que los
   hotspots, asi comparten el encuadre del video. */
#p-svg{position:absolute; inset:0; width:1920px; height:1080px; overflow:visible}
.viv{
  fill:rgba(56,81,60,0); stroke:rgba(251,250,247,0); stroke-width:2.5;
  cursor:pointer; pointer-events:auto;
  transition:fill .22s ease, stroke .22s ease;
}
.viv:hover, .viv.activa{fill:rgba(143,174,147,.42); stroke:rgba(251,250,247,.95)}
/* el rotulo aparece con el hover, sobre la casa */
.viv-rot{
  position:absolute; transform:translate(-50%,-50%);
  pointer-events:none; opacity:0; transition:opacity .22s ease;
  font-size:22px; font-weight:600; letter-spacing:.12em; color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.7); white-space:nowrap;
}
.viv-rot.visible{opacity:1}

/* ---------- ficha de la vivienda ---------- */
#ficha{
  position:fixed; right:0; top:0; bottom:0; z-index:50;
  width:min(430px, 100%); background:var(--verde-osc);
  border-left:1px solid rgba(218,215,209,.16);
  transform:translateX(101%); transition:transform .42s var(--sal);
  display:flex; flex-direction:column;
}
#ficha.abierta{transform:none}
.fi-cab{padding:26px 30px 20px; border-bottom:1px solid rgba(218,215,209,.14); position:relative; flex:none}
.fi-x{position:absolute; right:14px; top:14px; width:40px; height:40px; font-size:1.5rem; line-height:1; color:var(--arena)}
.fi-x:hover{color:#fff}
.fi-cod{font-family:var(--serif); font-size:2.1rem; line-height:1; color:#fff; margin:0}
.fi-tipo{margin:8px 0 0; font-size:.94rem; color:var(--salvia)}
.fi-estado{display:inline-flex; align-items:center; gap:8px; margin-top:15px;
  padding:6px 14px; font-size:.64rem; letter-spacing:.16em; text-transform:uppercase;
  background:rgba(218,215,209,.1); color:var(--arena)}
.fi-estado i{width:8px; height:8px; border-radius:50%; background:#8FAE93; display:block}

/* menu de secciones */
.fi-menu{display:flex; gap:1px; flex:none; background:rgba(218,215,209,.14)}
.fi-menu button{
  flex:1; padding:13px 6px; background:var(--verde-osc);
  font-size:.6rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--salvia); transition:color .2s ease, background .2s ease;
}
.fi-menu button:hover{color:var(--arena)}
.fi-menu button.on{background:var(--verde); color:#fff}

.fi-cuerpo{flex:1; overflow-y:auto; padding:24px 30px 30px}
.fi-hoja{display:none}
.fi-hoja.on{display:block}
.fi-plano{background:var(--papel); padding:10px}
.fi-plano img{width:100%; height:auto; display:block}
.fi-lista{list-style:none; margin:0 0 20px; padding:0; border-top:1px solid rgba(218,215,209,.14)}
.fi-lista li{display:flex; justify-content:space-between; gap:16px; padding:11px 0;
  border-bottom:1px solid rgba(218,215,209,.1); font-size:.94rem}
.fi-lista li span:first-child{color:var(--salvia); font-size:.85rem}
.fi-lista li span:last-child{color:#fff; font-weight:500}
.fi-lista li.fuerte span:last-child{font-family:var(--serif); font-weight:400; font-size:1.2rem}
.fi-txt{font-size:.93rem; color:rgba(218,215,209,.84); margin:0 0 20px}
.fi-btn{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  padding:15px 18px; margin-bottom:10px; text-decoration:none;
  font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; font-weight:500;
  background:var(--verde); border:1px solid var(--verde); color:#fff;
  transition:background .25s ease, transform .2s ease;
}
.fi-btn:hover{background:#44634a; transform:translateY(-1px)}
.fi-btn.hueco{background:transparent; border-color:rgba(218,215,209,.34)}
.fi-btn.hueco:hover{background:rgba(218,215,209,.08)}
.fi-galeria{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.fi-galeria img{width:100%; aspect-ratio:4/3; object-fit:cover}
.fi-vacio{font-size:.86rem; color:var(--salvia); padding:22px; text-align:center;
  border:1px dashed rgba(218,215,209,.22)}
.fi-nota{font-size:.74rem; color:var(--salvia); margin:16px 0 0}
@media (max-width:820px){
  #ficha{left:0; right:0; top:auto; height:84vh; width:100%;
         border-left:0; border-top:1px solid rgba(218,215,209,.16);
         transform:translateY(101%)}
  #ficha.abierta{transform:none}
}
/* Nada de velo encima del video: se ve tal cual, sin apagar. El boton
   se sostiene solo, con su fondo y su sombra. */
#p-centro{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:22px; text-align:center;
  padding:0 24px;
  opacity:0; transform:translateY(12px);
  transition:opacity .7s ease, transform .7s var(--sal);
  /* OJO: sin esto el bloque sigue recibiendo clicks estando invisible,
     y como ocupa la pantalla entera, tocar el medio del video disparaba
     el boton oculto y saltaba de escena sin que se viera nada. */
  pointer-events:none;
}
#p-centro.visible{opacity:1; transform:none; pointer-events:auto}
#p-volanta{
  font-size:.68rem; font-weight:500; letter-spacing:.24em; text-transform:uppercase;
  color:rgba(255,255,255,.85); margin:0; text-shadow:0 1px 12px rgba(0,0,0,.7);
}
#p-entrar{
  display:inline-flex; align-items:center; gap:13px;
  padding:19px 44px;
  font-size:.76rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
  color:#fff; background:rgba(56,81,60,.82);
  border:1px solid rgba(218,215,209,.55);
  backdrop-filter:blur(8px);
  box-shadow:0 10px 40px rgba(0,0,0,.35);
  transition:background .28s ease, border-color .28s ease, color .28s ease, transform .28s ease;
}
#p-entrar:hover{background:var(--papel); border-color:var(--papel); color:var(--verde); transform:translateY(-2px)}
#p-entrar i{font-style:normal; opacity:.75; transition:transform .25s ease}
#p-entrar:hover i{transform:translateX(4px)}
#p-saltar{
  position:absolute; right:clamp(16px,3vw,34px); bottom:clamp(22px,4vh,34px); z-index:2;
  font-size:.64rem; letter-spacing:.2em; text-transform:uppercase;
  color:rgba(255,255,255,.7); padding:10px 16px;
  border:1px solid rgba(255,255,255,.28);
  transition:opacity .4s ease, color .25s ease, border-color .25s ease;
}
#p-saltar:hover{color:#fff; border-color:#fff}
#p-saltar.ida{opacity:0; pointer-events:none}

@media (max-width:820px){
  #texto{bottom:auto; top:130px; left:clamp(16px,4vw,24px); right:clamp(16px,4vw,24px); max-width:none}
  #botones{flex-direction:column; align-items:stretch}
  .paso{justify-content:center; padding:15px 20px}
  #velo{background:linear-gradient(180deg, rgba(18,26,18,.72) 0%, rgba(18,26,18,.34) 42%, rgba(18,26,18,.86) 100%)}
}
@media (prefers-reduced-motion:reduce){
  #vistas img{transition:opacity .3s ease}
  #vistas img.entra{transform:none}
}
</style>
</head>
<body>

<div id="vistas">
  <img id="capa-a" alt="">
  <img id="capa-b" alt="">
</div>
<div id="velo"></div>

<div id="barra">
  <a class="marca" href="la-costa-park.html" aria-label="La Costa Park">
    <img src="img/lcp-lockup-blanco.svg" alt="La Costa Park">
  </a>
  <div class="sep"></div>
  <button class="chip" type="button" id="atras" hidden>&larr; Atr&aacute;s</button>
  <a class="chip" href="la-costa-park.html">Salir</a>
</div>

<div id="migas"></div>

<div id="texto">
  <p id="eyebrow"></p>
  <h1 id="titulo"></h1>
  <p id="bajada"></p>
</div>

<div id="botones"></div>

<div id="portada">
  <!-- dos capas de video que se van turnando: siempre hay una a la
       vista mientras la otra carga lo que sigue -->
  <video class="capa-v" id="vid0" muted playsinline preload="auto" poster="img/interactivo/aerea-poster.jpg" aria-hidden="true"></video>
  <video class="capa-v" id="vid1" muted playsinline preload="auto" aria-hidden="true"></video>
  <!-- sobre el loop de cada etapa: aca van a colgar los hotspots y las
       viviendas clicables cuando lleguen -->
  <div id="p-puntos">
    <div id="p-lienzo">
      <svg id="p-svg" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
    </div>
  </div>
  <div id="p-centro">
    <p id="p-volanta"></p>
    <button id="p-entrar" type="button"></button>
  </div>
  <button id="p-saltar" type="button">Saltar</button>
</div>

<aside id="ficha" aria-hidden="true">
  <div class="fi-cab">
    <button class="fi-x" type="button" id="fi-x" aria-label="Cerrar">&times;</button>
    <p class="fi-cod" id="fi-cod">&mdash;</p>
    <p class="fi-tipo" id="fi-tipo"></p>
    <span class="fi-estado" id="fi-estado"><i></i><b></b></span>
  </div>
  <div class="fi-menu" id="fi-menu"></div>
  <div class="fi-cuerpo" id="fi-cuerpo"></div>
</aside>

<div id="carga">
  <img src="img/lcp-lockup-hero.svg" alt="La Costa Park">
  <i></i>
</div>

<script>
/* ============================================================
   EL RECORRIDO

   Cada entrada es una pantalla. Para sumar una vista nueva:
     1. poner el render en img/interactivo/
     2. agregar una entrada aca
     3. agregarla como boton en la escena de la que se llega
   No hay que tocar nada mas.

   Campos:
     img      el render (obligatorio)
     eyebrow  la volanta chica de arriba
     titulo   el titulo grande
     bajada   una linea de contexto (opcional)
     miga     como se llama en el rastro de arriba a la izquierda
     botones  [{ txt, va, principal }]  txt = lo que dice el boton,
              va = id de la escena destino, principal = el verde
     link     en vez de ir a otra escena, abre una URL: { txt, url }

   OJO: las imagenes de las escenas a las que se puede saltar desde
   la actual se van precargando solas, para que la transicion no
   tenga que esperar la descarga.

   Las de abajo son de prueba, con los renders que ya estan en el
   sitio. Cuando lleguen los definitivos se reemplazan las rutas.
   ============================================================ */
var ESCENAS = {

  acceso: {
    img: 'img/acceso.jpg',
    eyebrow: 'El acceso',
    titulo: 'Entrada por<br>calle Libertad',
    bajada: 'Predio cerrado, con seguridad y un solo ingreso.',
    miga: 'Acceso',
    botones: [

var elMigas  = document.getElementById('migas');

/* las imagenes ya pedidas, para no volver a pedirlas */
var pedidas = {};
function precargar(id){
  var e = ESCENAS[id];
  if (!e || pedidas[e.img]) return;
  pedidas[e.img] = true;
  var i = new Image();
  i.src = e.img;
}
function precargarVecinas(id){
  var e = ESCENAS[id];
  if (!e || !e.botones) return;
  e.botones.forEach(function(b){ if (b.va) precargar(b.va); });
}

function pintarTexto(e){
  elEye.innerHTML = e.eyebrow || '';
  elEye.style.display = e.eyebrow ? '' : 'none';
  elTit.innerHTML = e.titulo || '';
  elBaj.innerHTML = e.bajada || '';
  elBaj.style.display = e.bajada ? '' : 'none';

  elBotones.innerHTML = '';
  (e.botones || []).forEach(function(b){
    var el;
    if (b.link){
      el = document.createElement('a');
      el.href = b.link;
    } else {
      el = document.createElement('button');
      el.type = 'button';
      el.addEventListener('click', function(){ ir(b.va); });
    }
    el.className = 'paso' + (b.principal ? ' principal' : '');
    el.innerHTML = b.txt + ' <i>&rarr;</i>';
    elBotones.appendChild(el);
  });

  elMigas.innerHTML = rastro.concat([actual])
    .map(function(id, i, todo){
      var n = (ESCENAS[id] && ESCENAS[id].miga) || id;
      return (i === todo.length - 1) ? '<b>' + n + '</b>' : n;
    })
    .join(' &nbsp;/&nbsp; ');

  elAtras.hidden = rastro.length === 0;
}

function ir(id, volviendo){
  var e = ESCENAS[id];
  if (!e || enCurso || id === actual) return;
  enCurso = true;

  if (actual && !volviendo) rastro.push(actual);

  /* el texto se va primero: aparecer sobre la imagen a medio fundir
     queda sucio */
  elTexto.classList.add('oculto');
  elBotones.classList.add('oculto');

  var entra = capas[1 - arriba];
  entra.classList.remove('activa');
  entra.classList.add('entra');
  entra.src = e.img;
  entra.alt = (e.titulo || '').replace(/<[^>]+>/g, ' ');

  var listo = entra.decode ? entra.decode().catch(function(){}) :
              new Promise(function(r){ entra.onload = r; entra.onerror = r; });

  listo.then(function(){
    /* dos cuadros de gracia para que el navegador aplique el estado
       inicial antes de animar: si no, el scale no transiciona */
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      entra.classList.add('activa');
      entra.classList.remove('entra');
      capas[arriba].classList.remove('activa');
      arriba = 1 - arriba;
      actual = id;

      setTimeout(function(){
        pintarTexto(e);
        elTexto.classList.remove('oculto');
        elBotones.classList.remove('oculto');
        enCurso = false;
        precargarVecinas(id);
      }, 380);
    }); });
  });
}

elAtras.addEventListener('click', function(){
  if (!rastro.length) return;
  ir(rastro.pop(), true);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && rastro.length) ir(rastro.pop(), true);
});

/* ============================================================
   ETAPAS DE VIDEO

   Cada etapa son dos videos: uno que se reproduce una sola vez y
   otro que queda en loop cuando el primero termina. Sobre el loop
   aparece el boton que lleva a lo que sigue.

   El truco del empalme: el loop arranca medio segundo ANTES de que
   termine el video de entrada y se funde encima. Cortar seco al
   'ended' se ve, porque el ultimo cuadro se congela un instante
   mientras el otro arranca.

   Hay DOS elementos <video> que se van turnando: el que esta oculto
   carga lo que sigue mientras el otro se ve. Con eso alcanza para
   encadenar cuantas etapas haga falta.

   Para agregar una etapa: una entrada mas en ETAPAS. Si termina en
   otra etapa se usa 'va'; si termina pasando al recorrido de

function ocultarCarga(){
  var c = document.getElementById('carga');

  setTimeout(function(){ c.style.display = 'none'; }, 800);

/* pone un video en la capa que esta libre, espera a que pueda
   reproducirse y lo funde encima de la otra */
function reproducir(src, enBucle){
  var i = (aLaVista === 0) ? 1 : 0;
  var v = vids[i];
  var previo = (aLaVista >= 0) ? vids[aLaVista] : null;

  v.loop = !!enBucle;
  v.src = src;
  v.load();

  return new Promise(function(listo){
    var arranco = false;
    function andando(){
      if (arranco) return;
      arranco = true;
      var p = v.play();
      if (p && p.catch) p.catch(function(){});
      v.classList.add('activa');
      aLaVista = i;
      if (previo){
        setTimeout(function(){ previo.classList.remove('activa'); previo.pause(); }, 620);
      }
      listo(v);
    }
    v.addEventListener('canplay', andando, { once:true });
    v.addEventListener('error', andando, { once:true });
    /* red lenta: no dejar la pantalla colgada esperando */
    setTimeout(andando, 8000);
  });
}

/* llama a fn cuando al video le falten 'seg' segundos */
function alFaltar(v, seg, fn){
  var disparado = false;
  function ver(){
    if (disparado) return;
    if (v.duration && v.duration - v.currentTime < seg){ disparado = true; fn(); }
  }
  v.addEventListener('timeupdate', ver);
  v.addEventListener('ended', function(){ if (!disparado){ disparado = true; fn(); } });
  return function(){ if (!disparado){ disparado = true; fn(); } };  // para el boton Saltar
}

/* ---------- hotspots sobre el loop ----------
   El lienzo se escala igual que el object-fit:cover del video, asi un
   punto dado en coordenadas del cuadro cae siempre en el mismo lugar
   de la imagen, sea cual sea la proporcion de la ventana. */
var pLienzo = document.getElementById('p-lienzo');

function encuadrarLienzo(){
  var w = window.innerWidth, h = window.innerHeight;
  var k = Math.max(w / 1920, h / 1080);       // lo mismo que hace cover
  pLienzo.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
}
window.addEventListener('resize', encuadrarLienzo);
encuadrarLienzo();

function pintarPuntos(e){
  /* selectivo y no innerHTML: adentro del lienzo tambien vive el SVG
     de las viviendas */
  pLienzo.querySelectorAll('.punto').forEach(function(el){ el.remove(); });
  if (!e.puntos) return;
  e.puntos.forEach(function(p){
    var el = document.createElement('a');
    el.className = 'punto';
    el.href = p.url;
    el.style.left = p.x + 'px';
    el.style.top  = p.y + 'px';
    el.innerHTML = '<span class="anillo"><i>' + (p.icono || '&#43;') + '</i></span>' +
                   '<span class="txt">' + p.txt + '</span>';
    pLienzo.appendChild(el);
  });
  /* aparecen despues del fundido al loop, no encima del video que entra */
  setTimeout(function(){
    pLienzo.querySelectorAll('.punto').forEach(function(el){ el.classList.add('visible'); });
  }, 260);
}
/* ---------- viviendas clicables ----------
   Cada una es un path con el contorno de su techo. El rotulo con el
   codigo aparece solo con el hover: fijo, 28 codigos encima de la
   cenital taparian el render. */
var pSvg = document.getElementById('p-svg');

function pintarViviendas(e){
  pSvg.innerHTML = '';
  pLienzo.querySelectorAll('.viv-rot').forEach(function(el){ el.remove(); });
  if (!e.viviendas) return;
  var SVGNS = 'http://www.w3.org/2000/svg';

  e.viviendas.forEach(function(v){
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', v.d);
    p.setAttribute('class', 'viv');
    p.setAttribute('tabindex', '0');
    p.setAttribute('role', 'button');
    var t = document.createElementNS(SVGNS, 'title');
    t.textContent = 'Vivienda ' + v.id;
    p.appendChild(t);
    pSvg.appendChild(p);

    /* el centro del contorno, para colgar el rotulo */
    var caja = p.getBBox();
    var rot = document.createElement('div');
    rot.className = 'viv-rot';
    rot.style.left = (caja.x + caja.width / 2) + 'px';
    rot.style.top  = (caja.y + caja.height / 2) + 'px';
    rot.textContent = v.id;
    pLienzo.appendChild(rot);

    function entra(){ rot.classList.add('visible'); }
    function sale(){ if (!p.classList.contains('activa')) rot.classList.remove('visible'); }
    p.addEventListener('mouseenter', entra);
    p.addEventListener('mouseleave', sale);
    p.addEventListener('focus', entra);
    p.addEventListener('blur', sale);
    p.addEventListener('click', function(){ abrirFicha(v, p, rot); });
    p.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abrirFicha(v, p, rot); }
    });
  });
}

function limpiarPuntos(){
  pLienzo.querySelectorAll('.punto, .viv-rot').forEach(function(el){ el.remove(); });
  pSvg.innerHTML = '';
}

/* ============================================================
   Ficha de la vivienda
   Se abre al tocar una casa: la planta, las imagenes, el tour y los
   datos comerciales, cada uno en su hoja. Mismo criterio que el
   showroom de KIU, con las secciones que pidio Rodrigo.
   ============================================================ */
var ficha   = document.getElementById('ficha');
var fiMenu  = document.getElementById('fi-menu');
var fiCuerpo= document.getElementById('fi-cuerpo');
var vivSel  = null, rotSel = null;

var HOJAS = [
  { id:'planta', txt:'Planta' },
  { id:'imagenes', txt:'Im&aacute;genes' },
  { id:'tour', txt:'Tour virtual' },
  { id:'datos', txt:'Precio' }
];

function hojaHTML(id, v, t){
  if (id === 'planta'){
    return t.planta
      ? '<div class="fi-plano"><img src="' + t.planta + '" alt="Planta ' + v.tipo + '"></div>' +
        '<p class="fi-nota">Planta del proyecto ejecutivo. Equipamiento ilustrativo.</p>'
      : '<div class="fi-vacio">La planta de esta tipolog&iacute;a todav&iacute;a no est&aacute; cargada.</div>';
  }
  if (id === 'imagenes'){
    if (!t.galeria || !t.galeria.length){
      return '<div class="fi-vacio">Todav&iacute;a no hay im&aacute;genes de esta tipolog&iacute;a.</div>';
    }
    return '<div class="fi-galeria">' +
      t.galeria.map(function(g){ return '<img src="' + g + '" alt="' + v.tipo + '" loading="lazy">'; }).join('') +
      '</div>';
  }
  if (id === 'tour'){
    /* solo el interior: estando dentro de la ficha de una unidad, un
       boton a la calle saca al que estaba mirando la vivienda */
    return t.tour
      ? '<p class="fi-txt">' + (t.tourTxt ||
          'Recorr&eacute; esta vivienda en 360&deg;.') + '</p>' +
        '<a class="fi-btn" href="' + t.tour + '">Abrir el tour 360&deg;</a>'
      : '<div class="fi-vacio">El tour de esta vivienda todav&iacute;a no est&aacute; disponible.</div>';
  }
  /* datos */
  var est = ESTADOS[v.id] || 'libre';
  return '<ul class="fi-lista">' +
    '<li><span>Superficie</span><span>' + t.m2 + '</span></li>' +
    '<li><span>Dormitorios</span><span>' + t.dorm + '</span></li>' +
    '<li><span>Ba&ntilde;os</span><span>' + t.banos + '</span></li>' +
    '<li><span>Plantas</span><span>' + t.plantas + '</span></li>' +
    '<li><span>Cochera</span><span>' + t.cocheras + '</span></li>' +
    '<li><span>Disponibilidad</span><span>' + NOMBRE_ESTADO[est] + '</span></li>' +
    '<li class="fuerte"><span>Precio</span><span>' + t.precio + '</span></li>' +
    '</ul>' +
    '<p class="fi-txt">' + t.ambientes + '</p>' +
    '<a class="fi-btn" href="https://wa.me/' + TEL + '?text=' +
      encodeURIComponent('Hola, quiero informacion sobre la vivienda ' + v.id +
                         ' (tipologia ' + v.tipo + ') de La Costa Park.') +
      '" target="_blank" rel="noopener">Consultar por esta casa</a>' +
    '<a class="fi-btn hueco" href="la-costa-park.html#contacto">Pedir m&aacute;s informaci&oacute;n</a>';
}

function abrirFicha(v, path, rot){
  var t = TIPOS[v.tipo];
  if (!t) return;

  pSvg.querySelectorAll('.viv.activa').forEach(function(el){ el.classList.remove('activa'); });
  pLienzo.querySelectorAll('.viv-rot.visible').forEach(function(el){ el.classList.remove('visible'); });
  path.classList.add('activa');
  rot.classList.add('visible');
  vivSel = path; rotSel = rot;

  document.getElementById('fi-cod').textContent = v.id;
  document.getElementById('fi-tipo').innerHTML = v.tipo + ' &middot; ' + t.nombre;
  var est = ESTADOS[v.id] || 'libre';
  var e = document.getElementById('fi-estado');
  e.querySelector('i').style.background = COLOR_ESTADO[est];
  e.querySelector('b').textContent = NOMBRE_ESTADO[est];

  fiMenu.innerHTML = '';
  fiCuerpo.innerHTML = '';
  HOJAS.forEach(function(h, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = h.txt;
    b.className = (i === 0 ? 'on' : '');
    b.addEventListener('click', function(){
      fiMenu.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      fiCuerpo.querySelectorAll('.fi-hoja').forEach(function(x){ x.classList.remove('on'); });
      fiCuerpo.querySelector('[data-hoja="' + h.id + '"]').classList.add('on');
      fiCuerpo.scrollTop = 0;
    });
    fiMenu.appendChild(b);

    var d = document.createElement('div');
    d.className = 'fi-hoja' + (i === 0 ? ' on' : '');
    d.setAttribute('data-hoja', h.id);
    d.innerHTML = hojaHTML(h.id, v, t);
    fiCuerpo.appendChild(d);
  });

  ficha.classList.add('abierta');
  ficha.setAttribute('aria-hidden', 'false');
}

function cerrarFicha(){
  ficha.classList.remove('abierta');
  ficha.setAttribute('aria-hidden', 'true');

}

function mostrarCentro(e){
  /* ya estamos en el loop: el boton de saltar no tiene mas sentido */
  pSaltar.classList.add('ida');
  /* una etapa sin boton deja el loop limpio (la ultima, donde van las
     tipologias clicables) */
  if (!e.boton){ pCentro.classList.remove('visible'); return; }
  pVolanta.innerHTML = e.volanta || '';
  pVolanta.style.display = e.volanta ? '' : 'none';
  pEntrar.innerHTML = e.boton + ' <i>&rarr;</i>';
  pCentro.classList.add('visible');
}
function ocultarCentro(){
  pCentro.classList.remove('visible');
  pSaltar.classList.remove('ida');
}

var saltar = function(){};
pSaltar.addEventListener('click', function(){ saltar(); });

function alLoopDe(e){
  document.body.classList.remove('en-portada');
  ocultarCarga();
  mostrarCentro(e);
  pintarPuntos(e);
  pintarViviendas(e);
  /* recien ahora se baja lo que sigue: antes le competia el ancho de
     banda al video que se estaba viendo */
  if (e.va) precargarVideo(ETAPAS[e.va].intro);
  else if (e.vaEscena) prepararPrimera();
}

/* 'directo' saltea el video de entrada y arranca en el loop. Lo usa el
   visor 360 al volver: el que ya vio la bajada no tiene por que
   verla de nuevo cada vez que sale del panorama. */
function correrEtapa(id, directo){
  var e = ETAPAS[id];
  if (!e) return;
  etapaAct = id;
  enLoop = false;
  ocultarCentro();
  limpiarPuntos();
  cerrarFicha();
  /* mientras corre el video de entrada la barra estorba; vuelve en
     cuanto arranca el loop, si no en la ultima etapa no habria salida */
  document.body.classList.add('en-portada');

  if (directo){
    enLoop = true;
    reproducir(e.loop, true).then(function(){ alLoopDe(e); });
    return;
  }

  reproducir(e.intro, false).then(function(v){
    ocultarCarga();
    saltar = alFaltar(v, 0.5, function(){
      if (enLoop) return;
      enLoop = true;
      reproducir(e.loop, true).then(function(){ alLoopDe(e); });
    });
  });
}

var yaPedidos = {};
function precargarVideo(src){
  if (yaPedidos[src]) return;
  yaPedidos[src] = true;
  var x = new XMLHttpRequest();
  x.open('GET', src, true);
  x.responseType = 'blob';
  x.send();
}

pEntrar.addEventListener('click', function(){
  var e = ETAPAS[etapaAct];
  if (!e) return;
  if (e.va){ correrEtapa(e.va); return; }

  /* ultima etapa: se apaga la portada y queda el recorrido de imagenes */
  prepararPrimera();
  portada.classList.add('ida');
  document.body.classList.remove('en-portada');
  setTimeout(function(){
    portada.style.display = 'none';
    vids.forEach(function(v){ v.pause(); v.removeAttribute('src'); v.load(); });
  }, 900);
});

/* la primera escena se deja lista DEBAJO de la portada, asi cuando se
   toca el boton ya esta puesta y el fundido no espera */
var primeraLista = false;
function prepararPrimera(){
  if (primeraLista) return;
  primeraLista = true;
  var e = ESCENAS[INICIO];
  var primera = capas[0];
  primera.src = e.img;
  var listo = primera.decode ? primera.decode().catch(function(){}) :
              new Promise(function(r){ primera.onload = r; primera.onerror = r; });
  listo.then(function(){
    primera.classList.add('activa');
    actual = INICIO;
    pintarTexto(e);
    precargarVecinas(INICIO);
  });
}

/* ?etapa=barrio arranca en esa etapa; con &directo=1 va derecho al
   loop, sin el video de entrada (asi vuelve el que sale del 360) */
var pedida = (location.search.match(/[?&]etapa=([a-z0-9_-]+)/i) || [])[1];
var directo = /[?&]directo=1/.test(location.search);
correrEtapa(ETAPAS[pedida] ? pedida : ETAPA_INICIAL, directo && ETAPAS[pedida]);
</script>
