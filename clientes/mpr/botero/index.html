<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Botero &mdash; Recorrido virtual | Imabox</title>
<meta name="robots" content="noindex, nofollow">
<link rel="shortcut icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/oov2wcw.css">
<style>
/* Estetica tomada de styles/index.css del sitio: acento eucalipto,
   aktiv-grotesk en versalitas con mucho tracking para toda la UI,
   Poppins liviana para la marca, y botones rectos (nada redondeado). */
:root{
  --euca:#9dbba4;
  --euca-dim:rgba(157,187,164,.12);
  --euca-bord:rgba(157,187,164,.3);
  --ui:'aktiv-grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --marca:'Poppins', sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0b;color:#fff;font-family:var(--ui)}
#c{width:100%;height:100%;display:block;touch-action:none;outline:none}
.ui{position:fixed;z-index:10;user-select:none}
/* los panoramas van de una pared quemada de sol a un rincon oscuro:
   sin estos velos la UI blanca desaparece en la mitad de las vistas */
.velo{position:fixed;left:0;right:0;z-index:5;pointer-events:none}
.velo.arriba{top:0;height:150px;background:linear-gradient(180deg,rgba(11,11,11,.5),rgba(11,11,11,0))}
.velo.abajo{bottom:0;height:190px;background:linear-gradient(0deg,rgba(11,11,11,.5),rgba(11,11,11,0))}

/* marca */
#marca{left:30px;top:24px;font-family:var(--marca);font-weight:300;font-size:1.55rem;
  line-height:1;letter-spacing:-.01em;color:#fff;text-decoration:none;
  text-shadow:0 1px 12px rgba(0,0,0,.45);transition:color .25s ease}
#marca:hover{color:var(--euca)}
#proyecto{right:30px;top:30px;font-size:.58rem;letter-spacing:.25em;text-transform:uppercase;
  color:rgba(255,255,255,.55);text-shadow:0 1px 10px rgba(0,0,0,.5);text-align:right}
#proyecto b{display:block;color:#fff;font-weight:400;letter-spacing:.22em;margin-bottom:5px}

/* puntos */
#puntos{left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:1px}
#puntos button{
  padding:13px 26px;border:1px solid rgba(255,255,255,.28);border-right-width:0;
  background:rgba(0,0,0,.32);color:rgba(255,255,255,.65);
  font-family:var(--ui);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
  cursor:pointer;backdrop-filter:blur(8px);
  transition:border-color .25s ease,color .25s ease,background .25s ease}
#puntos button:last-child{border-right-width:1px}
#puntos button:hover{color:#fff;border-color:rgba(255,255,255,.5)}
#puntos button.on{background:var(--euca);border-color:var(--euca);color:#000}

/* sensor: aparece solo en aparatos con giroscopio */
#sensor{left:50%;bottom:88px;transform:translateX(-50%);display:none;align-items:center;gap:9px;
  padding:11px 22px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.32);
  color:rgba(255,255,255,.65);font-family:var(--ui);font-size:.58rem;letter-spacing:.22em;
  text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px);
  transition:color .3s ease,border-color .3s ease,background .3s ease}
#sensor.visible{display:flex}
#sensor::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;
  opacity:.45;transition:opacity .3s ease,box-shadow .3s ease}
#sensor.on{border-color:var(--euca-bord);background:var(--euca-dim);color:var(--euca)}
#sensor.on::before{opacity:1;box-shadow:0 0 8px var(--euca)}

/* controles de la tele: van abajo a la izquierda porque abajo a la
   derecha ahora esta el plano */
#tvui{left:30px;bottom:34px;display:none;gap:1px}
#tvui button{padding:13px 22px;border:1px solid rgba(255,255,255,.28);border-right-width:0;
  background:rgba(0,0,0,.32);color:rgba(255,255,255,.65);font-family:var(--ui);
  font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;
  backdrop-filter:blur(8px);transition:color .25s ease,border-color .25s ease}
#tvui button:last-child{border-right-width:1px}
#tvui button:hover{color:#fff;border-color:rgba(255,255,255,.5)}

/* plano abajo a la derecha. El ancho se anima; el alto sale solo de la
   proporcion de la imagen (1700x879), asi el SVG de encima calza
   siempre con el dibujo sin importar el tamano. */
#mapa{right:30px;bottom:34px;width:250px;cursor:pointer;
  border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.32);
  backdrop-filter:blur(8px);padding:6px;
  transition:width .45s cubic-bezier(.22,.61,.36,1),border-color .25s ease}
#mapa:hover{border-color:rgba(255,255,255,.5)}
#mapa.grande{width:min(58vw,880px)}
#mapa .lienzo{position:relative;width:100%;line-height:0}
#mapa img{width:100%;height:auto;display:block;opacity:.9}
#mapa svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#mapa .punto{cursor:pointer}
#mapa .punto circle{fill:rgba(11,11,11,.6);stroke:#9dbba4;stroke-width:10}
#mapa .punto.aqui circle{fill:#9dbba4;stroke:#9dbba4}
#mapa .punto text{fill:#9dbba4;font-family:var(--ui);font-size:76px;
  font-weight:500;letter-spacing:.06em;text-anchor:middle;dominant-baseline:central}
#mapa .punto.aqui text{fill:#0b0b0b}
#mapa .rotulo{position:absolute;left:10px;top:8px;z-index:2;
  font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.75);text-shadow:0 1px 6px rgba(0,0,0,.8);
  pointer-events:none}

/* preloader: la linea de acento del index, cargando de izquierda a derecha */
#carga{position:fixed;inset:0;z-index:20;background:#0b0b0b;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .6s ease}
#carga span{font-family:var(--marca);font-weight:300;font-size:1.7rem;letter-spacing:-.01em}
#carga i{display:block;width:150px;height:1px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
#carga i::after{content:'';position:absolute;inset:0;background:var(--euca);
  transform:scaleX(0);transform-origin:left;animation:barra 1.5s ease-in-out infinite}
@keyframes barra{0%{transform:scaleX(0)}50%{transform:scaleX(1)}100%{transform:scaleX(0);transform-origin:right}}
#carga.off{opacity:0;pointer-events:none}

@media (max-width:640px){
  #marca{left:20px;top:18px;font-size:1.3rem}
  #proyecto{right:20px;top:22px;font-size:.52rem}
  #puntos button{padding:12px 18px;font-size:.58rem;letter-spacing:.18em}
  #tvui{left:50%;transform:translateX(-50%);bottom:88px}
  #sensor{bottom:142px}
  #mapa{width:145px;right:16px;bottom:88px;padding:4px}
  #mapa.grande{width:calc(100vw - 32px)}
  #mapa .rotulo{display:none}
}
</style>
</head>
<body>

<canvas id="c" touch-action="none"></canvas>

<div class="velo arriba"></div>
<div class="velo abajo"></div>

<a class="ui" id="marca" href="https://imabox.uy" target="_blank" rel="noopener">imabox.</a>

<div class="ui" id="proyecto">
  <b>Botero</b>
  Recorrido virtual
</div>

<div class="ui" id="puntos"></div>
<button class="ui" id="sensor" type="button">Sensor</button>

<div class="ui" id="tvui">
  <button id="btn-pausa">Pausar</button>
  <button id="btn-apagar">Apagar</button>
</div>

<div class="ui" id="mapa">
  <div class="rotulo">Planta</div>
  <div class="lienzo">
    <img src="assets/plano.jpg" alt="Planta de la vivienda">
    <svg id="mapa-svg" viewBox="0 0 2848 1472">
      <defs>
        <radialGradient id="haz">
          <stop offset="0%"   stop-color="#9dbba4" stop-opacity=".75"/>
          <stop offset="65%"  stop-color="#9dbba4" stop-opacity=".34"/>
          <stop offset="100%" stop-color="#9dbba4" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path id="mapa-cono" fill="url(#haz)"></path>
      <g id="mapa-puntos"></g>
    </svg>
  </div>
</div>

<div id="carga"><span>imabox.</span><i></i></div>

<script src="./lib/babylon.js"></script>
<script>
/* ============================================================
   Botero - prueba de recorrido con 3 panoramas
   Todo esta en el espacio del modelo (metros): las camaras y la
   pantalla de la tele salen tal cual del .glb exportado del Max,
   asi que el plano del video calza solo, sin acomodarlo a ojo.
   ============================================================ */

/* --- datos que vienen del .glb ---
   glTF es right-handed y Babylon left-handed: si se copian las
   coordenadas tal cual, la escena entera queda espejada. La
   conversion es negar la X, y por eso el shader del panorama usa
   +atan2 donde la comprobacion contra las imagenes daba -atan2. */
function delModelo(x, y, z){ return new BABYLON.Vector3(-x, y, z); }

var PUNTOS = [
  { n:'01', pano:'assets/pano1', p:delModelo(-165.092041, 9.466323, -446.990000) },
  { n:'02', pano:'assets/pano2', p:delModelo(-166.145172, 9.466323, -448.673248),
    luz:'assets/pano2-luz' },
  { n:'03', pano:'assets/pano3', p:delModelo(-165.712753, 9.466323, -451.357574) }
];

/* El punto 02 tiene dos versiones renderizadas, con las lamparas del
   comedor apagadas y prendidas. Un interruptor flotante alterna entre
   las dos con un fundido, sin moverse del lugar. */
var PUNTO_LUZ = 1;
var luzOn = false;

/* pantalla_tv: plana en x=-167.097, 1.026 m de ancho (sobre Z) x 0.725 de alto */
var TV = {
  centro: delModelo(-167.097, 8.944, -450.341),
  ancho: 1.026,
  alto: 0.725
};

var RADIO = 8;           // radio de la esfera del panorama, en metros
var ALTURA_OJOS = 1.65;  // para apoyar los discos de navegacion en el piso
var PISO_Y = PUNTOS[0].p.y - ALTURA_OJOS;

/* --- el rayo de sol, medido sobre el panorama 03 ---
   Direccion al sol: se leyo la posicion del disco en el equirect
   (u=0.0792, v=0.3433) y se paso a vector con la misma convencion del
   shader. Da 28 grados de elevacion, que es lo que corresponde a las
   sombras largas del render. Comprobacion: el horizonte del mar cae
   exactamente en v=0.5, o sea a la altura de los ojos.
   Donde pega: se leyo la mancha de luz sobre el piso (u=0.643, v=0.80)
   y se cruzo ese rayo con el plano del piso. Queda cerca de la pared
   de la tele, que es justo donde el render tiene la sombra de la planta.
   Con esos dos datos el haz queda definido sin inventar nada: es el
   segmento que sale de la mancha del piso y sube hacia el sol. */
var SOL = new BABYLON.Vector3(-0.421, 0.4725, -0.774);

var RAYO = {
  piso: new BABYLON.Vector3(166.651, PISO_Y, -450.611),
  largo: 5.8,        // hasta el techo, sobre la direccion del sol
  radio: 0.9,        // mas ancho que esto y deja de leerse como haz
  ensancha: 0.5,     // un poco mas abierto arriba que abajo
  cantidad: 520,     // muchas y chicas, no pocas y grandes
  vida: [14, 26],    // segundos
  tam: [0.004, 0.016],
  caida: 0.022,      // m/s: el polvo cae MUY lento o parece nieve
  /* el brillo bajo no es timidez: con blending aditivo una mota tenue
     desaparece sola contra el cielo quemado y se lee contra el interior
     en sombra, que es exactamente lo que hace el polvo de verdad. Con
     brillo alto se ve sobre todo y parece nieve. */
  brillo: 0.6,
  piso_min: 0.05,    // cuanto se ve mirando en contra del sol
  cerca: 1.6         // m: mas cerca que esto se apaga, o son manchones
};

/* ayudas para probar sin tener que arrastrar hasta encontrar la vista:
   ?p=3 arranca en ese punto, ?mira=yaw,pitch fija hacia donde se mira,
   ?polvo=0 lo apaga para comparar con y sin */
var PAR = new URLSearchParams(location.search);
var INICIO = Math.max(1, Math.min(3, parseInt(PAR.get('p') || '1', 10))) - 1;
var HAY_POLVO = PAR.get('polvo') !== '0';
/* las tres perillas del polvo, abiertas por URL para poder ajustarlas
   mirando la pagina en vez de a ciegas: ?n= cantidad de motas,
   ?brillo= cuanto suman, ?radio= que tan ancho es el haz */
var N_POLVO = parseInt(PAR.get('n') || '0', 10);
var BRILLO_POLVO = parseFloat(PAR.get('brillo') || '0');
var RADIO_POLVO = parseFloat(PAR.get('radio') || '0');

/* viento: amplitudes en pixeles del equirect de 6000x3000.
   ?planta= y ?sombra= para ajustar, ?masc=0 para apagarlo */
if (PAR.get('luz') === '1') luzOn = true;   // arrancar con las lamparas prendidas
var HAY_MASC = PAR.get('masc') !== '0';
var AMP_PLANTA = parseFloat(PAR.get('planta') || '3.0');
var AMP_SOMBRA = parseFloat(PAR.get('sombra') || '7.0');

var canvas = document.getElementById('c');
var engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:false, stencil:false });
var scene  = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.07,0.07,0.07,1);

/* ---------- shader del panorama ----------
   La convencion de los equirect salio de proyectar el quad de la tele
   sobre las tres imagenes hasta que el contorno calzo con la pantalla:
   en el espacio del modelo es u = 0.5 - atan2(x,z)/2pi. Aca la X ya
   viene negada (ver delModelo), asi que queda +atan2. */
BABYLON.Effect.ShadersStore['panoVertexShader'] = [
  'precision highp float;',
  'attribute vec3 position;',
  'uniform mat4 worldViewProjection;',
  'varying vec3 vDir;',
  'void main(void){',
  '  vDir = position;',
  '  gl_Position = worldViewProjection * vec4(position, 1.0);',
  '}'
].join('\n');

/* ---------- viento sobre la planta y su sombra ----------
   No se mueve nada: se mueve DE DONDE se lee cada pixel. Al (u,v) se le
   suma un empujon chico y animado antes de muestrear la foto, y el
   empujon se multiplica por una mascara, asi que solo pasa donde
   queremos. La mascara (assets/mascara3.jpg) trae tres canales:
     R = la planta        (salio del verdor: es lo unico verde de la sala)
     G = su sombra        (salio de comparar cada pixel con su entorno)
     B = rigidez, 0 abajo y 1 arriba: sin esto la planta se mueve entera
         y parece una calcomania sacudida; con esto la maceta queda
         firme y solo cabecean las puntas.
   La sombra es una mancha aparte, en la pared, que el shader no
   relaciona con la planta: se le da la MISMA senal de viento con un
   retardo chico, y con eso las dos se ven sincronizadas. Va con mas
   amplitud y en otra direccion porque esta estirada por la proyeccion.
   La amplitud se cuenta en pixeles del equirect de 6000x3000: son dos o
   tres. Mas que eso arrastra pared en el borde de las hojas. */
BABYLON.Effect.ShadersStore['panoFragmentShader'] = [
  'precision highp float;',
  'varying vec3 vDir;',
  'uniform sampler2D pano;',
  'uniform sampler2D mascara;',
  'uniform float opacidad;',
  'uniform float tiempo;',
  'uniform float usaMasc;',
  'uniform float ampPlanta;',
  'uniform float ampSombra;',
  'uniform float retSombra;',
  'const float PI = 3.14159265359;',
  'const vec2 PXUV = vec2(1.0/6000.0, 1.0/3000.0);',
  /* dos capas: las ramas, lentas y amplias, y las hojas, mas rapidas y
     chicas. Una sola capa da movimiento de gelatina. */
  'vec2 soplo(vec2 uv, float t){',
  '  float ramas = sin(uv.y*16.0 + t*0.90)*0.6 + sin(uv.x*22.0 - t*0.70)*0.4;',
  '  float hojas = sin(uv.y*70.0 + t*2.40)*0.5 + sin(uv.x*85.0 + t*1.90)*0.5;',
  '  return vec2(ramas + 0.35*hojas, 0.0);',
  '}',
  'void main(void){',
  '  vec3 d = normalize(vDir);',
  '  float u = 0.5 + atan(d.x, d.z) / (2.0 * PI);',
  '  float v = 0.5 - asin(clamp(d.y, -1.0, 1.0)) / PI;',
  '  vec2 uv = vec2(u, v);',
  '  if (usaMasc > 0.5){',
  '    vec3 m = texture2D(mascara, uv).rgb;',
  '    if (m.r + m.g > 0.012){',
  /* rafaga: el viento no sopla parejo, va y viene. Dos senos de periodo
     distinto para que no se note el ciclo. */
  '      float raf = 0.55 + 0.45 * sin(tiempo*0.21) * sin(tiempo*0.13 + 1.7);',
  '      vec2 desp = vec2(0.0);',
  '      if (m.r > 0.004){',
  '        float s = soplo(uv, tiempo).x;',
  '        desp += vec2(1.0, -0.25) * s * raf * m.b * m.r * ampPlanta;',
  '      }',
  '      if (m.g > 0.004){',
  '        float s = soplo(uv, tiempo - retSombra).x;',
  '        desp += vec2(-0.8, -0.6) * s * raf * m.b * m.g * ampSombra;',
  '      }',
  '      uv += desp * PXUV;',
  '    }',
  '  }',
  '  gl_FragColor = vec4(texture2D(pano, uv).rgb, opacidad);',
  '}'
].join('\n');

function hacerEsfera(nombre){
  var m = BABYLON.MeshBuilder.CreateSphere(nombre, {
    diameter: RADIO*2, segments: 48, sideOrientation: BABYLON.Mesh.BACKSIDE
  }, scene);
  var mat = new BABYLON.ShaderMaterial(nombre+'-mat', scene, 'pano', {
    attributes:['position'],
    uniforms:['worldViewProjection','opacidad','tiempo','usaMasc',
              'ampPlanta','ampSombra','retSombra'],
    samplers:['pano','mascara'], needAlphaBlending:true
  });
  mat.backFaceCulling = false;
  mat.setFloat('opacidad', 1.0);
  mat.setFloat('tiempo', 0);
  mat.setFloat('usaMasc', 0);
  mat.setFloat('ampPlanta', AMP_PLANTA);
  mat.setFloat('ampSombra', AMP_SOMBRA);
  mat.setFloat('retSombra', 0.14);
  m.material = mat;
  m.isPickable = false;
  m.infiniteDistance = false;
  return m;
}

/* dos esferas: la del punto donde estoy y la del destino. Durante la
   transicion cada una queda anclada a SU punto, no a la camara: por
   eso al avanzar el panorama viejo se agranda y da sensacion de
   movimiento en vez de un fundido plano. */
var esferaA = hacerEsfera('panoA');
var esferaB = hacerEsfera('panoB');
esferaB.setEnabled(false);
esferaB.material.alphaIndex = 1;
esferaA.material.alphaIndex = 0;

/* La mascara es del panorama 03 y nada mas: la planta cae en otro lugar
   de cada equirect, asi que cada punto necesitaria la suya. En el 01 y
   el 02 se ve chica y lejos, no se notaria el movimiento. */
var PANO_CON_MASCARA = 2;
var T0_VIENTO = performance.now();
var texMascara = new BABYLON.Texture('assets/mascara3.jpg', scene, true, false,
                   BABYLON.Texture.BILINEAR_SAMPLINGMODE);
texMascara.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
texMascara.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
esferaA.material.setTexture('mascara', texMascara);
esferaB.material.setTexture('mascara', texMascara);

function ponerPano(mat, tex, indice){
  mat.setTexture('pano', tex);
  mat.setFloat('usaMasc', (HAY_MASC && indice === PANO_CON_MASCARA) ? 1 : 0);
}

/* Los panoramas vienen a 6000x3000, pero muchas GPU de celular topan
   en 4096 y una textura mas grande directamente no carga: ahi va la
   copia de 4000x2000. Se decide con el limite que declara el aparato. */
var SUFIJO = (engine.getCaps().maxTextureSize >= 6000) ? '.jpg' : '-mob.jpg';

/* La cache va por ruta y no por indice, porque un mismo punto puede
   tener dos panoramas. Y la ruta la decide el estado de la luz: asi, si
   prendes las lamparas, te vas a otro punto y volves, siguen prendidas. */
var texturas = {};
function rutaPano(i){
  return (luzOn && PUNTOS[i].luz) ? PUNTOS[i].luz : PUNTOS[i].pano;
}
function cargarPano(i, cb){
  var url = rutaPano(i) + SUFIJO;
  if (texturas[url]) { cb(texturas[url]); return; }
  var t = new BABYLON.Texture(url, scene, true, false,
            BABYLON.Texture.BILINEAR_SAMPLINGMODE, function(){ cb(t); });
  t.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
  t.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
  t.anisotropicFilteringLevel = 8;
  texturas[url] = t;
}

/* ---------- camara ----------
   La camara cuelga de un nodo ("rig") que se para en cada punto y
   gira solo en Y. Asi el sensor puede escribir la rotacion de la
   camara mientras el dedo sigue corriendo el rig: los dos controles
   conviven en vez de pelearse. */
var rig = new BABYLON.TransformNode('rig', scene);
rig.position = PUNTOS[INICIO].p.clone();

var cam = new BABYLON.FreeCamera('cam', BABYLON.Vector3.Zero(), scene);
cam.parent = rig;
cam.position = BABYLON.Vector3.Zero();
cam.minZ = 0.05;
cam.maxZ = 200;
cam.fov  = 1.15;
var yaw = Math.PI, pitch = 0;   // arranca mirando hacia -Z (al interior)
if (PAR.get('mira')){
  var _m = PAR.get('mira').split(',');
  yaw = parseFloat(_m[0]) || 0;
  pitch = parseFloat(_m[1] || '0') || 0;
}
var rigYaw = 0;                 // giro que agrega el dedo con el sensor prendido
var sensorOn = false;

/* control propio: mas predecible que attachControl para un 360.
   Se llevan TODOS los punteros activos y no solo el ultimo. Hacen falta
   los dos para el pellizco, y ademas al levantar uno de los dos dedos
   hay que volver a anclar el arrastre en el que queda: si no, la vista
   pega un salto del tamano de la separacion entre los dedos. */
var FOV_MIN = 0.45, FOV_MAX = 1.5;
function ponerFov(v){ cam.fov = Math.max(FOV_MIN, Math.min(FOV_MAX, v)); }

var arrastrando = false, lx = 0, ly = 0, movido = 0;
var dedos = [];            // {id, x, y}, en orden de aparicion
var pellizco = 0;          // separacion entre los dos dedos al empezar
var fovPellizco = 0;       // el fov que habia en ese momento

function indiceDedo(id){
  for (var i = 0; i < dedos.length; i++) if (dedos[i].id === id) return i;
  return -1;
}
function separacion(){
  var dx = dedos[0].x - dedos[1].x, dy = dedos[0].y - dedos[1].y;
  return Math.sqrt(dx * dx + dy * dy);
}

canvas.addEventListener('pointerdown', function(e){
  if (indiceDedo(e.pointerId) < 0) dedos.push({id:e.pointerId, x:e.clientX, y:e.clientY});
  canvas.setPointerCapture(e.pointerId);

  if (dedos.length === 1){
    arrastrando = true; movido = 0; lx = e.clientX; ly = e.clientY;
  } else if (dedos.length === 2){
    /* el segundo dedo corta el arrastre y abre el pellizco */
    arrastrando = false;
    pellizco = separacion();
    fovPellizco = cam.fov;
  }
});

canvas.addEventListener('pointermove', function(e){
  var i = indiceDedo(e.pointerId);
  if (i < 0) return;
  dedos[i].x = e.clientX; dedos[i].y = e.clientY;

  if (dedos.length >= 2){
    if (!pellizco) return;
    var d = separacion();
    if (!d) return;
    /* separar los dedos achica el campo de vision, o sea acerca */
    ponerFov(fovPellizco * (pellizco / d));
    /* un pellizco no es un toque: que no dispare hotspots al soltar */
    movido = 999;
    return;
  }

  if (!arrastrando) return;
  var dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  movido += Math.abs(dx) + Math.abs(dy);
  if (sensorOn){
    /* con el sensor prendido el dedo solo corre el eje horizontal:
       la inclinacion la manda el aparato */
    rigYaw -= dx * 0.0026;
  } else {
    yaw   -= dx * 0.0026;
    pitch -= dy * 0.0026;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
  }
});

function soltarDedo(e){
  var i = indiceDedo(e.pointerId);
  if (i >= 0) dedos.splice(i, 1);
  try { canvas.releasePointerCapture(e.pointerId); } catch(_){}

  if (dedos.length < 2) pellizco = 0;

  if (dedos.length === 1){
    /* queda uno: se reancla el arrastre donde esta ahora */
    lx = dedos[0].x; ly = dedos[0].y;
    arrastrando = true;
  } else if (dedos.length === 0){
    arrastrando = false;
  }
}
canvas.addEventListener('pointerup', soltarDedo);
/* pointercancel es el que llega cuando el navegador se queda con el
   gesto: sin esto el dedo queda pegado en la lista y el visor se
   trababa creyendo que todavia hay dos */
canvas.addEventListener('pointercancel', soltarDedo);

canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  ponerFov(cam.fov + (e.deltaY > 0 ? 0.06 : -0.06));
}, { passive:false });

/* ---------- la tele ---------- */
var video = null, videoTex = null, planoTv = null, hotspot = null;

function crearHotspot(){
  var dt = new BABYLON.DynamicTexture('hs', {width:256, height:256}, scene, true);
  var ctx = dt.getContext();
  ctx.clearRect(0,0,256,256);
  ctx.beginPath(); ctx.arc(128,128,78,0,Math.PI*2);
  ctx.fillStyle = 'rgba(11,11,11,0.42)'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#9dbba4'; ctx.stroke();
  ctx.beginPath(); ctx.arc(128,128,98,-0.5,0.5);
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(157,187,164,0.45)'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(113,96); ctx.lineTo(113,160); ctx.lineTo(168,128);
  ctx.closePath(); ctx.fillStyle = '#9dbba4'; ctx.fill();
  dt.hasAlpha = true; dt.update();

  var mat = new BABYLON.StandardMaterial('hs-mat', scene);
  mat.diffuseTexture = dt;
  mat.opacityTexture = dt;
  mat.emissiveColor = new BABYLON.Color3(1,1,1);
  mat.disableLighting = true;
  mat.backFaceCulling = false;

  var p = BABYLON.MeshBuilder.CreatePlane('hotspot-tv', {size:0.25}, scene);
  p.material = mat;
  p.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  p.position = TV.centro.add(new BABYLON.Vector3(0.14, 0, 0));
  p.renderingGroupId = 1;
  return p;
}

function crearTv(){
  video = document.createElement('video');
  video.src = 'assets/tv.mp4';
  video.crossOrigin = 'anonymous';
  video.loop = true;
  video.playsInline = true;
  video.setAttribute('playsinline','');
  video.preload = 'auto';

  videoTex = new BABYLON.VideoTexture('tv', video, scene, true, false);
  var mat = new BABYLON.StandardMaterial('tv-mat', scene);
  mat.emissiveTexture = videoTex;
  mat.diffuseColor = new BABYLON.Color3(0,0,0);
  mat.specularColor = new BABYLON.Color3(0,0,0);
  mat.disableLighting = true;

  /* el plano ocupa la pantalla entera y el video (16:9) se recorta a
     los costados para llenarla: la pantalla del render es mas cuadrada
     (1.42) y con barras negras se notaba que no calzaba */
  var rPantalla = TV.ancho / TV.alto;
  var rVideo = 16/9;
  videoTex.uScale = rPantalla / rVideo;
  videoTex.uOffset = (1 - videoTex.uScale) / 2;

  planoTv = BABYLON.MeshBuilder.CreatePlane('tv', {width:TV.ancho, height:TV.alto}, scene);
  planoTv.material = mat;
  planoTv.rotation.y = Math.PI/2;               // la pantalla se mira desde +X (X ya viene negada)
  /* exactamente en el plano de la pantalla: no hay geometria real
     detras (el fondo es la esfera del panorama), asi que no hace falta
     separarlo, y separarlo lo corria en perspectiva */
  planoTv.position = TV.centro.clone();
  planoTv.setEnabled(false);
  planoTv.isPickable = false;
}

/* La tele se prende solo desde el 02 y el 03: desde el 01 queda de
   costado y lejos, y el hotspot ahi molestaba mas de lo que servia. */
var PUNTOS_TV = [1, 2];
var tvOn = false;

function verHotspotTv(){
  if (!hotspot) return;
  hotspot.setEnabled(!tvOn && PUNTOS_TV.indexOf(actual) >= 0);
}

function encenderTv(){
  planoTv.setEnabled(true);
  tvOn = true;
  verHotspotTv();
  document.getElementById('tvui').style.display = 'flex';
  var pr = video.play();
  if (pr && pr.catch) pr.catch(function(){});
}
function apagarTv(){
  video.pause();
  video.currentTime = 0;
  planoTv.setEnabled(false);
  tvOn = false;
  verHotspotTv();
  document.getElementById('tvui').style.display = 'none';
}

/* ---------- interruptor de las lamparas del comedor ----------
   Va colgado justo debajo de las pantallas: la posicion salio de leer
   las lamparas en el panorama 02 (u=0.355, v=0.535) y tirar ese rayo a
   3 metros. Solo se ve estando en el 02, que es el unico punto que
   tiene la version con la luz prendida. */
var LAMPARAS = PUNTOS[PUNTO_LUZ].p.add(
                 new BABYLON.Vector3(-0.7867, -0.1097, 0.6075).scale(3.0));
var interruptor = null, texLlave = [null, null];

function texInterruptor(on){
  var dt = new BABYLON.DynamicTexture('llave'+(on?1:0), {width:256, height:256}, scene, true);
  var ctx = dt.getContext();
  ctx.clearRect(0,0,256,256);
  /* prendido: un halo tibio detras, que es lo que se lee de lejos */
  if (on){
    var g = ctx.createRadialGradient(128,128,60, 128,128,126);
    g.addColorStop(0, 'rgba(157,187,164,0.45)');
    g.addColorStop(1, 'rgba(157,187,164,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
  }
  /* el fondo del circulo queda oscuro en los dos estados: el halo ya
     dice que esta prendido, y con el circulo claro la tecla se perdia */
  ctx.beginPath(); ctx.arc(128,128,86,0,Math.PI*2);
  ctx.fillStyle = 'rgba(11,11,11,0.44)';
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#9dbba4'; ctx.stroke();
  /* la llave: un marco con la tecla arriba o abajo. A este tamano un
     dibujo de lampara no se entiende; una tecla si. */
  ctx.lineWidth = 4; ctx.strokeStyle = '#9dbba4';
  ctx.strokeRect(96, 74, 64, 108);
  ctx.fillStyle = on ? '#9dbba4' : 'rgba(157,187,164,0.5)';
  if (on) ctx.fillRect(102, 80, 52, 47);
  else    ctx.fillRect(102, 129, 52, 47);
  dt.hasAlpha = true; dt.update();
  return dt;
}

function crearInterruptor(){
  texLlave[0] = texInterruptor(false);
  texLlave[1] = texInterruptor(true);
  var mat = new BABYLON.StandardMaterial('llave-mat', scene);
  mat.diffuseTexture = texLlave[0];
  mat.opacityTexture = texLlave[0];
  mat.emissiveColor = new BABYLON.Color3(1,1,1);
  mat.disableLighting = true;
  mat.backFaceCulling = false;

  var p = BABYLON.MeshBuilder.CreatePlane('interruptor', {size:0.6}, scene);
  p.material = mat;
  p.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  p.position = LAMPARAS.clone();
  p.renderingGroupId = 1;
  p.setEnabled(false);
  return p;
}

function pintarInterruptor(){
  if (!interruptor) return;
  var t = texLlave[luzOn ? 1 : 0];
  interruptor.material.diffuseTexture = t;
  interruptor.material.opacityTexture = t;
}

/* Cambia el panorama del punto donde estoy con un fundido, sin moverme:
   se reusa la segunda esfera, anclada al mismo lugar. */
function fundirEnElLugar(){
  if (enViaje) return;
  enViaje = true;
  var aqui = PUNTOS[actual].p.clone();
  cargarPano(actual, function(tex){
    ponerPano(esferaB.material, tex, actual);
    esferaB.position = aqui.clone();
    esferaB.material.setFloat('opacidad', 0.0);
    esferaB.setEnabled(true);
    var t0 = performance.now(), dur = 700;
    var obs = scene.onBeforeRenderObservable.add(function(){
      var k = Math.min(1, (performance.now() - t0) / dur);
      esferaB.material.setFloat('opacidad', k);
      if (k >= 1){
        scene.onBeforeRenderObservable.remove(obs);
        ponerPano(esferaA.material, tex, actual);
        esferaA.position = aqui.clone();
        esferaB.setEnabled(false);
        enViaje = false;
      }
    });
  });
}

function alternarLuz(){
  if (enViaje) return;
  luzOn = !luzOn;
  pintarInterruptor();
  fundirEnElLugar();
}

/* ---------- discos para saltar de punto ---------- */
var discos = [];
function crearDiscos(){
  var dt = new BABYLON.DynamicTexture('disco', {width:256, height:256}, scene, true);
  var ctx = dt.getContext();
  ctx.clearRect(0,0,256,256);
  ctx.beginPath(); ctx.arc(128,128,94,0,Math.PI*2);
  ctx.fillStyle = 'rgba(157,187,164,0.14)'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(157,187,164,0.9)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(128,128,22,0,Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  dt.hasAlpha = true; dt.update();

  for (var i=0;i<PUNTOS.length;i++){
    var mat = new BABYLON.StandardMaterial('disco-mat'+i, scene);
    mat.diffuseTexture = dt;
    mat.opacityTexture = dt;
    mat.emissiveColor = new BABYLON.Color3(1,1,1);
    mat.disableLighting = true;
    mat.backFaceCulling = false;

    var d = BABYLON.MeshBuilder.CreatePlane('ir-'+i, {size:0.45}, scene);
    d.material = mat;
    d.rotation.x = Math.PI/2;
    d.position = PUNTOS[i].p.add(new BABYLON.Vector3(0, -ALTURA_OJOS, 0));
    d.renderingGroupId = 1;
    discos.push(d);
  }
}

/* ---------- polvo en el rayo de sol ----------
   Es lo unico de la escena que se dibuja de verdad en 3D, y funciona
   porque suma luz en vez de tener que igualar un material: con blending
   aditivo no hay nada que "calce mal" con el render.
   Tres cosas lo hacen creible y las tres son faciles de arruinar:
   1. Vive SOLO dentro del haz. Si se emite en toda la sala parece nieve.
   2. Se ve fuerte solo mirando hacia el sol (dispersion hacia adelante).
      Con brillo constante queda mal y no se entiende por que.
   3. Cae a 2 cm por segundo. A velocidad de particula de videojuego,
      se arruina.
   Las posiciones se escriben en coordenadas del mundo (por eso el
   emisor es el origen y hay startPositionFunction propia): asi el haz
   queda quieto en la sala y se ve distinto desde cada punto, como
   corresponde. */
var polvo = null, visPolvo = 0;
var EJE_U = BABYLON.Vector3.Cross(SOL, BABYLON.Axis.Y).normalize();
var EJE_V = BABYLON.Vector3.Cross(SOL, EJE_U).normalize();

function texMota(){
  var dt = new BABYLON.DynamicTexture('mota', {width:64, height:64}, scene, true);
  var ctx = dt.getContext();
  var g = ctx.createRadialGradient(32,32,0, 32,32,32);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.22,'rgba(255,255,255,0.5)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  dt.hasAlpha = true; dt.update();
  return dt;
}

function crearPolvo(){
  if (N_POLVO > 0) RAYO.cantidad = N_POLVO;
  if (BRILLO_POLVO > 0) RAYO.brillo = BRILLO_POLVO;
  if (RADIO_POLVO > 0) RAYO.radio = RADIO_POLVO;
  polvo = new BABYLON.ParticleSystem('polvo', Math.ceil(RAYO.cantidad * 1.35), scene);
  polvo.particleTexture = texMota();
  polvo.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  polvo.emitter = BABYLON.Vector3.Zero();

  /* un cilindro alrededor del segmento piso -> sol, apenas mas abierto
     arriba. La raiz cuadrada reparte parejo en el disco: sin eso se
     amontonan todas en el eje. */
  polvo.startPositionFunction = function(m, out, part){
    var s = Math.random();
    var r = Math.sqrt(Math.random()) * (RAYO.radio + s * RAYO.ensancha);
    var a = Math.random() * Math.PI * 2;
    out.copyFrom(RAYO.piso);
    out.addInPlace(SOL.scale(s * RAYO.largo));
    out.addInPlace(EJE_U.scale(Math.cos(a) * r));
    out.addInPlace(EJE_V.scale(Math.sin(a) * r));
    part.__a0 = 0.25 + Math.random() * 0.75;   // cada mota con su brillo
  };
  polvo.startDirectionFunction = function(m, out){
    out.set((Math.random()-0.5) * 0.018,
            -RAYO.caida * (0.45 + Math.random()),
            (Math.random()-0.5) * 0.018);
  };
  polvo.minEmitPower = 1; polvo.maxEmitPower = 1;
  polvo.minLifeTime = RAYO.vida[0]; polvo.maxLifeTime = RAYO.vida[1];
  polvo.minSize = RAYO.tam[0]; polvo.maxSize = RAYO.tam[1];
  polvo.color1 = new BABYLON.Color4(1, 0.97, 0.90, 1);
  polvo.color2 = new BABYLON.Color4(1, 0.93, 0.82, 1);
  polvo.colorDead = new BABYLON.Color4(1, 0.95, 0.86, 0);
  polvo.gravity = new BABYLON.Vector3(0, -0.0015, 0);
  /* con updateSpeed 1/60 el paso equivale a un segundo real, asi que
     vidas y velocidades de arriba estan en segundos y m/s de verdad */
  polvo.updateSpeed = 1/60;
  polvo.emitRate = RAYO.cantidad / ((RAYO.vida[0] + RAYO.vida[1]) / 2);
  /* despues de la esfera del panorama, que es transparente y se dibuja
     al final del grupo 0: en el mismo grupo el polvo quedaria tapado */
  polvo.renderingGroupId = 1;
  /* sin esto el haz tarda 20 segundos en poblarse y arranca vacio */
  polvo.preWarmCycles = 220;
  polvo.preWarmStepOffset = 6;

  /* la opacidad la manejamos nosotros: la de Babylon se interpola sola
     hacia colorDead y no hay forma de modularla por frame sin que se
     acumule. Aca se ESCRIBE cada frame (no se multiplica) a partir del
     brillo propio de la mota, su edad y cuanto se mira hacia el sol. */
  var updBase = polvo.updateFunction;
  polvo.updateFunction = function(parts){
    updBase.call(polvo, parts);
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      var t = p.age / p.lifeTime;
      var f = Math.min(1, t * 6) * Math.min(1, (1 - t) * 6);   // entra y sale
      /* el haz pasa a dos metros de la cabeza: una mota a 30 cm se
         dibuja del tamano de una pelota. Se apagan las muy cercanas. */
      var dx = p.position.x - _camPos.x,
          dy = p.position.y - _camPos.y,
          dz = p.position.z - _camPos.z;
      var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist < RAYO.cerca) f *= dist / RAYO.cerca;
      p.color.a = (p.__a0 || 0.6) * f * visPolvo;
    }
  };
  polvo.start();
}

/* hacia donde mira la camara y donde esta, en coordenadas del mundo.
   Lo usan el polvo (para la dispersion) y el plano (para el cono), asi
   que se calcula una sola vez por cuadro en el bucle principal. */
var _fwd = BABYLON.Vector3.Zero();
var _camPos = BABYLON.Vector3.Zero();
function mirarDesde(){
  _camPos.copyFrom(cam.globalPosition);
  cam.getDirectionToRef(BABYLON.Axis.Z, _fwd);
}
function actualizarPolvo(){
  if (!polvo) return;
  var d = BABYLON.Vector3.Dot(_fwd, SOL);
  /* dispersion hacia adelante: brilla mirando al sol y casi desaparece
     de espaldas. El exponente es lo que le da el corte. */
  visPolvo = RAYO.brillo * (RAYO.piso_min +
             (1 - RAYO.piso_min) * Math.pow(Math.max(0, d), 2.2));
}

/* ---------- planta con la posicion y hacia donde se mira ----------
   Como se ato el plano al modelo: Rodrigo marco los tres puntos a mano
   sobre el plano. Ajustar giro y escala con esas tres marcas sale mal,
   porque los tres puntos estan casi alineados (el angulo en el 02 es de
   139 grados) y ahi un error de 20 cm al poner una marca gira todo. Asi
   que se uso otra cosa:
   - El GIRO sale de los propios panoramas. Desde el 03 el balcon cae
     hacia -Z y la cocina hacia +Z; en el plano el balcon esta a la
     izquierda y la cocina a la derecha. El sillon cae hacia -X y en el
     plano esta arriba. O sea: plano_x crece con z, plano_y crece con x.
     Las tres marcas de Rodrigo respetan ese orden, lo que confirma que
     la correspondencia es esa.
   - La ESCALA sale de las medidas escritas en el plano: el estar de
     5,13 m mide 1193 px, o sea 232,6 px/m.
   - La TRASLACION es lo unico que sale de las marcas, y por promedio.
   Con eso los tres puntos quedan exactos entre si (vienen del .glb) y
   apoyados donde Rodrigo los marco. */
var MAPA = {
  esc: 232.6,                                   // px del plano por metro
  ref: { x:165.649989, z:-449.006941 },         // centro de los tres puntos
  refPx: { x:1052.1, y:467.97 },                // su lugar en el plano
  radio: 430                                    // largo del cono, en px del plano
};

function aPlano(p){
  return {
    x: MAPA.refPx.x + MAPA.esc * (p.z - MAPA.ref.z),
    y: MAPA.refPx.y + MAPA.esc * (p.x - MAPA.ref.x)
  };
}

var mapaCono = document.getElementById('mapa-cono');
var mapaPuntos = [];
var conoAncho = -1;

function crearMapa(){
  var cont = document.getElementById('mapa-puntos');
  var SVG = 'http://www.w3.org/2000/svg';
  PUNTOS.forEach(function(pt, i){
    var q = aPlano(pt.p);
    var g = document.createElementNS(SVG, 'g');
    g.setAttribute('class', 'punto');
    g.setAttribute('transform', 'translate(' + q.x.toFixed(1) + ',' + q.y.toFixed(1) + ')');
    var c = document.createElementNS(SVG, 'circle');
    c.setAttribute('r', 62);
    var t = document.createElementNS(SVG, 'text');
    t.textContent = pt.n;
    g.appendChild(c); g.appendChild(t);
    g.addEventListener('click', function(e){ e.stopPropagation(); irA(i); });
    cont.appendChild(g);
    mapaPuntos.push(g);
  });
  /* el plano entero agranda y achica */
  var caja = document.getElementById('mapa');
  caja.addEventListener('click', function(){ this.classList.toggle('grande'); });
  if (PAR.get('plano') === '1') caja.classList.add('grande');
}

function marcarMapa(){
  for (var i = 0; i < mapaPuntos.length; i++){
    mapaPuntos[i].setAttribute('class', 'punto' + (i === actual ? ' aqui' : ''));
  }
}

function actualizarMapa(){
  if (!mapaCono) return;
  var q = aPlano(rig.position);
  /* el angulo en el plano es el mismo atan2(x, z) que usa el shader del
     panorama, porque plano_x va con z y plano_y va con x */
  var ang = Math.atan2(_fwd.x, _fwd.z) * 180 / Math.PI;
  mapaCono.setAttribute('transform',
    'translate(' + q.x.toFixed(1) + ',' + q.y.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')');

  /* la abertura del cono es la real de la camara: el fov de Babylon es
     el vertical, asi que hay que pasarlo a horizontal con la relacion
     de la pantalla */
  var rel = engine.getRenderWidth() / Math.max(1, engine.getRenderHeight());
  var mitad = Math.atan(Math.tan(cam.fov / 2) * rel);
  if (Math.abs(mitad - conoAncho) > 0.004){
    conoAncho = mitad;
    var R = MAPA.radio, c = Math.cos(mitad) * R, s = Math.sin(mitad) * R;
    mapaCono.setAttribute('d',
      'M0 0 L' + c.toFixed(1) + ' ' + (-s).toFixed(1) +
      ' A' + R + ' ' + R + ' 0 0 1 ' + c.toFixed(1) + ' ' + s.toFixed(1) + ' Z');
  }
}

/* ---------- navegacion ---------- */
var actual = INICIO, enViaje = false;

function irA(destino){
  if (enViaje || destino === actual) return;
  enViaje = true;
  var desde = rig.position.clone();
  var hasta = PUNTOS[destino].p.clone();

  cargarPano(destino, function(tex){
    ponerPano(esferaB.material, tex, destino);
    esferaB.position = hasta.clone();
    esferaB.material.setFloat('opacidad', 0.0);
    esferaB.setEnabled(true);

    var t0 = performance.now(), dur = 950;
    var obs = scene.onBeforeRenderObservable.add(function(){
      var k = Math.min(1, (performance.now() - t0) / dur);
      var e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;   // easeInOutQuad
      rig.position = BABYLON.Vector3.Lerp(desde, hasta, e);
      esferaB.material.setFloat('opacidad', Math.min(1, Math.max(0, (k - 0.15) / 0.6)));
      if (k >= 1){
        scene.onBeforeRenderObservable.remove(obs);
        esferaA.position = hasta.clone();
        ponerPano(esferaA.material, tex, destino);
        esferaB.setEnabled(false);
        rig.position = hasta.clone();
        actual = destino;
        enViaje = false;
        marcarBotones();
      }
    });
  });
}

function marcarBotones(){
  var bs = document.querySelectorAll('#puntos button');
  for (var i=0;i<bs.length;i++) bs[i].className = (i===actual ? 'on' : '');
  for (var j=0;j<discos.length;j++) discos[j].setEnabled(j !== actual);
  /* el interruptor solo en el 02: es el unico punto con las dos versiones */
  if (interruptor) interruptor.setEnabled(actual === PUNTO_LUZ);
  verHotspotTv();
  marcarMapa();
}

/* clicks en la escena (solo si no fue un arrastre) */
scene.onPointerObservable.add(function(pi){
  if (pi.type !== BABYLON.PointerEventTypes.POINTERUP) return;
  if (movido > 9) return;
  var pick = scene.pick(scene.pointerX, scene.pointerY);
  if (!pick || !pick.hit || !pick.pickedMesh) return;
  var n = pick.pickedMesh.name;
  if (n === 'hotspot-tv') encenderTv();
  else if (n === 'interruptor') alternarLuz();
  else if (n.indexOf('ir-') === 0) irA(parseInt(n.split('-')[1], 10));
});

/* ---------- arranque ---------- */
var cont = document.getElementById('puntos');
PUNTOS.forEach(function(p, i){
  var b = document.createElement('button');
  b.textContent = p.n;
  b.onclick = function(){ irA(i); };
  cont.appendChild(b);
});
document.getElementById('btn-apagar').onclick = apagarTv;
document.getElementById('btn-pausa').onclick = function(){
  if (video.paused){ video.play(); this.textContent = 'Pausar'; }
  else { video.pause(); this.textContent = 'Seguir'; }
};

crearTv();
hotspot = crearHotspot();
crearDiscos();
interruptor = crearInterruptor();
pintarInterruptor();
crearMapa();
if (HAY_POLVO) crearPolvo();

cargarPano(INICIO, function(tex){
  ponerPano(esferaA.material, tex, INICIO);
  esferaA.position = PUNTOS[INICIO].p.clone();
  marcarBotones();
  var ov = document.getElementById('carga');
  ov.className = 'off';
  setTimeout(function(){ ov.style.display = 'none'; }, 600);
});

/* ============================================================
   Control por sensor (giroscopio), igual que en 360/botero-360.html
   - En desktop no aparece: sin giroscopio la vista queda congelada.
   - En iOS 13+ el permiso solo se puede pedir desde un gesto, asi
     que el chip dice "Activar sensor" y con un toque se prende.
     Ojo: iOS ademas exige contexto seguro, o sea HTTPS. Por IP en
     la red local el permiso se rechaza siempre.
   - En Android arranca a un toque, pero recien despues de confirmar
     que el sensor manda datos: hay equipos que exponen la API y
     nunca disparan un evento.
   El calculo (alpha/beta/gamma + rotacion de pantalla) lo hace el
   input de Babylon, que ya resuelve el left-handed.
   ============================================================ */
var permisoPendiente = false, calibrar = false, eventos = 0;
var chip = document.getElementById('sensor');

/* contador aparte, solo para saber si el aparato emite */
window.addEventListener('deviceorientation', function(ev){
  if (ev.alpha !== null || ev.beta !== null || ev.gamma !== null) eventos++;
});

var hayApi   = typeof window.DeviceOrientationEvent !== 'undefined';
var pidePerm = hayApi && typeof DeviceOrientationEvent.requestPermission === 'function';
var esTactil = ('ontouchstart' in window) ||
               (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
/* con ?sensor=1 el chip se muestra igual: sirve para verlo en el
   escritorio, aunque ahi el giroscopio no exista */
var forzar = /[?&]sensor=1/.test(location.search);

function pintarChip(){
  chip.classList.toggle('on', sensorOn);
  chip.textContent = permisoPendiente ? 'Activar sensor' : 'Sensor';
}

/* OJO: inputs.attachInput() no hace nada si la camara nunca paso por
   attachControl (mira attachedToElement), y aca los controles son
   propios. Por eso hay que vaciar los inputs por defecto, agregar el
   de orientacion y recien ahi llamar attachControl: si no, el input
   queda en la lista pero sordo, y el sensor no mueve nada. */
function prenderSensor(){
  cam.rotationQuaternion = BABYLON.Quaternion.RotationYawPitchRoll(yaw, pitch, 0);
  /* fuera los inputs por defecto: si quedan, attachControl tambien los
     engancha y el mouse/touch de Babylon se suma al control propio */
  cam.inputs.removeByType('FreeCameraKeyboardMoveInput');
  cam.inputs.removeByType('FreeCameraMouseInput');
  cam.inputs.removeByType('FreeCameraTouchInput');
  cam.inputs.addDeviceOrientation();
  cam.attachControl(canvas, true);
  sensorOn = true;
  permisoPendiente = false;
  calibrar = true;    // en el primer frame se alinea con lo que estabas mirando
  eventos = 0;
  setTimeout(function(){
    /* si el aparato no mando un solo evento, conviene decirlo en vez
       de dejar la pantalla quieta sin explicacion */
    if (sensorOn && eventos === 0) chip.textContent = 'Sin datos';
  }, 2500);
  pintarChip();
}

function apagarSensor(){
  cam.detachControl(canvas);
  cam.inputs.removeByType('FreeCameraDeviceOrientationInput');
  if (cam.rotationQuaternion){
    var e = cam.rotationQuaternion.toEulerAngles();
    yaw = e.y + rigYaw;               // se conserva hacia donde estabas mirando
    pitch = Math.max(-1.45, Math.min(1.45, e.x));
    cam.rotationQuaternion = null;
  }
  rigYaw = 0;
  rig.rotation.y = 0;
  sensorOn = false;
  pintarChip();
}

chip.addEventListener('click', function(e){
  e.stopPropagation();
  if (sensorOn){ apagarSensor(); return; }
  if (pidePerm){
    DeviceOrientationEvent.requestPermission().then(function(r){
      if (r === 'granted') prenderSensor();
      else { permisoPendiente = false; chip.textContent = 'Sensor bloqueado'; }
    }).catch(function(){
      permisoPendiente = false; chip.textContent = 'Sensor no disponible';
    });
  } else {
    prenderSensor();
  }
});

if (forzar){
  chip.classList.add('visible');
  permisoPendiente = pidePerm;
  pintarChip();
} else if (esTactil && hayApi){
  if (pidePerm){
    permisoPendiente = true;
    chip.classList.add('visible');
    pintarChip();
  } else {
    /* Android: se muestra el chip solo si el sensor emite de verdad */
    var probar = function(ev){
      if (ev.alpha === null && ev.beta === null && ev.gamma === null) return;
      window.removeEventListener('deviceorientation', probar);
      clearTimeout(tProbe);
      chip.classList.add('visible');
      pintarChip();
    };
    var tProbe = setTimeout(function(){
      window.removeEventListener('deviceorientation', probar);
    }, 1800);
    window.addEventListener('deviceorientation', probar);
  }
}

scene.registerBeforeRender(function(){
  if (sensorOn){
    /* al prender el sensor la vista saltaba al norte magnetico: se
       compensa una sola vez con la diferencia contra lo que estabas
       mirando, y de ahi en mas el dedo sigue corriendo el rig */
    if (calibrar && cam.rotationQuaternion){
      rigYaw = yaw - cam.rotationQuaternion.toEulerAngles().y;
      calibrar = false;
    }
    rig.rotation.y = rigYaw;
  } else {
    cam.rotation.set(pitch, yaw, 0);
  }
  mirarDesde();
  actualizarPolvo();
  actualizarMapa();
  /* el reloj del viento, en segundos, para las dos esferas */
  var tv = (performance.now() - T0_VIENTO) / 1000;
  esferaA.material.setFloat('tiempo', tv);
  esferaB.material.setFloat('tiempo', tv);
});

engine.runRenderLoop(function(){ scene.render(); });
window.addEventListener('resize', function(){ engine.resize(); });
</script>
