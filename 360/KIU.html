<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width, shrink-to-fit=no">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <meta charset="UTF-8"/>
        <title>KIU 8 de Octubre — Recorrido 360 | Imabox</title>
        <meta name="description" content="IMABOX was founded in 2018 by Arch. Juan Delgado and Arch. Rodrigo Figueredo. We are a Rendering and 3dart imaging studio based in Montevideo, Uruguay."/>
        <meta name="keywords" content="Imabox - Rendering Visualization Studio"/>
        <meta name="author" content="Rodrigo Figueredo"/>
        <meta property="og:type" content="website"/>
        <meta property="og:title" content="Imabox Rendering Studio"/>
        <meta property="og:description" content="IMABOX was founded in 2018 by Arch. Juan Delgado and Arch. Rodrigo Figueredo. We are a Rendering and 3dart imaging studio based in Montevideo, Uruguay."/>
        <meta property="og:url" content="https://imabox.uy"/>
        <link rel="stylesheet" type="text/css" href="css/pano.css">
        <link rel="shortcut icon" type="image/png" href="../favicon.png"/>

        <style>
            #room-label {
                position: fixed;
                bottom: 64px;
                left: 50%;
                transform: translateX(-50%);
                font-family: 'Courier New', monospace;
                font-size: 0.62rem;
                letter-spacing: 5px;
                color: rgba(255,255,255,0.4);
                text-transform: uppercase;
                pointer-events: none;
                z-index: 5;
            }

            #room-nav {
                position: fixed;
                bottom: 22px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 8px;
                z-index: 5;
            }

            .room-btn {
                background: rgba(0,0,0,0.35);
                border: 1px solid rgba(255,255,255,0.12);
                color: rgba(255,255,255,0.3);
                font-family: 'Courier New', monospace;
                font-size: 0.58rem;
                letter-spacing: 2px;
                text-transform: uppercase;
                padding: 5px 14px;
                border-radius: 20px;
                cursor: pointer;
                transition: all 0.3s ease;
                backdrop-filter: blur(8px);
            }

            .room-btn:hover {
                border-color: rgba(255,255,255,0.35);
                color: rgba(255,255,255,0.65);
            }

            .room-btn.active {
                background: rgba(255,255,255,0.1);
                border-color: rgba(255,255,255,0.45);
                color: rgba(255,255,255,0.85);
            }

        </style>
    </head>

<body>

    <div id="spinner-wrapper">
        <div class="lds-ring">
            <div> </div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <div id="room-label">KIU AV ITALIA</div>
    <div id="room-nav">
        <button class="room-btn active"  onclick="goRoom(0)">Living</button>
        <button class="room-btn"         onclick="goRoom(1)">Dormitorio</button>
    </div>

<script src="js/spinner.js"></script>
<script src="/js/three.min.js"></script>
<script src="/js/panolens.min.js"></script>

<script>

    var lookAtPositions = [
        new THREE.Vector3(800, 0, 0)
    ];

    /* ── Hotspot animado ── */
    function makeHotspot(from, to, x, y, z, label) {
        var S = 256, C = 128;
        var cv  = document.createElement('canvas');
        cv.width = cv.height = S;
        var ctx = cv.getContext('2d');

        // Dibuja el frame inicial en el canvas y exporta como dataURL.
        // Panolens recibe un string válido → no explota con indexOf.
        function drawFrame(p) {
            ctx.clearRect(0, 0, S, S);
            var g = ctx.createRadialGradient(C, C, 2, C, C, 28);
            g.addColorStop(0, 'rgba(255,255,255,0.30)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.beginPath(); ctx.arc(C, C, 28, 0, Math.PI * 2);
            ctx.fillStyle = g; ctx.fill();

            ctx.beginPath(); ctx.arc(C, C, 14 + p * 22, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,' + (0.75 * (1 - p)).toFixed(3) + ')';
            ctx.lineWidth = 2; ctx.stroke();

            ctx.beginPath(); ctx.arc(C, C, 8, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.shadowColor = 'rgba(255,255,255,0.7)';
            ctx.shadowBlur  = 8;
            ctx.fill(); ctx.shadowBlur = 0;
        }

        drawFrame(0);
        var dataURL = cv.toDataURL('image/png');

        // Crear el infospot pasando el dataURL → Panolens OK
        from.link(to, new THREE.Vector3(x, y, z), 900, dataURL);
        var spot = from.children[from.children.length - 1];
        if (label) spot.addHoverText(label);

        // Animar: canvas texture sobreescrita cada frame
        var tex = new THREE.CanvasTexture(cv);
        var t0  = performance.now();

        (function animate() {
            requestAnimationFrame(animate);
            var p = ((performance.now() - t0) % 2200) / 2200;
            drawFrame(p);
            tex.needsUpdate = true;
            if (spot && spot.material) {
                spot.material.map = tex;
            }
        })();
    }

    /* ── Panoramas — igual que antes ── */
    var panorama  = new PANOLENS.ImagePanorama('img/living-703-360.jpg');
    panorama.addEventListener('enter-fade-start', function() {
        viewer.tweenControlCenter(lookAtPositions[0], 0);
        setRoom(0);
    });

    var panorama2 = new PANOLENS.ImagePanorama('img/dormitorio-703-360.jpg');
    panorama2.addEventListener('enter-fade-start', function() {
        viewer.tweenControlCenter(lookAtPositions[0], 0);
        setRoom(1);
    });

    makeHotspot(panorama,  panorama2,  3267, 0,  3918, 'Dormitorio');
    makeHotspot(panorama2, panorama,  -5267, 0, -1918, 'Living');

    viewer = new PANOLENS.Viewer();
    viewer.add(panorama, panorama2);

    /* ── Room nav UI ── */
    var currentRoom = 0;

    function setRoom(idx) {
        currentRoom = idx;
        var names = ['Living', 'Dormitorio'];
        // room-label muestra el nombre del proyecto, no cambia por sala
        document.querySelectorAll('.room-btn').forEach(function(btn, i) {
            btn.classList.toggle('active', i === idx);
        });
    }

    function goRoom(idx) {
        if (idx === currentRoom) return;
        viewer.setPanorama(idx === 0 ? panorama : panorama2);
    }

</script>

</body>
</html>
